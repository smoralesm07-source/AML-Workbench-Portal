name: Deploy ATLAS AML 0.70.5 canonical release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-aml-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Normalize canonical release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,pathlib
          RELEASE='0.70.5'; BUILD='0705'
          for name in ('atlas-release.json','atlas-runtime-manifest.json','build.json'):
              p=pathlib.Path(name)
              d=json.loads(p.read_text(encoding='utf-8'))
              if name=='build.json':
                  d['app_version']=RELEASE; d['build']=BUILD
              else:
                  d['release']=RELEASE; d['build']=BUILD
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=pathlib.Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'data-aml-version="[^"]+"',f'data-aml-version="{RELEASE}"',s,1)
          s=re.sub(r'data-aml-build="[^"]+"',f'data-aml-build="{BUILD}"',s,1)
          s=re.sub(r'data-atlas-release="[^"]+"',f'data-atlas-release="{RELEASE}"',s,1)
          s=re.sub(r'<title>ATLAS AML · v[^<]+</title>',f'<title>ATLAS AML · v{RELEASE}</title>',s,1)
          s=s.replace('atlas-source-health-global-0694.css?v=0694-1','atlas-source-health-global-0694.css?v=0705-1')
          s=s.replace('atlas-source-health-global-0694.js?v=0694-1','atlas-source-health-global-0694.js?v=0705-1')
          s=s.replace('atlas-universo-so-workbench-0700.css?v=0700-1','atlas-universo-so-workbench-0700.css?v=0705-1')
          s=s.replace('atlas-universo-so-workbench-0700.js?v=0704-2','atlas-universo-so-workbench-0700.js?v=0705-1')
          s=s.replace('atlas-operational-recovery-0704.js?v=0704-1','atlas-operational-recovery-0704.js?v=0705-1')
          p.write_text(s,encoding='utf-8')
          print('Normalized source metadata to',RELEASE,BUILD)
          PY

      - name: Validate corrected authorities
        shell: bash
        run: |
          set -euo pipefail
          node --check atlas-release-guard.js
          node --check assets/atlas-source-health-global-0694.js
          node --check assets/atlas-universo-so-workbench-0700.js
          node --check assets/atlas-operational-recovery-0704.js
          grep -q "release:'0.70.5'" atlas-release-guard.js
          grep -q "Workbench canónico 0.70.5" assets/atlas-universo-so-workbench-0700.js
          grep -q "workbench:true" assets/atlas-universo-so-workbench-0700.js
          grep -q "routeAuthority:true" assets/atlas-universo-so-workbench-0700.js
          grep -q "canonical:true" assets/atlas-universo-so-workbench-0700.js
          grep -q "0.70.5" assets/atlas-source-health-global-0694.js

      - name: Compile current runtime
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_atlas_site.py --out _site
          test -s _site/index.html
          test -s _site/atlas-release.json
          test -s _site/atlas-runtime-report.json
          mkdir -p _site/assets
          cp atlas-release-guard.js _site/atlas-release-guard.js
          cp assets/atlas-source-health-global-0694.js _site/assets/atlas-source-health-global-0694.js
          cp assets/atlas-source-health-global-0694.css _site/assets/atlas-source-health-global-0694.css
          cp assets/atlas-universo-so-workbench-0700.js _site/assets/atlas-universo-so-workbench-0700.js
          cp assets/atlas-universo-so-workbench-0700.css _site/assets/atlas-universo-so-workbench-0700.css
          cp assets/atlas-operational-recovery-0704.js _site/assets/atlas-operational-recovery-0704.js
          python - <<'PY'
          import re,pathlib,json
          RELEASE='0.70.5'; BUILD='0705'
          p=pathlib.Path('_site/index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'data-aml-version="[^"]+"',f'data-aml-version="{RELEASE}"',s,1)
          s=re.sub(r'data-aml-build="[^"]+"',f'data-aml-build="{BUILD}"',s,1)
          s=re.sub(r'data-atlas-release="[^"]+"',f'data-atlas-release="{RELEASE}"',s,1)
          s=re.sub(r'<title>ATLAS AML · v[^<]+</title>',f'<title>ATLAS AML · v{RELEASE}</title>',s,1)
          s=s.replace('atlas-source-health-global-0694.css?v=0694-1','atlas-source-health-global-0694.css?v=0705-1')
          s=s.replace('atlas-source-health-global-0694.js?v=0694-1','atlas-source-health-global-0694.js?v=0705-1')
          s=s.replace('atlas-universo-so-workbench-0700.css?v=0700-1','atlas-universo-so-workbench-0700.css?v=0705-1')
          s=s.replace('atlas-universo-so-workbench-0700.js?v=0704-2','atlas-universo-so-workbench-0700.js?v=0705-1')
          s=s.replace('atlas-operational-recovery-0704.js?v=0704-1','atlas-operational-recovery-0704.js?v=0705-1')
          p.write_text(s,encoding='utf-8')
          rp=pathlib.Path('_site/atlas-release.json')
          r=json.loads(rp.read_text(encoding='utf-8')); r['release']=RELEASE; r['build']=BUILD
          rp.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          rtp=pathlib.Path('_site/atlas-runtime-report.json')
          rt=json.loads(rtp.read_text(encoding='utf-8')); rt['release']=RELEASE; rt['build']=BUILD
          rtp.write_text(json.dumps(rt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          grep -q 'data-aml-version="0.70.5"' _site/index.html
          grep -q 'data-aml-build="0705"' _site/index.html
          grep -q 'atlas-source-health-global-0694.js?v=0705-1' _site/index.html
          grep -q 'atlas-universo-so-workbench-0700.js?v=0705-1' _site/index.html

      - name: Vendor public spend snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data/public-spend
          curl --fail --location --retry 4 --retry-delay 2 --max-time 90 \
            'https://raw.githubusercontent.com/smoralesm07-source/Rada_Presupuesto_Abierto/main/docs/data/spend_view_v2.json' \
            -o _site/data/public-spend/spend_view_v2.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload canonical release
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy canonical release
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live 0.70.5
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"; stamp=$(date +%s)
          curl -fsSL --retry 15 --retry-delay 2 "$base/atlas-release.json?_atlas=$stamp" -o /tmp/release.json
          curl -fsSL --retry 15 --retry-delay 2 "$base/?_atlas=$stamp" -o /tmp/index.html
          python - <<'PY'
          import json
          r=json.load(open('/tmp/release.json'))
          assert r['release']=='0.70.5',r
          assert r['build']=='0705',r
          PY
          grep -q 'data-aml-version="0.70.5"' /tmp/index.html
          grep -q 'data-aml-build="0705"' /tmp/index.html
          grep -q 'atlas-universo-so-workbench-0700.js?v=0705-1' /tmp/index.html
          echo 'ATLAS 0.70.5 live verification passed.'
