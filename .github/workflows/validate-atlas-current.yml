name: Validate ATLAS AML current

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-atlas-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load current release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          m=json.load(open('atlas-release.json',encoding='utf-8'))
          print(f"ATLAS_RELEASE={m['release']}")
          print(f"ATLAS_BUILD={m['build']}")
          PY

      - name: Validate source manifest and future-change contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.load(open('atlas-release.json',encoding='utf-8'))
          runtime=json.load(open('atlas-runtime-manifest.json',encoding='utf-8'))
          build=json.load(open('build.json',encoding='utf-8'))
          assert release['release']==runtime['release']==build['app_version']
          assert release['build']==runtime['build']==build['build']
          assert release['runtime_policy']=='CANONICAL_COMPILED_RUNTIME_ONLY'
          assert release['pages_artifact_policy']=='COMPILED_CURRENT_BUNDLES_ONLY'
          assert runtime['policy']=='CANONICAL_SOURCE_MANIFEST_FOR_COMPILED_RUNTIME'
          assert runtime['publish_mode']=='COMPILED_BUNDLES_ONLY'
          assert release['future_change_policy']=='BRANCH_PR_VALIDATE_CURRENT_MERGE_MAIN_AUTO_DEPLOY_LIVE_SMOKE'
          assert build['future_change_policy']==release['future_change_policy']
          html=Path('index.html').read_text(encoding='utf-8')
          assert '<!-- ATLAS_RUNTIME_STYLES -->' in html
          assert '<!-- ATLAS_RUNTIME_SCRIPTS -->' in html
          assert 'atlas-theme-bootstrap.js' in html
          assert 'v040-theme-bootstrap.js' not in html
          sources=[*runtime['styles'],*[x['path'] for x in runtime['scripts']]]
          missing=[x for x in sources if not Path(x).is_file()]
          assert not missing,f'missing source fragments: {missing}'
          PY

      - name: Validate source JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/atlas-js.txt
          import json
          m=json.load(open('atlas-runtime-manifest.json'))
          for x in m['scripts']: print(x['path'])
          PY
          while IFS= read -r f; do node --check "$f"; done < /tmp/atlas-js.txt
          node --check atlas-release-guard.js
          node --check atlas-theme-bootstrap.js
          node --check tools/build_atlas_site.py >/dev/null 2>&1 || true

      - name: Build exact compiled Pages candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_atlas_site.py --out _site-test
          test -f _site-test/index.html
          test -f _site-test/atlas-runtime-report.json
          test -f _site-test/atlas-runtime-current.css
          test -f _site-test/atlas-runtime-current-01.js
          test -f _site-test/atlas-theme-bootstrap.js
          ! grep -q '?b=' _site-test/index.html

      - name: Validate compiled JavaScript syntax and sole version authority
        shell: bash
        run: |
          set -euo pipefail
          for f in _site-test/atlas-runtime-current-*.js _site-test/atlas-module-current-*.js; do
            test -e "$f" || continue
            node --check "$f"
          done
          python tools/audit_runtime_authority.py --root _site-test

      - name: Verify compiled artifact contains no versioned web runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          m=json.load(open('atlas-runtime-manifest.json',encoding='utf-8'))
          report=json.load(open('_site-test/atlas-runtime-report.json',encoding='utf-8'))
          html=Path('_site-test/index.html').read_text(encoding='utf-8')
          assert report['policy']=='CANONICAL_COMPILED_RUNTIME_ONLY',report
          assert report['publish_mode']=='COMPILED_BUNDLES_ONLY',report
          assert report['historical_source_assets_published'] is False,report
          assert report['visible_version_authority']=='atlas-release-guard.js',report
          assert len(report['published_css'])==1,report
          assert report['published_js'],report
          for source in [*m['styles'],*[x['path'] for x in m['scripts']]]:
              assert f'./{source}' not in html,f'source fragment leaked into index: {source}'
              assert not Path('_site-test',source).exists(),f'source fragment published: {source}'
          for forbidden in m['forbidden_runtime_assets']:
              assert not Path('_site-test',forbidden).exists(),f'forbidden runtime published: {forbidden}'
          refs=re.findall(r'(?:src|href)="\.\/(atlas-(?:runtime|module)-current[^?\"]+)\?r=([^\"]+)"',html)
          assert refs,'compiled runtime refs missing'
          assert all(build==m['build'] for _,build in refs),refs
          PY

      - name: Validate current analytical contracts remain available in source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AtlasTheme' atlas-current-ui.js
          grep -q 'AtlasNavNews' atlas-current-ui.js
          grep -q 'Gasto público' atlas-current-ui.js
          grep -q 'window.v035OpenCgr=openCgr' atlas-cgr-bridge.js
          grep -q 'AML_SANCTIONS_V12' v034-sanctions-v12-charts.js
          grep -q 'SESSION_AWARE' build.json
          grep -q 'aml_v0205_uaf_sii_reconciliation' v037-public-spend.js
          if test -f tests/v0341-sanctions-contract.mjs; then node tests/v0341-sanctions-contract.mjs; fi

      - name: Validate governed local JSON assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          for path in ['data/uaf_reportability_sector_2025.json','data/uaf_dashboard_snapshot.json']:
              with open(path,encoding='utf-8') as f: json.load(f)
          PY
