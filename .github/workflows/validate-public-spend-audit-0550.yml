name: Validate Public Spend Audit 0550
on:
  pull_request:
    paths:
      - 'assets/atlas-public-spend-audit-0550.js'
      - 'assets/atlas-public-spend-audit-0550.css'
      - 'assets/atlas-public-spend-peers-0551.js'
      - 'assets/atlas-public-spend-peers-0551.css'
      - 'tests/atlas-public-spend-audit-0550.mjs'
      - 'tests/atlas-public-spend-peers-0551.mjs'
      - 'index.html'
      - '.github/workflows/validate-public-spend-audit-0550.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/atlas-public-spend-audit-0550.mjs
      - run: node tests/atlas-public-spend-peers-0551.mjs
