name: Diagnose Cloudflare Containers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-cloudflare-containers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Normalize credentials
        shell: bash
        run: |
          account_id=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          api_token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          test -n "$account_id"
          test -n "$api_token"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$api_token" >> "$GITHUB_ENV"
      - name: Containers authorization preflight
        shell: bash
        run: |
          set +e
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/containers/me"
          code=$(curl --silent --show-error --output response.json --write-out '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$endpoint")
          echo "containers_http_status=$code" >> "$GITHUB_STEP_SUMMARY"
          node - <<'NODE'
          const fs=require('fs');
          let j={};try{j=JSON.parse(fs.readFileSync('response.json','utf8'))}catch{}
          const out={success:j.success===true,error_codes:(j.errors||[]).map(x=>x.code).filter(Boolean),messages:(j.errors||[]).map(x=>x.message).filter(Boolean).slice(0,3)};
          console.log(JSON.stringify(out));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`\ncontainers_response=${JSON.stringify(out)}\n`);
          NODE
          if [ "$code" = "200" ]; then exit 0; fi
          if [ "$code" = "403" ]; then echo 'diagnosis=containers_entitlement_or_paid_plan_required' >> "$GITHUB_STEP_SUMMARY"; exit 3; fi
          if [ "$code" = "401" ]; then echo 'diagnosis=containers_token_or_backend_authorization' >> "$GITHUB_STEP_SUMMARY"; exit 4; fi
          echo 'diagnosis=containers_unexpected_response' >> "$GITHUB_STEP_SUMMARY"
          exit 5
