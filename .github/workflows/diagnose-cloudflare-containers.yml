name: Diagnose Cloudflare Containers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-cloudflare-containers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize credentials
        shell: bash
        run: |
          account_id=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          api_token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          test -n "$account_id"
          test -n "$api_token"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$api_token" >> "$GITHUB_ENV"
      - name: Containers authorization preflight
        id: preflight
        shell: bash
        run: |
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/containers/me"
          code=$(curl --silent --show-error --output response.json --write-out '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$endpoint")
          diagnosis="containers_unexpected_response"
          if [ "$code" = "200" ]; then diagnosis="containers_ready"; fi
          if [ "$code" = "403" ]; then diagnosis="containers_entitlement_or_paid_plan_required"; fi
          if [ "$code" = "401" ]; then diagnosis="containers_token_or_backend_authorization"; fi
          echo "http_status=$code" >> "$GITHUB_OUTPUT"
          echo "diagnosis=$diagnosis" >> "$GITHUB_OUTPUT"
          echo "containers_http_status=$code" >> "$GITHUB_STEP_SUMMARY"
          echo "diagnosis=$diagnosis" >> "$GITHUB_STEP_SUMMARY"
          HTTP_STATUS="$code" DIAGNOSIS="$diagnosis" node - <<'NODE'
          const fs=require('fs');
          let j={};try{j=JSON.parse(fs.readFileSync('response.json','utf8'))}catch{}
          const safe={
            service:'cloudflare-containers',
            http_status:Number(process.env.HTTP_STATUS||0),
            diagnosis:process.env.DIAGNOSIS||'unknown',
            success:j.success===true,
            error_codes:(j.errors||[]).map(x=>x.code).filter(Boolean),
            messages:(j.errors||[]).map(x=>x.message).filter(Boolean).slice(0,3),
            checked_at:new Date().toISOString(),
            source_commit:process.env.GITHUB_SHA
          };
          fs.writeFileSync('/tmp/containers-preflight.json',JSON.stringify(safe,null,2)+'\n');
          console.log(JSON.stringify(safe));
          NODE
      - name: Persist preflight result
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/containers-preflight.json cloudflare/maigret-service/containers-preflight.json
          git add cloudflare/maigret-service/containers-preflight.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(cloudflare): record Containers preflight [skip ci]'
          git push origin main
