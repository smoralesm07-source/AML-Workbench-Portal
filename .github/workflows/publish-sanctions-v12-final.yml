name: Publish approved Sanciones v12 final

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[publish-sanctions-v12] ATLAS 0.43.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate canonical source before dispatch
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"release": "0.43.4"' atlas-release.json
          grep -q '"release": "0.43.4"' atlas-runtime-manifest.json
          grep -q 'atlas-sanctions-v12-approved-01.js' atlas-runtime-manifest.json
          grep -q 'atlas-sanctions-v12-approved-06.js' atlas-runtime-manifest.json
          ! grep -q 'v034-sanctions-v12-core.js' atlas-runtime-manifest.json
          ! grep -q 'v0341-sanctions-hardening.js' atlas-runtime-manifest.json
          python tools/build_atlas_site.py --out /tmp/atlas-site
          grep -R -q 'AML_SANCTIONS_V12_APPROVED' /tmp/atlas-site/atlas-runtime-current-*.js
          grep -R -q 'Consulta directa de entidad' /tmp/atlas-site/atlas-runtime-current-*.js
          grep -R -q 'Últimas sanciones · Top 5' /tmp/atlas-site/atlas-runtime-current-*.js
          grep -R -q 'Concentración regional de sanciones' /tmp/atlas-site/atlas-runtime-current-*.js
          grep -q '.sv12-approved' /tmp/atlas-site/atlas-runtime-current.css
      - name: Dispatch canonical Pages workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          START=$(date -u +%s)
          gh workflow run pages.yml --ref main
          echo "start=$START" >> "$GITHUB_OUTPUT"
          sleep 8
          RUN_ID=$(gh run list --workflow pages.yml --event workflow_dispatch --limit 10 --json databaseId,createdAt --jq '.[0].databaseId')
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Canonical Pages run: $RUN_ID"
      - name: Wait for canonical deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --exit-status
      - name: Live smoke exact approved v12
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          sleep 12
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          TOKEN="0434-${{ steps.dispatch.outputs.run_id }}"
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/?release=$TOKEN" -o /tmp/index.html
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/atlas-runtime-report.json?release=$TOKEN" -o /tmp/runtime.json
          grep -q 'data-atlas-release="0.43.4"' /tmp/index.html
          python - <<'PY' > /tmp/assets.txt
          import json
          r=json.load(open('/tmp/runtime.json'))
          assert r['release']=='0.43.4' and r['build']=='0434', r
          for x in r['published_js']: print(x)
          PY
          FOUND=0
          while read -r asset; do
            curl -fsSL -H 'Cache-Control: no-cache' "$BASE/$asset?release=$TOKEN" -o "/tmp/$asset"
            if grep -q 'AML_SANCTIONS_V12_APPROVED' "/tmp/$asset"; then
              grep -q 'Consulta directa de entidad' "/tmp/$asset"
              grep -q 'Últimas sanciones · Top 5' "/tmp/$asset"
              grep -q 'Concentración regional de sanciones' "/tmp/$asset"
              grep -q 'Materias sancionatorias' "/tmp/$asset"
              grep -q 'Sanciones por supervisor' "/tmp/$asset"
              grep -q 'Entidades sancionadas' "/tmp/$asset"
              FOUND=1
            fi
          done < /tmp/assets.txt
          test "$FOUND" -eq 1
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/atlas-runtime-current.css?release=$TOKEN" -o /tmp/current.css
          grep -q '.sv12-approved' /tmp/current.css
          echo 'PUBLIC_V12=yes' >> "$GITHUB_ENV"
      - name: Report final publication
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          SMOKE: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          cat > /tmp/report.md <<EOF
          ## Publicación canónica Sanciones v12

          - ATLAS release: \`0.43.4 / 0434\`
          - pages.yml run: \`${RUN_ID}\`
          - live smoke: \`${SMOKE}\`
          - public exact-v12 marker: \`${PUBLIC_V12:-no}\`
          - v12 command search: \`Consulta directa de entidad\`
          - v12 panels verified: \`Top 5 + sector + región + materias + supervisor + entidades\`
          - old sanctions fragments in canonical manifest: \`no\`
          EOF
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/report.md
