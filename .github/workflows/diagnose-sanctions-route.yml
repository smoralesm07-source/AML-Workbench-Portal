name: Diagnose canonical Sanciones route

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[diag-sanctions] canonical route'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Trace manifest sources and compiled runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/report.txt
          import json,re,pathlib
          m=json.load(open('atlas-runtime-manifest.json'))
          print('release',m['release'],'build',m['build'])
          print('\nMANIFEST SOURCES TOUCHING SANCTIONS ROUTE:')
          last=None
          for i,item in enumerate(m['scripts'],1):
              p=pathlib.Path(item['path'])
              t=p.read_text(encoding='utf-8')
              hits=[]
              for pat in [r'\bloadSanctions\b',r'AML_SANCTIONS_V12',r'v034Load',r"view\s*===?\s*['\"]sanctions['\"]"]:
                  if re.search(pat,t): hits.append(pat)
              if hits:
                  print(f'{i:03d} {item["path"]} type={item.get("type","classic")} hits={len(hits)}')
                  if re.search(r'(?:window\.)?loadSanctions\s*=|function\s+loadSanctions\s*\(',t): last=item['path']
          print('LAST SOURCE DEFINING/ASSIGNING loadSanctions:',last)
          PY
          python tools/build_atlas_site.py --out _site >/tmp/build.out
          echo >> /tmp/report.txt
          echo 'COMPILED MATCHES:' >> /tmp/report.txt
          grep -RIlE 'loadSanctions|AML_SANCTIONS_V12|v034Load' _site/atlas-runtime-current-*.js _site/atlas-module-current-*.js | sed 's#_site/##' >> /tmp/report.txt || true
          echo >> /tmp/report.txt
          echo 'BUILD:' >> /tmp/report.txt
          cat /tmp/build.out >> /tmp/report.txt
      - name: Report
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          { echo '## Canonical Sanciones route diagnostic'; echo; echo '```'; cat /tmp/report.txt; echo '```'; } > /tmp/report.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/report.md
