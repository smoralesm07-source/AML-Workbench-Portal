name: Validate current Sanciones spectrum

on:
  pull_request:
    branches: [main]
    paths:
      - 'atlas-release.json'
      - 'build.json'
      - 'atlas-runtime-manifest.json'
      - 'atlas-sanctions-v12-approved-*.js'
      - 'atlas-sanctions-v12-approved-*.css'
      - 'assets/atlas-sanctions-spectrum-0940.js'
      - 'assets/atlas-sanctions-spectrum-0940.css'
      - 'atlas-sanctions-v12-route.js'
      - 'sql/atlas_v0940_sanctions_spectrum_current.sql'
      - 'tools/build_atlas_site.py'
      - '.github/workflows/validate-sanctions-v12-current.yml'
  push:
    branches: [main]
    paths:
      - 'atlas-release.json'
      - 'build.json'
      - 'atlas-runtime-manifest.json'
      - 'atlas-sanctions-v12-approved-*.js'
      - 'atlas-sanctions-v12-approved-*.css'
      - 'assets/atlas-sanctions-spectrum-0940.js'
      - 'assets/atlas-sanctions-spectrum-0940.css'
      - 'atlas-sanctions-v12-route.js'
      - 'sql/atlas_v0940_sanctions_spectrum_current.sql'
      - 'tools/build_atlas_site.py'
      - '.github/workflows/validate-sanctions-v12-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate current Sanciones source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.load(open('atlas-release.json',encoding='utf-8'))
          build=json.load(open('build.json',encoding='utf-8'))
          manifest=json.load(open('atlas-runtime-manifest.json',encoding='utf-8'))
          assert release['release']==build['app_version']==manifest['release']
          assert release['build']==build['build']==manifest['build']
          assert 'SANCTIONS_SPECTRUM_0940' in build['sanctions_ui_contract']
          assert 'CURRENT_UAF_STATUS_0812' in build['sanctions_data_contract']
          assert 'NO_HEURISTIC_UAF_STATUS' in build['sanctions_data_contract']
          assert 'NO_INFERRED_TERRITORY' in build['sanctions_data_contract']
          assert 'ENTITY+REGION+SECTOR_REUSABLE_CURRENT_V0940' in build['sanctions_signal_contract']
          assert 'ENTITY360_CANONICAL_PLUS_PRESS_UNRECONCILED' in build['sanctions_search_contract']
          scripts=[x['path'] for x in manifest['scripts']]
          styles=list(manifest['styles'])
          current='assets/atlas-sanctions-spectrum-0940.js'
          current_css='assets/atlas-sanctions-spectrum-0940.css'
          route='atlas-sanctions-v12-route.js'
          assert current in scripts,scripts
          assert current_css in styles,styles
          assert scripts.index(current)<scripts.index(route)<scripts.index('atlas-current-ui.js')
          assert manifest['scripts'][scripts.index(current)]['role']=='sanctions-spectrum-current-authority'
          assert manifest['scripts'][scripts.index(route)]['role']=='sanctions-spectrum-route-authority'
          approved=[f'atlas-sanctions-v12-approved-{i:02d}.js' for i in range(1,7)]
          assert all(x in scripts for x in approved),approved
          assert all(manifest['scripts'][scripts.index(x)]['role']=='sanctions-v12-approved-fallback' for x in approved)
          for path in [current,current_css,route,'sql/atlas_v0940_sanctions_spectrum_current.sql']:
              assert Path(path).is_file(),path
          PY

      - name: Validate source syntax and semantic guardrails
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/atlas-sanctions-spectrum-0940.js
          node --check atlas-sanctions-v12-route.js
          grep -q 'SANCTIONS_SPECTRUM_CURRENT_0940' assets/atlas-sanctions-spectrum-0940.js
          grep -q 'aml_v_sanctions_spectrum_current_v0940' assets/atlas-sanctions-spectrum-0940.js
          grep -q 'aml_v_sanction_entity_signal_current_v0940' assets/atlas-sanctions-spectrum-0940.js
          grep -q 'aml_v_sanction_region_signal_current_v0940' assets/atlas-sanctions-spectrum-0940.js
          grep -q 'aml_v_sanction_sector_signal_current_v0940' assets/atlas-sanctions-spectrum-0940.js
          grep -q 'openPressObservation' assets/atlas-sanctions-spectrum-0940.js
          grep -q 'UNRESOLVED_IDENTITY' assets/atlas-sanctions-spectrum-0940.js
          grep -q 'SO_REGISTERED' assets/atlas-sanctions-spectrum-0940.js
          grep -q 'POTENTIAL_SO_CURRENT' assets/atlas-sanctions-spectrum-0940.js
          grep -q 'atlas:sanctions:signals-ready' assets/atlas-sanctions-spectrum-0940.js
          grep -q 'ATLAS_SANCTIONS_CURRENT.load' atlas-sanctions-v12-route.js
          grep -q 'currentSpectrumPinned:true' atlas-sanctions-v12-route.js
          grep -q 'AML_SANCTIONS_V12_APPROVED.reload' atlas-sanctions-v12-route.js
          grep -q 'security_invoker = true' sql/atlas_v0940_sanctions_spectrum_current.sql
          grep -q 'aml_v_entity_uaf_status_current_v0812' sql/atlas_v0940_sanctions_spectrum_current.sql
          grep -q 'aml_osfl_entity_runtime_snapshot' sql/atlas_v0940_sanctions_spectrum_current.sql
          grep -q 'aml_res_entity_bridge' sql/atlas_v0940_sanctions_spectrum_current.sql
          ! grep -q 'REGION_DEFAULT_BY_SUP' assets/atlas-sanctions-spectrum-0940.js
          ! grep -q 'sv12Potential' assets/atlas-sanctions-spectrum-0940.js

      - name: Build exact canonical Pages candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_atlas_site.py --out _site-sanctions
          for f in _site-sanctions/atlas-runtime-current-*.js _site-sanctions/atlas-module-current-*.js; do
            test -e "$f" || continue
            node --check "$f"
          done
          grep -R -q 'SANCTIONS_SPECTRUM_CURRENT_0940' _site-sanctions/atlas-runtime-current-*.js
          grep -R -q 'ATLAS_SANCTIONS_CURRENT.load' _site-sanctions/atlas-runtime-current-*.js
          grep -R -q 'aml_v_sanctions_spectrum_current_v0940' _site-sanctions/atlas-runtime-current-*.js
          grep -R -q 'atlas:sanctions:signals-ready' _site-sanctions/atlas-runtime-current-*.js
          grep -q '.san94' _site-sanctions/atlas-runtime-current.css
          grep -q 'assets/atlas-sanctions-spectrum-0940.js' atlas-runtime-manifest.json

      - name: Verify live Radar Sanciones upstream remains populated
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 https://raw.githubusercontent.com/smoralesm07-source/Radar_sanciones/main/docs/data/metadata.json -o /tmp/sanctions-meta.json
          python - <<'PY'
          import json
          meta=json.load(open('/tmp/sanctions-meta.json',encoding='utf-8'))
          assert meta.get('bootstrap_pending') is False,meta
          assert int(meta.get('current_data_from_year',9999))<=2020,meta
          assert int(meta.get('event_count',0))>0,meta
          print(f"Radar Sanciones upstream OK · {meta.get('event_count')} eventos · corte {meta.get('latest_event_date')}")
          PY
