name: Mercado Público History 2023-2026

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Año 2023-2026'
        required: true
        default: '2023'
      month:
        description: 'Mes 1-12'
        required: true
        default: '1'
      source_url:
        description: 'URL oficial opcional'
        required: false
        default: ''
  pull_request:
    paths:
      - 'ops/mercado-publico/history_ingest.py'
      - 'ops/mercado-publico/backfill-trigger.json'
      - '.github/workflows/mercado-publico-history-2023-2026.yml'
  push:
    branches: [main]
    paths:
      - 'ops/mercado-publico/backfill-trigger.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mercado-publico-history-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate historical loader and trigger
        run: |
          python -m py_compile ops/mercado-publico/history_ingest.py
          python ops/mercado-publico/history_ingest.py --help >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('ops/mercado-publico/backfill-trigger.json').read_text())
          y=int(p['year']);m=int(p['month'])
          assert 2023 <= y <= 2026 and 1 <= m <= 12
          print('trigger',p['run_id'],y,m)
          PY

  ingest:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Cloudflare credentials and R2 bucket
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if ! npx wrangler@4.125.0 r2 bucket list | grep -Fq 'atlas-mercado-publico-raw'; then
            npx wrangler@4.125.0 r2 bucket create atlas-mercado-publico-raw
          fi
      - name: Resolve period
        id: period
        env:
          INPUT_YEAR: ${{ github.event.inputs.year }}
          INPUT_MONTH: ${{ github.event.inputs.month }}
          INPUT_URL: ${{ github.event.inputs.source_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          from pathlib import Path
          if os.environ.get('EVENT_NAME') == 'workflow_dispatch':
              y=os.environ.get('INPUT_YEAR') or '2023';m=os.environ.get('INPUT_MONTH') or '1';u=os.environ.get('INPUT_URL') or ''
          else:
              p=json.loads(Path('ops/mercado-publico/backfill-trigger.json').read_text())
              y=str(p['year']);m=str(p['month']);u=str(p.get('source_url') or '')
          print('year='+y);print('month='+m);print('url='+u)
          PY
      - name: Ingest official ChileCompra month
        env:
          YEAR: ${{ steps.period.outputs.year }}
          MONTH: ${{ steps.period.outputs.month }}
          SOURCE_URL: ${{ steps.period.outputs.url }}
        run: |
          set -euo pipefail
          args=(--year "$YEAR" --month "$MONTH")
          if [ -n "$SOURCE_URL" ]; then args+=(--url "$SOURCE_URL"); fi
          python ops/mercado-publico/history_ingest.py "${args[@]}"
