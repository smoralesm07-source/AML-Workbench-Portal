name: Validate ATLAS entity intelligence 0510

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/atlas-entity-explorer-0510.js'
      - 'assets/atlas-entity-explorer-0510.css'
      - 'assets/atlas-entity-dossier-0510.js'
      - 'assets/atlas-entity-dossier-0510.css'
      - 'sql/atlas_v0510_entity_intelligence.sql'
      - 'tests/atlas-entity-intelligence-0510.mjs'
      - 'index.html'
      - 'atlas-release.json'
      - 'atlas-runtime-manifest.json'
      - 'build.json'
      - '.github/workflows/validate-entity-intelligence-0510.yml'
  push:
    branches: [main]
    paths:
      - 'assets/atlas-entity-explorer-0510.js'
      - 'assets/atlas-entity-explorer-0510.css'
      - 'assets/atlas-entity-dossier-0510.js'
      - 'assets/atlas-entity-dossier-0510.css'
      - 'sql/atlas_v0510_entity_intelligence.sql'
      - 'tests/atlas-entity-intelligence-0510.mjs'
      - 'index.html'
      - 'atlas-release.json'
      - 'atlas-runtime-manifest.json'
      - 'build.json'
      - '.github/workflows/validate-entity-intelligence-0510.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate extension JavaScript
        run: |
          node --check assets/atlas-entity-explorer-0510.js
          node --check assets/atlas-entity-dossier-0510.js
      - name: Validate section contract
        run: node tests/atlas-entity-intelligence-0510.mjs
      - name: Keep the rest of the current contracts green
        run: |
          node tests/atlas-entity-search-current.mjs
          node tests/atlas-pep-discovery-0500.mjs
          node tests/atlas-reportability-current.mjs
          node tests/atlas-irar-current.mjs
          node tests/v0435-reconciliation-contract.mjs
      - name: Validate release JSON
        run: |
          python -m json.tool atlas-release.json >/dev/null
          python -m json.tool atlas-runtime-manifest.json >/dev/null
          python -m json.tool build.json >/dev/null
      - name: Build exact Pages candidate
        run: python tools/build_atlas_site.py --out _site-entity-0510
      - name: Verify current Entity 0510 extension in Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s _site-entity-0510/atlas-runtime-current.css
          test -s _site-entity-0510/atlas-runtime-current-01.js
          # Entity 0510 sigue siendo una extensión standalone vigente fuera del manifiesto compilado.
          for f in \
            assets/atlas-entity-explorer-0510.js \
            assets/atlas-entity-explorer-0510.css \
            assets/atlas-entity-dossier-0510.js \
            assets/atlas-entity-dossier-0510.css; do
            test -s "_site-entity-0510/$f"
            grep -q "./$f" _site-entity-0510/index.html
          done
          cat _site-entity-0510/assets/atlas-entity-explorer-0510.js \
              _site-entity-0510/assets/atlas-entity-dossier-0510.js > /tmp/atlas-entity-0510-js
          grep -q 'aml_ipa3_mark_scores_snapshot_v0_4' /tmp/atlas-entity-0510-js
          grep -q 'aml_sii_entity_year' /tmp/atlas-entity-0510-js
          grep -q 'aml_entity_peer_position_snapshot' /tmp/atlas-entity-0510-js
          grep -q 'aml_entity_identity_link_snapshot' /tmp/atlas-entity-0510-js
          ! grep -q 'aml_v_ipa3_mark_scores_v0_4' /tmp/atlas-entity-0510-js
          ! grep -q 'aml_v_ipa3_entity_score_v0_4' /tmp/atlas-entity-0510-js
          ! grep -q 'aml_v_ipa3_sii_peer_benchmark' /tmp/atlas-entity-0510-js
