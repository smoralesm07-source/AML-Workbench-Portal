name: Build ATLAS v2 shadow preview

on:
  push:
    branches: [atlas-architecture-v2]
    paths:
      - 'src/v2/**'
      - 'tools/build_atlas_site.py'
      - 'atlas-runtime-manifest.json'
      - '.github/workflows/build-atlas-v2-shadow-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2 branch
        uses: actions/checkout@v4

      - name: Validate shadow sources
        run: |
          set -euo pipefail
          node --check src/v2/atlas-v2-data.js
          node --check src/v2/public-spend-shadow.js

      - name: Build canonical site
        run: |
          set -euo pipefail
          python3 tools/build_atlas_site.py --out _site

      - name: Mount Architecture v2 shadow only in preview artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/v2
          cp src/v2/atlas-v2-data.js _site/v2/atlas-v2-data.js
          cp src/v2/public-spend-shadow.js _site/v2/public-spend-shadow.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('_site/index.html')
          html=p.read_text(encoding='utf-8')
          marker='data-atlas-v2-shadow="public-spend"'
          assert marker not in html, 'v2 preview scripts already mounted'
          tags=(
            '<script src="./v2/atlas-v2-data.js?v=shadow-preview" data-atlas-v2-shadow="data-client"></script>\n'
            '<script src="./v2/public-spend-shadow.js?v=shadow-preview" data-atlas-v2-shadow="public-spend"></script>\n'
          )
          gp=re.search(r'<script[^>]+src=["\'][^"\']*atlas-public-spend-v2\.js[^"\']*["\'][^>]*>\s*</script>', html, flags=re.I)
          if gp:
              html=html[:gp.start()] + tags + html[gp.start():]
          elif '</body>' in html.lower():
              pos=html.lower().rfind('</body>')
              html=html[:pos] + tags + html[pos:]
          else:
              raise SystemExit('Unable to find safe v2 shadow mount point')
          p.write_text(html, encoding='utf-8')
          PY

      - name: Validate preview isolation and ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html=Path('_site/index.html').read_text(encoding='utf-8')
          assert html.count('data-atlas-v2-shadow="data-client"') == 1
          assert html.count('data-atlas-v2-shadow="public-spend"') == 1
          assert './v2/atlas-v2-data.js?v=shadow-preview' in html
          assert './v2/public-spend-shadow.js?v=shadow-preview' in html
          gp=re.search(r'atlas-public-spend-v2\.js', html)
          shadow=html.find('./v2/public-spend-shadow.js?v=shadow-preview')
          if gp:
              assert shadow < gp.start(), 'shadow listener must mount before current GP2 runtime'
          assert Path('_site/v2/atlas-v2-data.js').exists()
          assert Path('_site/v2/public-spend-shadow.js').exists()
          assert 'semanticParity' in Path('_site/v2/public-spend-shadow.js').read_text(encoding='utf-8')
          print('ATLAS v2 shadow preview isolated from production manifest and mounted successfully')
          PY

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v2-shadow-preview
          path: _site
          retention-days: 7
