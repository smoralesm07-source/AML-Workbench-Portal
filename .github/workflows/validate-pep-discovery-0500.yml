name: Validate ATLAS PEP discovery 0500

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/atlas-pep-discovery.js'
      - 'assets/atlas-pep-discovery.css'
      - 'assets/atlas-pep-runtime-state-bridge.js'
      - 'assets/atlas-pep-availability-0501.js'
      - 'sql/atlas_v0500_pep_discovery_snapshot.sql'
      - 'tests/atlas-pep-discovery-0500.mjs'
      - 'index.html'
      - 'atlas-release.json'
      - 'atlas-runtime-manifest.json'
      - 'build.json'
      - '.github/workflows/validate-pep-discovery-0500.yml'
  push:
    branches: [main]
    paths:
      - 'assets/atlas-pep-discovery.js'
      - 'assets/atlas-pep-discovery.css'
      - 'assets/atlas-pep-runtime-state-bridge.js'
      - 'assets/atlas-pep-availability-0501.js'
      - 'sql/atlas_v0500_pep_discovery_snapshot.sql'
      - 'tests/atlas-pep-discovery-0500.mjs'
      - 'index.html'
      - 'atlas-release.json'
      - 'atlas-runtime-manifest.json'
      - 'build.json'
      - '.github/workflows/validate-pep-discovery-0500.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate extension JavaScript
        run: |
          node --check assets/atlas-pep-runtime-state-bridge.js
          node --check assets/atlas-pep-discovery.js
          node --check assets/atlas-pep-availability-0501.js
      - name: Validate product integration contract
        run: node tests/atlas-pep-discovery-0500.mjs
      - name: Validate release JSON
        run: |
          python -m json.tool atlas-release.json >/dev/null
          python -m json.tool atlas-runtime-manifest.json >/dev/null
          python -m json.tool build.json >/dev/null
      - name: Build exact Pages candidate
        run: python tools/build_atlas_site.py --out _site-pep
      - name: Verify isolated extension in built artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s _site-pep/assets/atlas-pep-runtime-state-bridge.js
          test -s _site-pep/assets/atlas-pep-discovery.js
          test -s _site-pep/assets/atlas-pep-discovery.css
          test -s _site-pep/assets/atlas-pep-availability-0501.js
          grep -q 'atlas-pep-discovery.css?v=0501-1' _site-pep/index.html
          grep -q 'atlas-pep-runtime-state-bridge.js?v=0501-1' _site-pep/index.html
          grep -q 'atlas-pep-discovery.js?v=0501-1' _site-pep/index.html
          grep -q 'atlas-pep-availability-0501.js?v=0501-1' _site-pep/index.html
          ! grep -q 'MutationObserver' _site-pep/assets/atlas-pep-runtime-state-bridge.js
          ! grep -q 'MutationObserver' _site-pep/assets/atlas-pep-discovery.js
          ! grep -q 'MutationObserver' _site-pep/assets/atlas-pep-availability-0501.js
          ! grep -q 'localStorage' _site-pep/assets/atlas-pep-runtime-state-bridge.js
          ! grep -q 'localStorage' _site-pep/assets/atlas-pep-discovery.js
          ! grep -q 'localStorage' _site-pep/assets/atlas-pep-availability-0501.js
          grep -q 'aml_pep_discovery_snapshot' _site-pep/assets/atlas-pep-discovery.js
          grep -q 'aml_pep_discovery_snapshot' _site-pep/assets/atlas-pep-availability-0501.js
