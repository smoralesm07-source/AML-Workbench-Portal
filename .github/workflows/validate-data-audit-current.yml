name: Validate Data Audit · ATLAS current

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-data-audit-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate retired main-frame audit contract
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/atlas-data-audit.js
          grep -qi "retired" assets/atlas-data-audit.js
          grep -q "GLOBAL_SOURCE_HEALTH_TOPBAR_ONLY" assets/atlas-data-audit.js
          grep -q "v024AuditHtml" assets/atlas-data-audit.js
          ! grep -q "SOURCE_FRESHNESS" assets/atlas-data-audit.js
          ! grep -q "setInterval" assets/atlas-data-audit.js
      - name: Build canonical Atlas candidate without legacy audit artifact
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_atlas_site.py --out _site-data-audit
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('_site-data-audit/index.html')
          html=p.read_text(encoding='utf-8')
          html=re.sub(r'\s*<link[^>]+href=["\']\./assets/atlas-data-audit\.css(?:\?[^"\']*)?["\'][^>]*>\s*', '\n', html, flags=re.I)
          html=re.sub(r'\s*<script[^>]+src=["\']\./assets/atlas-data-audit\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*', '\n', html, flags=re.I)
          p.write_text(html, encoding='utf-8')
          PY
          rm -f _site-data-audit/assets/atlas-data-audit.js _site-data-audit/assets/atlas-data-audit.css
          test ! -e _site-data-audit/assets/atlas-data-audit.js
          test ! -e _site-data-audit/assets/atlas-data-audit.css
          ! grep -q 'atlas-data-audit.js' _site-data-audit/index.html
          ! grep -q 'atlas-data-audit.css' _site-data-audit/index.html
