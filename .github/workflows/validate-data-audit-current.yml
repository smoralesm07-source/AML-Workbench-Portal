name: Validate Data Audit · ATLAS current

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-data-audit-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate audit client syntax and governed source
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/atlas-data-audit.js
          grep -q "SOURCE_FRESHNESS" assets/atlas-data-audit.js
          grep -q "aml_sync_state" assets/atlas-data-audit.js
          grep -q "SIN ACTUALIZACIÓN" assets/atlas-data-audit.js
      - name: Build canonical Atlas candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_atlas_site.py --out _site-data-audit
          test -s _site-data-audit/assets/atlas-data-audit.js
          test -s _site-data-audit/assets/atlas-data-audit.css
          grep -q 'atlas-data-audit.js' _site-data-audit/index.html
          grep -q 'atlas-data-audit.css' _site-data-audit/index.html
          node --check _site-data-audit/assets/atlas-data-audit.js
