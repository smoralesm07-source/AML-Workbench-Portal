name: Probe live ATLAS 0.43.5 Sanciones route

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[probe-sanctions-live] ATLAS 0.43.5'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for canonical Pages publication and inspect public bundle
        id: probe
        shell: bash
        run: |
          set -u
          base='https://smoralesm07-source.github.io/AML-Workbench-Portal/'
          ok=0
          last_release='unavailable'
          last_route='no'
          last_v12='no'
          for attempt in $(seq 1 45); do
            stamp="$(date +%s)-${attempt}"
            if curl -fsSL --connect-timeout 10 "${base}atlas-release.json?_=${stamp}" -o /tmp/release.json; then
              last_release=$(python - <<'PY'
          import json
          try:
              r=json.load(open('/tmp/release.json'))
              print(f"{r.get('release')} / {r.get('build')}")
          except Exception:
              print('invalid-json')
          PY
              )
            fi
            if [ "$last_release" = '0.43.5 / 0435' ]; then
              if curl -fsSL --connect-timeout 10 "${base}?_=${stamp}" -o /tmp/live.html; then
                python - <<'PY' >/tmp/srcs
          import re,pathlib
          h=pathlib.Path('/tmp/live.html').read_text(encoding='utf-8')
          for s in re.findall(r'<script[^>]+src="\.\/(atlas-(?:runtime|module)-current-[^?\"]+)\?r=0435"',h): print(s)
          PY
                : > /tmp/runtime.js
                while IFS= read -r src; do
                  [ -n "$src" ] || continue
                  curl -fsSL --connect-timeout 10 "${base}${src}?r=0435&_=${stamp}" >> /tmp/runtime.js || true
                  printf '\n' >> /tmp/runtime.js
                done < /tmp/srcs
                grep -q 'legacyFrozenRouteBypassed:true' /tmp/runtime.js && last_route='yes' || last_route='no'
                grep -q 'AML_SANCTIONS_V12_APPROVED.reload' /tmp/runtime.js && last_route='yes' || true
                if grep -q 'Consulta directa de entidad' /tmp/runtime.js && grep -q 'Últimas sanciones · Top 5' /tmp/runtime.js && grep -q 'Concentración regional de sanciones' /tmp/runtime.js && grep -q 'Entidades sancionadas' /tmp/runtime.js; then last_v12='yes'; else last_v12='no'; fi
                if [ "$last_route" = 'yes' ] && [ "$last_v12" = 'yes' ]; then ok=1; break; fi
              fi
            fi
            sleep 4
          done
          echo "release=$last_release" >> "$GITHUB_OUTPUT"
          echo "route=$last_route" >> "$GITHUB_OUTPUT"
          echo "v12=$last_v12" >> "$GITHUB_OUTPUT"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" -ne 1 ]; then exit 1; fi

      - name: Report live state
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment '${{ github.event.issue.number }}' --body "## Estado público Sanciones · ATLAS\n\n- workflow: \`${{ job.status }}\`\n- release servido: \`${{ steps.probe.outputs.release }}\`\n- route bypass v019: \`${{ steps.probe.outputs.route }}\`\n- marcadores UI v12: \`${{ steps.probe.outputs.v12 }}\`\n- objetivo esperado: \`0.43.5 / 0435 + route=yes + v12=yes\`"
