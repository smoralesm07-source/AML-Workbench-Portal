name: Probe live current ATLAS Sanciones route

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[probe-sanctions-live] CURRENT'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Load expected current release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          r=json.load(open('atlas-release.json',encoding='utf-8'))
          print(f"EXPECTED_RELEASE={r['release']}")
          print(f"EXPECTED_BUILD={r['build']}")
          PY

      - name: Inspect public root and compiled bundles
        id: probe
        shell: bash
        run: |
          set -u
          base='https://smoralesm07-source.github.io/AML-Workbench-Portal/'
          ok=0; last_release='unavailable'; last_route='no'; last_v12='no'
          for attempt in $(seq 1 45); do
            stamp="$(date +%s)-${attempt}"
            if curl -fsSL --connect-timeout 10 "${base}atlas-release.json?_=${stamp}" -o /tmp/release.json; then
              last_release=$(python - <<'PY'
          import json
          try:
              r=json.load(open('/tmp/release.json'))
              print(f"{r.get('release')} / {r.get('build')}")
          except Exception:
              print('invalid-json')
          PY
              )
            fi
            if [ "$last_release" = "${EXPECTED_RELEASE} / ${EXPECTED_BUILD}" ]; then
              curl -fsSL --connect-timeout 10 "${base}?_=${stamp}" -o /tmp/live.html || true
              python - <<'PY' >/tmp/srcs
          import re,pathlib,os
          p=pathlib.Path('/tmp/live.html')
          if p.exists():
              h=p.read_text(encoding='utf-8')
              b=os.environ['EXPECTED_BUILD']
              for s in re.findall(r'<script[^>]+src="\.\/(atlas-(?:runtime|module)-current-[^?\"]+)\?r='+re.escape(b)+r'"',h): print(s)
          PY
              : > /tmp/runtime.js
              while IFS= read -r src; do
                [ -n "$src" ] || continue
                curl -fsSL --connect-timeout 10 "${base}${src}?r=${EXPECTED_BUILD}&_=${stamp}" >> /tmp/runtime.js || true
                printf '\n' >> /tmp/runtime.js
              done < /tmp/srcs
              if grep -q 'legacyFrozenRouteBypassed:true' /tmp/runtime.js && grep -q 'AML_SANCTIONS_V12_APPROVED.reload' /tmp/runtime.js; then last_route='yes'; else last_route='no'; fi
              if grep -q 'Consulta directa de entidad' /tmp/runtime.js && grep -q 'Últimas sanciones · Top 5' /tmp/runtime.js && grep -q 'Concentración regional de sanciones' /tmp/runtime.js && grep -q 'Materias sancionatorias' /tmp/runtime.js && grep -q 'Sanciones por supervisor' /tmp/runtime.js && grep -q 'Entidades sancionadas' /tmp/runtime.js; then last_v12='yes'; else last_v12='no'; fi
              if [ "$last_route" = yes ] && [ "$last_v12" = yes ]; then ok=1; break; fi
            fi
            sleep 4
          done
          echo "release=$last_release" >> "$GITHUB_OUTPUT"
          echo "route=$last_route" >> "$GITHUB_OUTPUT"
          echo "v12=$last_v12" >> "$GITHUB_OUTPUT"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" -eq 1 ]

      - name: Report live state
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment '${{ github.event.issue.number }}' --body "## Estado público Sanciones · ATLAS\n\n- workflow: \`${{ job.status }}\`\n- esperado: \`${EXPECTED_RELEASE:-unknown} / ${EXPECTED_BUILD:-unknown}\`\n- release servido: \`${{ steps.probe.outputs.release }}\`\n- route bypass v019: \`${{ steps.probe.outputs.route }}\`\n- marcadores UI v12: \`${{ steps.probe.outputs.v12 }}\`"
