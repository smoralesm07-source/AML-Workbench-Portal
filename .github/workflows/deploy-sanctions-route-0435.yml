name: Validate current ATLAS Sanciones radiography

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/atlas-sanctions-*.js'
      - 'assets/atlas-sanctions-*.css'
      - 'atlas-sanctions-v12-route.js'
      - 'atlas-runtime-manifest.json'
      - 'build.json'
      - 'atlas-release.json'

# Production Pages has exactly one owner:
# .github/workflows/deploy-atlas-pages-current.yml
# This workflow is intentionally validation-only. It MUST NOT upload or deploy Pages.
permissions:
  contents: read

concurrency:
  group: atlas-sanctions-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate current Sanciones route without publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('atlas-release.json',encoding='utf-8'))
          b=json.load(open('build.json',encoding='utf-8'))
          m=json.load(open('atlas-runtime-manifest.json',encoding='utf-8'))
          assert r['release']==b['app_version']==m['release'],(r,b,m)
          assert str(r['build'])==str(b['build'])==str(m['build']),(r,b,m)
          assert r['deployment_policy']=='SINGLE_ACTIVE_RELEASE',r
          assert r['runtime_policy']=='CANONICAL_COMPILED_RUNTIME_ONLY',r
          assert r['pages_artifact_policy']=='COMPILED_CURRENT_BUNDLES_ONLY',r
          s=[x['path'] for x in m['scripts']]
          i06=s.index('atlas-sanctions-v12-approved-06.js')
          ispec=s.index('assets/atlas-sanctions-spectrum-0940.js')
          irad=s.index('assets/atlas-sanctions-radiography-0960.js')
          iroute=s.index('atlas-sanctions-v12-route.js')
          iui=s.index('atlas-current-ui.js')
          assert i06 < ispec < irad < iroute < iui,s[-24:]
          assert b['sanctions_route_authority']=='atlas-sanctions-v12-route.js',b
          policy=b['sanctions_route_policy']
          assert policy.startswith('CURRENT_RADIOGRAPHY_'),policy
          assert 'SPECTRUM_0940_FALLBACK' in policy,policy
          assert 'V12_LAST_RESORT' in policy,policy
          PY
          node --check assets/atlas-sanctions-radiography-0960.js
          node --check atlas-sanctions-v12-route.js
          grep -q 'SANCTIONS_RADIOGRAPHY_CURRENT_0961' assets/atlas-sanctions-radiography-0960.js
          grep -q 'legacyFrozenRouteBypassed:true' atlas-sanctions-v12-route.js

      - name: Compile canonical v2 candidate only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/atlas-current
          python3 tools/build_atlas_v2_cutover.py --out /tmp/atlas-current
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('atlas-release.json').read_text())
          built=json.loads(Path('/tmp/atlas-current/atlas-release.json').read_text())
          html=Path('/tmp/atlas-current/index.html').read_text(encoding='utf-8')
          assert built['release']==source['release']
          assert str(built['build'])==str(source['build'])
          assert 'data-atlas-v2-cutover="public-spend"' in html
          assert './v2/public-spend-route-bridge.js?v=v2-cutover-1' in html
          PY
          grep -R -q 'SANCTIONS_RADIOGRAPHY_CURRENT_0961' /tmp/atlas-current/atlas-runtime-current-*.js
          grep -R -q 'legacyFrozenRouteBypassed:true' /tmp/atlas-current/atlas-runtime-current-*.js

      - name: Assert this workflow cannot own production Pages
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/deploy-sanctions-route-0435.yml'
          ! grep -q 'actions/deploy-pages' "$workflow"
          ! grep -q 'actions/upload-pages-artifact' "$workflow"
          ! grep -q 'pages: write' "$workflow"
          echo 'Sanciones validation is isolated from production deployment.'
