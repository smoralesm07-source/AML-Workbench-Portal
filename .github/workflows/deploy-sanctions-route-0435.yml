name: Deploy current ATLAS Sanciones radiography

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: atlas-aml-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[deploy-sanctions-route] CURRENT'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Load current release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          r=json.load(open('atlas-release.json',encoding='utf-8'))
          print(f"ATLAS_RELEASE={r['release']}")
          print(f"ATLAS_BUILD={r['build']}")
          PY

      - name: Validate current Sanciones radiography route authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('atlas-release.json',encoding='utf-8'))
          b=json.load(open('build.json',encoding='utf-8'))
          m=json.load(open('atlas-runtime-manifest.json',encoding='utf-8'))
          assert r['release']==b['app_version']==m['release'],(r,b,m)
          assert r['build']==b['build']==m['build'],(r,b,m)
          s=[x['path'] for x in m['scripts']]
          i06=s.index('atlas-sanctions-v12-approved-06.js')
          ispec=s.index('assets/atlas-sanctions-spectrum-0940.js')
          irad=s.index('assets/atlas-sanctions-radiography-0960.js')
          iroute=s.index('atlas-sanctions-v12-route.js')
          iui=s.index('atlas-current-ui.js')
          assert i06 < ispec < irad < iroute < iui,s[-24:]
          assert b['sanctions_route_authority']=='atlas-sanctions-v12-route.js',b
          policy=b['sanctions_route_policy']
          assert policy.startswith('CURRENT_RADIOGRAPHY_'),policy
          assert 'SPECTRUM_0940_FALLBACK' in policy,policy
          assert 'V12_LAST_RESORT' in policy,policy
          PY
          node --check assets/atlas-sanctions-radiography-0960.js
          node --check atlas-sanctions-v12-route.js
          grep -q 'SANCTIONS_RADIOGRAPHY_CURRENT_0961' assets/atlas-sanctions-radiography-0960.js
          grep -q 'ATLAS_SANCTIONS_CURRENT.load@0.96.1' atlas-sanctions-v12-route.js
          grep -q 'legacyFrozenRouteBypassed:true' atlas-sanctions-v12-route.js
          grep -q 'AML_SANCTIONS_V12_APPROVED' atlas-sanctions-v12-route.js

      - name: Compile exact current runtime
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_atlas_site.py --out _site
          for f in _site/atlas-runtime-current-*.js _site/atlas-module-current-*.js; do
            test -e "$f" || continue
            node --check "$f"
          done
          grep -R -q 'SANCTIONS_RADIOGRAPHY_CURRENT_0961' _site/atlas-runtime-current-*.js
          grep -R -q 'ATLAS_SANCTIONS_CURRENT.load@0.96.1' _site/atlas-runtime-current-*.js
          grep -R -q 'Evolución de sanciones y enforcement' _site/atlas-runtime-current-*.js
          grep -R -q 'Sanciones por supervisor e industria' _site/atlas-runtime-current-*.js
          grep -R -q 'Concentración regional' _site/atlas-runtime-current-*.js
          grep -R -q 'Hallazgos prioritarios' _site/atlas-runtime-current-*.js
          grep -R -q 'Ficha de sanción / detalle' _site/atlas-runtime-current-*.js
          grep -R -q 'legacyFrozenRouteBypassed:true' _site/atlas-runtime-current-*.js
          grep -R -q 'AML_SANCTIONS_V12_APPROVED.reload' _site/atlas-runtime-current-*.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload current ATLAS release
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy current ATLAS release
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public runtime and Sanciones route
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          stamp=$(date +%s)
          for i in $(seq 1 30); do
            if curl -fsSL "$base/atlas-release.json?_=${stamp}-${i}" -o /tmp/release.json && python - <<'PY'
          import json,os
          r=json.load(open('/tmp/release.json'))
          assert r['release']==os.environ['ATLAS_RELEASE'] and r['build']==os.environ['ATLAS_BUILD'],r
          PY
            then break; fi
            sleep 4
          done
          curl -fsSL "$base/?_=${stamp}" -o /tmp/live.html
          python - <<'PY'
          import re,pathlib,os
          html=pathlib.Path('/tmp/live.html').read_text(encoding='utf-8')
          release=os.environ['ATLAS_RELEASE']; build=os.environ['ATLAS_BUILD']
          assert f'data-aml-version="{release}"' in html,html[:500]
          srcs=re.findall(r'<script[^>]+src="\.\/(atlas-(?:runtime|module)-current-[^?\"]+)\?r='+re.escape(build)+r'"',html)
          assert srcs,html[:1000]
          pathlib.Path('/tmp/srcs').write_text('\n'.join(srcs),encoding='utf-8')
          PY
          : > /tmp/runtime.js
          while IFS= read -r src; do
            curl -fsSL "$base/$src?r=${ATLAS_BUILD}&_=${stamp}" >> /tmp/runtime.js
            printf '\n' >> /tmp/runtime.js
          done < /tmp/srcs
          grep -q 'SANCTIONS_RADIOGRAPHY_CURRENT_0961' /tmp/runtime.js
          grep -q 'ATLAS_SANCTIONS_CURRENT.load@0.96.1' /tmp/runtime.js
          grep -q 'Evolución de sanciones y enforcement' /tmp/runtime.js
          grep -q 'Sanciones por supervisor e industria' /tmp/runtime.js
          grep -q 'Concentración regional' /tmp/runtime.js
          grep -q 'Hallazgos prioritarios' /tmp/runtime.js
          grep -q 'Ficha de sanción / detalle' /tmp/runtime.js
          grep -q 'legacyFrozenRouteBypassed:true' /tmp/runtime.js

      - name: Report deployment
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment '${{ github.event.issue.number }}' --body "## Deploy Sanciones Radiography 0.96.1 · ATLAS\n\n- resultado: \`${{ job.status }}\`\n- run id: \`${{ github.run_id }}\`\n- release/build: \`${ATLAS_RELEASE:-unknown} / ${ATLAS_BUILD:-unknown}\`\n- Pages URL: \`${{ steps.deployment.outputs.page_url }}\`\n- route authority: \`atlas-sanctions-v12-route.js\`\n- target: \`ATLAS_SANCTIONS_CURRENT.load@0.96.1\`\n- fallback: \`Spectrum 0.94 → v12 approved\`\n- public bundle markers checked when result=success"
