name: Validate ATLAS v2 analytics shell

on:
  push:
    branches:
      - reengineering/atlas-v2-analytics-shell
    paths: &v2_paths
      - 'atlas-v2.html'
      - 'src/v2/atlas-v2-shell.js'
      - 'src/v2/atlas-v2-shell.css'
      - 'src/v2/atlas-v2-boot.js'
      - 'src/v2/atlas-v2-data.js'
      - 'src/v2/atlas-v2-session.js'
      - 'src/v2/atlas-v2-access.js'
      - 'src/v2/entity360-adapter.js'
      - 'src/v2/entity360-surface.js'
      - 'src/v2/entity360-surface.css'
      - 'src/v2/public-spend-surface.js'
      - 'src/v2/public-spend-surface.css'
      - 'src/v2/relations-surface.js'
      - 'src/v2/relations-surface.css'
      - 'src/v2/universes-adapter.js'
      - 'src/v2/universes-surface.js'
      - 'src/v2/universes-surface.css'
      - 'src/v2/territory-adapter.js'
      - 'src/v2/territory-surface.js'
      - 'src/v2/territory-surface.css'
      - 'src/v2/watch-adapter.js'
      - 'src/v2/watch-surface.js'
      - 'src/v2/watch-surface.css'
      - 'supabase/functions/atlas-v2-read/index.ts'
      - 'supabase/migrations/20260907023000_atlas_v2_relations_query.sql'
      - 'supabase/core-contracts/atlas-v2-universes-query-v2.sql'
      - 'supabase/core-contracts/atlas-v2-territory-watch-query-v2.sql'
      - 'tests/atlas-v2-entity360-analytics.mjs'
      - 'tests/atlas-v2-public-spend-native.mjs'
      - 'tests/atlas-v2-relations-native.mjs'
      - 'tests/atlas-v2-universes-native.mjs'
      - 'tests/atlas-v2-territory-native.mjs'
      - 'tests/atlas-v2-watch-native.mjs'
      - 'docs/ATLAS_V2_ANALYTICS_FIRST.md'
      - '.github/workflows/validate-atlas-v2-analytics-shell.yml'
  pull_request:
    paths: *v2_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check src/v2/atlas-v2-shell.js
          node --check src/v2/atlas-v2-boot.js
          node --check src/v2/atlas-v2-data.js
          node --check src/v2/atlas-v2-session.js
          node --check src/v2/atlas-v2-access.js
          node --check src/v2/entity360-adapter.js
          node --check src/v2/entity360-surface.js
          node --check src/v2/public-spend-surface.js
          node --check src/v2/relations-surface.js
          node --check src/v2/universes-adapter.js
          node --check src/v2/universes-surface.js
          node --check src/v2/territory-adapter.js
          node --check src/v2/territory-surface.js
          node --check src/v2/watch-adapter.js
          node --check src/v2/watch-surface.js
          node --check tests/atlas-v2-entity360-analytics.mjs
          node --check tests/atlas-v2-public-spend-native.mjs
          node --check tests/atlas-v2-relations-native.mjs
          node --check tests/atlas-v2-universes-native.mjs
          node --check tests/atlas-v2-territory-native.mjs
          node --check tests/atlas-v2-watch-native.mjs

      - name: Enforce analytics-first product contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          js = Path('src/v2/atlas-v2-shell.js').read_text(encoding='utf-8')
          css = Path('src/v2/atlas-v2-shell.css').read_text(encoding='utf-8')
          html = Path('atlas-v2.html').read_text(encoding='utf-8')
          contract = Path('docs/ATLAS_V2_ANALYTICS_FIRST.md').read_text(encoding='utf-8')
          assert 'MutationObserver' not in js
          assert '.innerHTML' not in js
          assert 'raw.githubusercontent.com' not in js
          assert 'supabase.from(' not in js
          assert 'select("*")' not in js and "select('*')" not in js
          assert "addEventListener('hashchange', render)" in js
          assert 'URLSearchParams' in js
          assert "event.metaKey || event.ctrlKey" in js
          assert "toLocaleLowerCase() === 'k'" in js
          for route in ['explorar','universos','entidad','gasto-publico','territorio','relaciones','vigilancia','guardados','metodo']:
              assert f"id: '{route}'" in js, route
          for forbidden_route in ["id: 'casos'", "id: 'tareas'", "id: 'cola'", "id: 'asignaciones'", "id: 'sla'"]:
              assert forbidden_route not in js, forbidden_route
          assert 'No se creó ningún caso ni tarea.' in js
          assert 'Exploración primero · seguimiento opcional' in js
          assert 'Exploration is free; follow-up is optional.' in contract
          assert '--atlas-bg:' in css and '--atlas-surface:' in css and '--atlas-accent:' in css
          assert 'data-atlas-v2-foundation="analytics-first"' in html
          assert "'unsafe-inline'" not in html
          print('ATLAS v2 analytics-first invariants: OK')
          PY

      - name: Validate Entity 360 analytical contract
        run: node tests/atlas-v2-entity360-analytics.mjs

      - name: Validate native Public Spend analytical contract
        run: node tests/atlas-v2-public-spend-native.mjs

      - name: Validate native Relations analytical contract
        run: node tests/atlas-v2-relations-native.mjs

      - name: Validate native Universes analytical contract
        run: node tests/atlas-v2-universes-native.mjs

      - name: Validate native Territory analytical contract
        run: node tests/atlas-v2-territory-native.mjs

      - name: Validate native Vigilance analytical contract
        run: node tests/atlas-v2-watch-native.mjs

      - name: Build isolated preview artifact
        run: |
          set -euo pipefail
          rm -rf _atlas_v2_preview
          mkdir -p _atlas_v2_preview/v2
          cp atlas-v2.html _atlas_v2_preview/index.html
          cp src/v2/atlas-v2-shell.js _atlas_v2_preview/v2/
          cp src/v2/atlas-v2-shell.css _atlas_v2_preview/v2/
          cp src/v2/atlas-v2-boot.js _atlas_v2_preview/v2/
          cp src/v2/atlas-v2-data.js _atlas_v2_preview/v2/
          cp src/v2/atlas-v2-session.js _atlas_v2_preview/v2/
          cp src/v2/atlas-v2-access.js _atlas_v2_preview/v2/
          cp src/v2/entity360-adapter.js _atlas_v2_preview/v2/
          cp src/v2/entity360-surface.js _atlas_v2_preview/v2/
          cp src/v2/entity360-surface.css _atlas_v2_preview/v2/
          cp src/v2/public-spend-surface.js _atlas_v2_preview/v2/
          cp src/v2/public-spend-surface.css _atlas_v2_preview/v2/
          cp src/v2/relations-surface.js _atlas_v2_preview/v2/
          cp src/v2/relations-surface.css _atlas_v2_preview/v2/
          cp src/v2/universes-adapter.js _atlas_v2_preview/v2/
          cp src/v2/universes-surface.js _atlas_v2_preview/v2/
          cp src/v2/universes-surface.css _atlas_v2_preview/v2/
          cp src/v2/territory-adapter.js _atlas_v2_preview/v2/
          cp src/v2/territory-surface.js _atlas_v2_preview/v2/
          cp src/v2/territory-surface.css _atlas_v2_preview/v2/
          cp src/v2/watch-adapter.js _atlas_v2_preview/v2/
          cp src/v2/watch-surface.js _atlas_v2_preview/v2/
          cp src/v2/watch-surface.css _atlas_v2_preview/v2/
          touch _atlas_v2_preview/.nojekyll

      - name: Verify preview is isolated from production runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('_atlas_v2_preview/index.html').read_text(encoding='utf-8')
          assert 'atlas-runtime-current' not in html
          assert 'atlas-public-spend-v2' not in html
          assert 'ATLAS_RUNTIME_SCRIPTS' not in html
          assert 'ldmtlwzqaqmegedktlxr' not in html
          required = [
              'atlas-v2-shell.js','atlas-v2-shell.css','atlas-v2-data.js','atlas-v2-session.js','atlas-v2-access.js',
              'entity360-adapter.js','entity360-surface.js','entity360-surface.css',
              'public-spend-surface.js','public-spend-surface.css','relations-surface.js','relations-surface.css',
              'universes-adapter.js','universes-surface.js','universes-surface.css',
              'territory-adapter.js','territory-surface.js','territory-surface.css',
              'watch-adapter.js','watch-surface.js','watch-surface.css',
          ]
          for name in required:
              assert Path('_atlas_v2_preview/v2', name).exists(), name
          for name in ['universes-adapter.js','universes-surface.js','territory-adapter.js','territory-surface.js','watch-adapter.js','watch-surface.js']:
              assert 'ldmtlwzqaqmegedktlxr' not in Path('_atlas_v2_preview/v2', name).read_text(encoding='utf-8'), name
          assert not Path('_atlas_v2_preview/v2/public-spend-adapter.js').exists()
          assert not Path('_atlas_v2_preview/v2/public-spend-route-bridge.js').exists()
          print('Isolated v2 preview artifact: OK')
          PY

      - name: Upload analytics shell preview
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v2-analytics-shell
          path: _atlas_v2_preview
          retention-days: 7
