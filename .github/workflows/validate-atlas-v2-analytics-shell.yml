name: Validate ATLAS v2 analytics shell

on:
  push:
    branches: [main]
    paths: &v2_paths
      - 'atlas-v2.html'
      - 'atlas-v2-release.json'
      - 'src/v2/**'
      - 'supabase/functions/atlas-v2-read/index.ts'
      - 'supabase/core-migrations/*atlas_v2_entity_search*'
      - 'supabase/migrations/20260907023000_atlas_v2_relations_query.sql'
      - 'supabase/core-contracts/atlas-v2-universes-query-v2.sql'
      - 'supabase/core-contracts/atlas-v2-territory-watch-query-v2.sql'
      - 'tests/atlas-v2-*.mjs'
      - 'tools/build_atlas_v2_primary.py'
      - 'tools/e2e_atlas_runtime_smoke.mjs'
      - 'tools/e2e_atlas_v2_ux_preflight.mjs'
      - 'tools/serve_atlas_v2_e2e.mjs'
      - 'docs/ATLAS_V2_ANALYTICS_FIRST.md'
      - '.github/workflows/validate-atlas-v2-analytics-shell.yml'
      - '.github/workflows/e2e-atlas-runtime-smoke.yml'
      - '.github/workflows/deploy-atlas-pages-current.yml'
  pull_request:
    branches: [main]
    paths: *v2_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        run: |
          set -euo pipefail
          for f in \
            src/v2/atlas-v2-production-config.js src/v2/atlas-v2-health.js src/v2/atlas-v2-core-auth.js \
            src/v2/atlas-v2-shell.js src/v2/atlas-v2-boot.js src/v2/atlas-v2-data.js src/v2/atlas-v2-session.js \
            src/v2/atlas-v2-access.js src/v2/atlas-v2-viz.js src/v2/entity-search-adapter.js \
            src/v2/explore-surface.js src/v2/entity360-adapter.js src/v2/entity360-surface.js \
            src/v2/public-spend-surface.js src/v2/relations-surface.js src/v2/universes-adapter.js \
            src/v2/universes-surface.js src/v2/territory-adapter.js src/v2/territory-surface.js \
            src/v2/watch-adapter.js src/v2/watch-surface.js; do node --check "$f"; done
          for f in tests/atlas-v2-*.mjs; do node --check "$f"; done
          node --check tools/e2e_atlas_runtime_smoke.mjs
          node --check tools/e2e_atlas_v2_ux_preflight.mjs
          node --check tools/serve_atlas_v2_e2e.mjs
          python3 -m py_compile tools/build_atlas_v2_primary.py
          git diff --check

      - name: Enforce analytics-first visual/search contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          shell=Path('src/v2/atlas-v2-shell.js').read_text()
          boot=Path('src/v2/atlas-v2-boot.js').read_text()
          explore=Path('src/v2/explore-surface.js').read_text()
          entity=Path('src/v2/entity360-surface.js').read_text()
          adapter=Path('src/v2/entity-search-adapter.js').read_text()
          viz=Path('src/v2/atlas-v2-viz.js').read_text()
          html=Path('atlas-v2.html').read_text()
          primary=json.loads(Path('atlas-v2-release.json').read_text())
          legacy=json.loads(Path('atlas-release.json').read_text())
          sql=Path('supabase/core-migrations/20260907111841_atlas_v2_entity_search_allowlist_hardening.sql').read_text()
          edge=Path('supabase/functions/atlas-v2-read/index.ts').read_text()

          assert primary['release']=='2.0.2' and str(primary['build'])=='2002'
          assert primary['visual_navigation']=='INTERACTIVE_FIRST'
          assert primary['entity_search']=='RUT_NAME_UAF_PRESS'
          assert str(primary['legacy_fallback']['release'])==str(legacy['release'])
          assert str(primary['legacy_fallback']['build'])==str(legacy['build'])
          assert primary['legacy_fallback']['authority_active_on_primary'] is False
          for route in ['explorar','universos','entidad','gasto-publico','territorio','relaciones','vigilancia','guardados','metodo']:
              assert f"id: '{route}'" in shell
          for forbidden in ["id: 'casos'","id: 'tareas'","id: 'cola'","id: 'sla'"]:
              assert forbidden not in shell
          assert "STRUCTURAL_VERSION = 'v2-primary-3'" in boot
          assert 'atlas-v2-viz.js' in boot and 'entity-search-adapter.js' in boot
          assert 'VISUAL_SEARCH_CAPABILITY_MISSING' in boot
          assert 'AtlasV2Viz.horizontalBars' in explore and 'AtlasV2Viz.segmented' in explore
          assert 'AtlasV2EntitySearch.search' in entity and 'Radar Prensa' in entity and 'entity_id' in entity
          assert 'lineChart' in entity and 'TRAYECTORIA SII' in entity
          assert 'ATLAS_ENTITY_SEARCH_V2' in adapter and "operation: 'entity_search'" in adapter
          assert all(x in viz for x in ['horizontalBars','lineChart','segmented'])
          assert 'aml_allowed_users' in sql and 'auth.uid()' in sql and 'security definer' in sql.lower()
          assert 'security invoker' in sql.lower()
          assert 'entity_search' in edge and 'atlas_v2_entity_search' in edge
          assert './v2/atlas-v2-boot.js?v=v2-primary-3' in html
          for source in [shell,boot,explore,entity,adapter,viz]:
              assert 'MutationObserver' not in source
              assert '.innerHTML' not in source
          assert 'raw.githubusercontent.com' not in explore and 'raw.githubusercontent.com' not in entity
          print('ATLAS 2.0.2 analytics-first visual/search invariants: OK')
          PY

      - name: Validate analytical surfaces
        run: |
          set -euo pipefail
          node tests/atlas-v2-explore-live.mjs
          node tests/atlas-v2-entity360-analytics.mjs
          node tests/atlas-v2-public-spend-native.mjs
          node tests/atlas-v2-relations-native.mjs
          node tests/atlas-v2-universes-native.mjs
          node tests/atlas-v2-territory-native.mjs
          node tests/atlas-v2-watch-native.mjs

      - name: Build and verify production artifact
        run: |
          set -euo pipefail
          python3 tools/build_atlas_v2_primary.py --out _atlas_v2_primary
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('_atlas_v2_primary')
          p=json.loads((root/'atlas-v2-release.json').read_text())
          l=json.loads((root/'atlas-release.json').read_text())
          r=json.loads((root/'atlas-runtime-report.json').read_text())
          html=(root/'index.html').read_text()
          legacy=(root/'legacy.html').read_text()
          assert p['release']=='2.0.2' and str(p['build'])=='2002'
          assert r['v2_explore_mode']=='LIVE_PULSE_VISUAL'
          assert r['v2_visual_navigation']=='INTERACTIVE_FIRST'
          assert r['v2_entity_search']=='RUT_NAME_UAF_PRESS'
          assert 'atlas-runtime-current-' not in html and 'atlas-runtime-current-' in legacy
          assert f'data-aml-version="{p["release"]}"' in html
          assert f'data-aml-version="{l["release"]}"' in legacy
          for name in ['atlas-v2-viz.js','atlas-v2-viz.css','entity-search-adapter.js','explore-surface.js','entity360-surface.js']:
              assert (root/'v2'/name).is_file(), name
          print('ATLAS 2.0.2 production artifact: OK')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-v2-primary
          path: _atlas_v2_primary
          retention-days: 7
