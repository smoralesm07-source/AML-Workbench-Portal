name: Validate ATLAS v2 analytics shell

on:
  push:
    branches:
      - reengineering/atlas-v2-analytics-shell
    paths: &v2_paths
      - 'atlas-v2.html'
      - 'src/v2/**'
      - 'supabase/functions/atlas-v2-read/index.ts'
      - 'supabase/migrations/20260907023000_atlas_v2_relations_query.sql'
      - 'supabase/core-contracts/atlas-v2-universes-query-v2.sql'
      - 'supabase/core-contracts/atlas-v2-territory-watch-query-v2.sql'
      - 'tests/atlas-v2-*.mjs'
      - 'tools/build_atlas_v2_primary.py'
      - 'tools/e2e_atlas_runtime_smoke.mjs'
      - 'tools/serve_atlas_v2_e2e.mjs'
      - 'docs/ATLAS_V2_ANALYTICS_FIRST.md'
      - '.github/workflows/validate-atlas-v2-analytics-shell.yml'
      - '.github/workflows/e2e-atlas-runtime-smoke.yml'
      - '.github/workflows/deploy-atlas-pages-current.yml'
  pull_request:
    paths: *v2_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          set -euo pipefail
          for f in \
            src/v2/atlas-v2-production-config.js \
            src/v2/atlas-v2-health.js \
            src/v2/atlas-v2-core-auth.js \
            src/v2/atlas-v2-shell.js \
            src/v2/atlas-v2-boot.js \
            src/v2/atlas-v2-data.js \
            src/v2/atlas-v2-session.js \
            src/v2/atlas-v2-access.js \
            src/v2/entity360-adapter.js \
            src/v2/entity360-surface.js \
            src/v2/public-spend-surface.js \
            src/v2/relations-surface.js \
            src/v2/universes-adapter.js \
            src/v2/universes-surface.js \
            src/v2/territory-adapter.js \
            src/v2/territory-surface.js \
            src/v2/watch-adapter.js \
            src/v2/watch-surface.js; do
            node --check "$f"
          done
          for f in tests/atlas-v2-*.mjs; do node --check "$f"; done
          node --check tools/e2e_atlas_runtime_smoke.mjs
          node --check tools/serve_atlas_v2_e2e.mjs
          python3 -m py_compile tools/build_atlas_v2_primary.py

      - name: Enforce analytics-first and launch-hardening contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          shell = Path('src/v2/atlas-v2-shell.js').read_text(encoding='utf-8')
          css = Path('src/v2/atlas-v2-shell.css').read_text(encoding='utf-8')
          html = Path('atlas-v2.html').read_text(encoding='utf-8')
          auth = Path('src/v2/atlas-v2-core-auth.js').read_text(encoding='utf-8')
          boot = Path('src/v2/atlas-v2-boot.js').read_text(encoding='utf-8')
          health = Path('src/v2/atlas-v2-health.js').read_text(encoding='utf-8')
          config = Path('src/v2/atlas-v2-production-config.js').read_text(encoding='utf-8')
          contract = Path('docs/ATLAS_V2_ANALYTICS_FIRST.md').read_text(encoding='utf-8')
          assert 'MutationObserver' not in shell and '.innerHTML' not in shell
          assert 'MutationObserver' not in auth and '.innerHTML' not in auth
          assert 'raw.githubusercontent.com' not in shell
          assert 'supabase.from(' not in shell
          assert 'select("*")' not in shell and "select('*')" not in shell
          assert "addEventListener('hashchange', render)" in shell
          assert 'URLSearchParams' in shell
          assert "event.metaKey || event.ctrlKey" in shell
          for route in ['explorar','universos','entidad','gasto-publico','territorio','relaciones','vigilancia','guardados','metodo']:
              assert f"id: '{route}'" in shell, route
          for forbidden_route in ["id: 'casos'", "id: 'tareas'", "id: 'cola'", "id: 'asignaciones'", "id: 'sla'"]:
              assert forbidden_route not in shell, forbidden_route
          assert 'No se creó ningún caso ni tarea.' in shell
          assert 'Exploración primero · seguimiento opcional' in shell
          assert 'Exploration is free; follow-up is optional.' in contract
          assert '--atlas-bg:' in css and '--atlas-surface:' in css and '--atlas-accent:' in css
          assert 'data-atlas-v2-foundation="analytics-first"' in html
          assert 'data-atlas-v2-primary="analytics"' in html
          assert './v2/atlas-v2-health.js?v=v2-primary-1' in html
          assert "'unsafe-inline'" not in html
          assert 'signInWithOAuth' in auth and "provider: 'azure'" in auth
          assert '.auth.getUser()' in auth and 'aml_allowed_users' in auth
          assert "event === 'TOKEN_REFRESHED'" in auth and 'resetFederatedSession' in auth
          assert 'AtlasCoreSession.ready' in boot
          assert 'STRUCTURAL_SURFACE_LOAD_FAILED' in boot and 'INICIO BLOQUEADO' in boot
          assert "ATLAS_V2_RUNTIME_HEALTH_V1" in health
          for secret_word in ['access_token','refresh_token','authorization','email','rut','query']:
              assert secret_word not in health.lower(), secret_word
          assert "mode: 'analytics-primary'" in config
          assert "legacyFallbackPath: './legacy.html'" in config
          print('ATLAS v2 analytics-first + launch-hardening invariants: OK')
          PY

      - name: Validate analytical surfaces
        run: |
          set -euo pipefail
          node tests/atlas-v2-entity360-analytics.mjs
          node tests/atlas-v2-public-spend-native.mjs
          node tests/atlas-v2-relations-native.mjs
          node tests/atlas-v2-universes-native.mjs
          node tests/atlas-v2-territory-native.mjs
          node tests/atlas-v2-watch-native.mjs

      - name: Build primary cutover artifact
        run: |
          set -euo pipefail
          python3 tools/build_atlas_v2_primary.py --out _atlas_v2_primary

      - name: Verify primary authority and reversible fallback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('_atlas_v2_primary')
          html=(root/'index.html').read_text(encoding='utf-8')
          legacy=(root/'legacy.html').read_text(encoding='utf-8')
          report=json.loads((root/'atlas-runtime-report.json').read_text(encoding='utf-8'))
          assert report['primary_runtime']=='ATLAS_V2_ANALYTICS'
          assert report['legacy_fallback']=='legacy.html'
          assert report['legacy_authority_active_on_primary'] is False
          assert report['v2_auth_boundary']=='ENTRA_SUPABASE_ALLOWLIST_VERIFIED_USER'
          assert report['v2_runtime_health']=='SANITIZED_IN_MEMORY'
          assert report['v2_structural_surface_policy']=='FAIL_CLOSED'
          assert report['v2_e2e_proxy'] is False
          assert 'data-atlas-v2-primary="analytics"' in html
          assert 'atlas-runtime-current-' not in html
          assert 'atlas-module-current-' not in html
          assert 'ATLAS_RUNTIME_SCRIPTS' not in html
          assert 'raw.githubusercontent.com' not in html
          assert 'atlas-runtime-current-' in legacy
          assert './legacy.html' not in html
          required=[
            'atlas-v2-production-config.js','atlas-v2-health.js','atlas-v2-core-auth.js','atlas-v2-core-auth.css',
            'atlas-v2-shell.js','atlas-v2-shell.css','atlas-v2-boot.js','atlas-v2-data.js','atlas-v2-session.js','atlas-v2-access.js',
            'entity360-adapter.js','entity360-surface.js','entity360-surface.css',
            'public-spend-surface.js','public-spend-surface.css','relations-surface.js','relations-surface.css',
            'universes-adapter.js','universes-surface.js','universes-surface.css',
            'territory-adapter.js','territory-surface.js','territory-surface.css',
            'watch-adapter.js','watch-surface.js','watch-surface.css',
          ]
          for name in required: assert (root/'v2'/name).is_file(), name
          assert (root/'assets'/'supabase-js-2.111.0.umd.js').is_file()
          print('ATLAS v2 primary artifact + explicit legacy rollback: OK')
          PY

      - name: Upload v2 primary preview
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v2-primary
          path: _atlas_v2_primary
          retention-days: 7
