name: RES official data ingest

on:
  schedule:
    # El RES publica cortes mensuales sin una hora fija. Consultamos cada 4 h
    # para reducir la latencia entre la publicación oficial y Atlas.
    - cron: '20 */4 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'current o año calendario; use all para backfill'
        required: true
        default: 'current'
  push:
    branches: [main]
    paths:
      - 'ops/res/**'
      - '.github/workflows/res-ingest.yml'
  pull_request:
    paths:
      - 'ops/res/**'
      - '.github/workflows/res-ingest.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-res-ingest
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate RES loader
        run: |
          python -m py_compile ops/res/ingest.py
          python ops/res/ingest.py --self-test
          python ops/res/ingest.py --help >/dev/null

  ingest:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve requested scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_YEAR: ${{ github.event.inputs.year }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            requested="${INPUT_YEAR:-current}"
          else
            requested="current"
          fi
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
      - name: Ingest official RES data into Atlas with recovery
        env:
          REQUESTED: ${{ steps.scope.outputs.requested }}
        run: |
          set -u
          run_ingest() {
            if [ "$REQUESTED" = "all" ]; then
              python ops/res/ingest.py --all
            else
              python ops/res/ingest.py --year "$REQUESTED"
            fi
          }

          # Un fallo de conciliación/timeout no debe dejar el nuevo corte fuera
          # de Atlas hasta el siguiente día. Reintentamos en la misma ejecución.
          for attempt in 1 2 3; do
            echo "[RES] intento ${attempt}/3"
            if run_ingest; then
              echo "[RES] ingesta completada"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              wait_seconds=$((attempt * 300))
              echo "[RES] intento fallido; reintento en ${wait_seconds}s"
              sleep "$wait_seconds"
            fi
          done

          echo "[RES] ingesta falló después de 3 intentos"
          exit 1
