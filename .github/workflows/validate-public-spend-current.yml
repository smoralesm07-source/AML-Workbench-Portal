name: Validate Gasto Público · ATLAS current

on:
  pull_request:
    branches: [main]
    paths:
      - 'v037-public-spend.js'
      - 'v037-public-spend.css'
      - 'v038-entity360.js'
      - 'atlas-current-ui.js'
      - 'atlas-current-ui.css'
      - 'atlas-runtime-manifest.json'
      - 'atlas-release.json'
      - 'build.json'
      - '.github/workflows/validate-public-spend-current.yml'
  push:
    branches: [main]
    paths:
      - 'v037-public-spend.js'
      - 'v037-public-spend.css'
      - 'v038-entity360.js'
      - 'atlas-current-ui.js'
      - 'atlas-current-ui.css'
      - 'atlas-runtime-manifest.json'
      - 'atlas-release.json'
      - 'build.json'
      - '.github/workflows/validate-public-spend-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-public-spend-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate local integration
        shell: bash
        run: |
          set -euo pipefail
          node --check v037-public-spend.js
          node --check v038-entity360.js
          node --check atlas-current-ui.js
          python - <<'PY'
          import json
          r=json.load(open('atlas-release.json'))
          m=json.load(open('atlas-runtime-manifest.json'))
          assert r['release']==m['release'] and r['build']==m['build']
          paths=[x['path'] for x in m['scripts']]
          assert 'v037-public-spend.js' in paths
          assert 'v038-entity360.js' in paths
          assert 'v037-final.module.js' not in paths
          assert 'v038-final.module.js' not in paths
          PY
          grep -q 'PROVEEDOR_SOURCE_TRUE_AND_NOT_INTRAESTADO_AND_NOT_PUBLIC_NAME' v037-public-spend.js
          grep -q 'aml_v0205_uaf_sii_reconciliation' v037-public-spend.js
          grep -q 'v037LoadData' v038-entity360.js
          grep -q 'Gasto público' atlas-current-ui.js

      - name: Validate live Radar Presupuesto Abierto contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          base='https://raw.githubusercontent.com/smoralesm07-source/Rada_Presupuesto_Abierto/main/docs/data/'
          def load(name):
              req=urllib.request.Request(base+name,headers={'User-Agent':'ATLAS-AML-current-validation'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          status=load('spend_corrected_v3_status.json')
          ui=load('spend_v131_status.json')
          assert status.get('validation')=='success'
          assert status.get('service_grain')=='PARTIDA_CAPITULO'
          assert status.get('provider_metrics')=='FULL_PRIVATE_RELATION_UNIVERSE'
          assert status.get('payment_basis')=='FECHA_PAGO_AND_MONTO_PAGO'
          assert ui.get('mark_filter_bundle')=='success'
          assert ui.get('filter_mode')=='single_toggle'
          PY
