name: Verify Live ATLAS AML current release

on:
  workflow_run:
    workflows:
      - 'Deploy current ATLAS AML release'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-live-atlas-current
  cancel-in-progress: true

env:
  ATLAS_RELEASE: '0.42.2'
  ATLAS_BUILD: '0422'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify exact served ATLAS bootstrap
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          URL='https://smoralesm07-source.github.io/AML-Workbench-Portal/'
          stamp=$(date +%s)
          curl --fail --silent --show-error --location --retry 10 --retry-delay 3 "${URL}?atlas_release=${ATLAS_RELEASE}:${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/live.html
          grep -q "data-aml-version=\"${ATLAS_RELEASE}\"" /tmp/live.html
          grep -q "data-aml-build=\"${ATLAS_BUILD}\"" /tmp/live.html
          grep -q "v0422-auth-bootstrap-fix.js?r=${ATLAS_BUILD}" /tmp/live.html
          grep -q "v040-theme-bootstrap.js?r=${ATLAS_BUILD}" /tmp/live.html
          grep -q "v0333-auth-preflight.js?r=${ATLAS_BUILD}" /tmp/live.html
          grep -q "app.js?r=${ATLAS_BUILD}" /tmp/live.html

          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "${URL}atlas-release.json?_atlas=${stamp}" -o /tmp/release.json
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "${URL}atlas-release-guard.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/guard.js
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "${URL}v0402-aie-brand.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/aie.js
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "${URL}v0422-auth-bootstrap-fix.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/authfix.js
          python - <<'PY'
          import json,os
          m=json.load(open('/tmp/release.json'))
          assert m['release']==os.environ['ATLAS_RELEASE'],m
          assert m['build']==os.environ['ATLAS_BUILD'],m
          assert m['bootstrap_policy']=='NO_SELF_SUSTAINING_MUTATION_OBSERVERS',m
          PY
          grep -q "ROOT_ATTRIBUTES_ONLY" /tmp/guard.js
          ! grep -q "characterData:true" /tmp/aie.js
          grep -q "CHILD_INSERTIONS_ONLY_NO_CHARACTERDATA_LOOP" /tmp/aie.js
          grep -q "audit is best-effort" /tmp/authfix.js
          grep -q "AUTH_TIMEOUT=6500" /tmp/authfix.js
          grep -q "HARD_WATCHDOG=8500" /tmp/authfix.js

      - name: Publish current live status
        if: always()
        env:
          LIVE: ${{ steps.live.outcome }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          live=os.environ.get('LIVE')
          deploy=os.environ.get('DEPLOY_CONCLUSION') or 'manual'
          ok=(live=='success' and deploy in ('success','manual'))
          payload={
            'workbench_version':os.environ['ATLAS_RELEASE'],
            'build':os.environ['ATLAS_BUILD'],
            'product_name':'ATLAS AML',
            'release_policy':'SINGLE_ACTIVE_RELEASE',
            'legacy_release_policy':'GIT_HISTORY_ONLY_NOT_ACTIVE_RUNTIME',
            'pages_deploy':deploy,
            'live_smoke':live,
            'status':'success' if ok else 'failure',
            'required_assets':['atlas-release.json','atlas-release-guard.js','v040-theme-bootstrap.js','v0402-aie-brand.js','v0422-auth-bootstrap-fix.js','v0333-auth-preflight.js','app.js','v0402-reconciliation-live.js','v039-atlas-brand.js','v0391-entity-entry.js','v038-entity360.js','v037-public-spend.js'],
            'blocked_runtime_authorities':['v035-final.module.js','v036-final.module.js'],
            'bootstrap_policy':'NO_SELF_SUSTAINING_MUTATION_OBSERVERS+NON_BLOCKING_AUDIT+AUTH_TIMEOUT_DIAGNOSTIC'
          }
          Path('data/public_spend_v037_live_status.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name "aml-workbench-bot"
          git config user.email "aml-workbench-bot@users.noreply.github.com"
          git add data/public_spend_v037_live_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: publica smoke live ATLAS AML current release"
          git pull --rebase origin main
          git push origin main

      - name: Fail if current release is not served
        if: steps.live.outcome != 'success' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success')
        run: exit 1
