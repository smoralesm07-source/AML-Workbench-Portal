name: Verify Live ATLAS AML current release

on:
  workflow_run:
    workflows:
      - 'Deploy current ATLAS AML release'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-live-atlas-current
  cancel-in-progress: true

env:
  ATLAS_RELEASE: '0.42.5'
  ATLAS_BUILD: '0425'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify exact served ATLAS release and current UI
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          URL='https://smoralesm07-source.github.io/AML-Workbench-Portal/'
          stamp=$(date +%s)
          curl -fsSL --retry 10 --retry-delay 3 "${URL}?atlas_release=${ATLAS_RELEASE}:${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/live.html
          grep -q "data-aml-version=\"${ATLAS_RELEASE}\"" /tmp/live.html
          grep -q "data-aml-build=\"${ATLAS_BUILD}\"" /tmp/live.html
          ! grep -q '?b=' /tmp/live.html
          curl -fsSL "${URL}atlas-release.json?_atlas=${stamp}" -o /tmp/release.json
          curl -fsSL "${URL}v040-theme-bootstrap.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/theme.js
          curl -fsSL "${URL}atlas-current-ui.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/current.js
          curl -fsSL "${URL}atlas-current-ui.css?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/current.css
          curl -fsSL "${URL}v037-final.module.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/v037.js
          curl -fsSL "${URL}v038-final.module.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/v038.js
          python - <<'PY'
          import json,os
          m=json.load(open('/tmp/release.json'))
          assert m['release']==os.environ['ATLAS_RELEASE'],m
          assert m['build']==os.environ['ATLAS_BUILD'],m
          assert m['ui_authority_policy']=='ATLAS_CURRENT_UI_LAST_WRITER',m
          assert m['navigation_policy']=='UNIFORM_LEVEL_NO_LEGACY_PSEUDO_MARKERS',m
          PY
          grep -q "atlas-current-ui.js?r=${ATLAS_BUILD}" /tmp/theme.js
          grep -q "atlas-current-ui.css?r=${ATLAS_BUILD}" /tmp/theme.js
          grep -q "Gasto público" /tmp/current.js
          grep -q "content:none!important" /tmp/current.css
          grep -q "atlas-release-guard-via-v037-compat" /tmp/v037.js
          grep -q "atlas-release-guard-via-v038-compat" /tmp/v038.js

      - name: Publish current live status
        if: always()
        env:
          LIVE: ${{ steps.live.outcome }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          live=os.environ.get('LIVE')
          deploy=os.environ.get('DEPLOY_CONCLUSION') or 'manual'
          ok=(live=='success' and deploy in ('success','manual'))
          payload={
            'workbench_version':os.environ['ATLAS_RELEASE'],
            'build':os.environ['ATLAS_BUILD'],
            'product_name':'ATLAS AML',
            'release_policy':'SINGLE_ACTIVE_RELEASE',
            'pages_deploy':deploy,
            'live_smoke':live,
            'status':'success' if ok else 'failure',
            'visible_version_authority':'ATLAS_RELEASE_GUARD_ONLY',
            'asset_coherency_policy':'ALL_LOCAL_JS_CSS_PINNED_TO_CURRENT_BUILD',
            'ui_authority_policy':'ATLAS_CURRENT_UI_LAST_WRITER',
            'navigation_policy':'UNIFORM_LEVEL_NO_LEGACY_PSEUDO_MARKERS',
            'required_assets':['atlas-release.json','atlas-release-guard.js','atlas-current-ui.js','atlas-current-ui.css','v037-final.module.js','v038-final.module.js','v040-theme-bootstrap.js']
          }
          Path('data/public_spend_v037_live_status.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name "aml-workbench-bot"
          git config user.email "aml-workbench-bot@users.noreply.github.com"
          git add data/public_spend_v037_live_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: publica smoke live ATLAS AML current release"
          git pull --rebase origin main
          git push origin main

      - name: Fail if current release is not served
        if: steps.live.outcome != 'success' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success')
        run: exit 1
