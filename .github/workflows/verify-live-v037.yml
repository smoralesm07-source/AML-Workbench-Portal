name: Verify Live ATLAS AML current release

on:
  workflow_run:
    workflows:
      - 'Deploy current ATLAS AML release'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-live-atlas-current
  cancel-in-progress: true

env:
  ATLAS_RELEASE: '0.42.4'
  ATLAS_BUILD: '0424'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify exact served ATLAS release and coherent asset graph
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          URL='https://smoralesm07-source.github.io/AML-Workbench-Portal/'
          stamp=$(date +%s)
          curl --fail --silent --show-error --location --retry 10 --retry-delay 3 "${URL}?atlas_release=${ATLAS_RELEASE}:${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/live.html
          grep -q "data-aml-version=\"${ATLAS_RELEASE}\"" /tmp/live.html
          grep -q "data-aml-build=\"${ATLAS_BUILD}\"" /tmp/live.html
          grep -q "v0342-runtime.js?r=${ATLAS_BUILD}" /tmp/live.html
          grep -q "v0343-final.module.js?r=${ATLAS_BUILD}" /tmp/live.html
          grep -q "v038-entity360.js?r=${ATLAS_BUILD}" /tmp/live.html
          grep -q "v0391-entity-entry.js?r=${ATLAS_BUILD}" /tmp/live.html
          grep -q "v037-public-spend.js?r=${ATLAS_BUILD}" /tmp/live.html
          grep -q "v040-theme-bootstrap.js?r=${ATLAS_BUILD}" /tmp/live.html
          ! grep -q '?b=' /tmp/live.html

          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "${URL}atlas-release.json?_atlas=${stamp}" -o /tmp/release.json
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "${URL}atlas-release-guard.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/guard.js
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "${URL}v0342-runtime.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/v0342.js
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "${URL}v0343-final.module.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/v0343.js
          python - <<'PY'
          import json,os
          m=json.load(open('/tmp/release.json'))
          assert m['release']==os.environ['ATLAS_RELEASE'],m
          assert m['build']==os.environ['ATLAS_BUILD'],m
          assert m['asset_coherency_policy']=='ALL_LOCAL_JS_CSS_PINNED_TO_CURRENT_BUILD',m
          assert m['visible_version_policy']=='ATLAS_RELEASE_GUARD_ONLY_LEGACY_RUNTIME_DELEGATES',m
          PY
          grep -q "ALL_LOCAL_JS_CSS_PINNED_TO_CURRENT_BUILD" /tmp/guard.js
          grep -q "atlas-release-guard-via-v0342-compat" /tmp/v0342.js
          grep -q "atlas-release-guard-via-v0343-compat" /tmp/v0343.js
          grep -q "v0344-public-entities.module.js?r=${ATLAS_BUILD}" /tmp/v0343.js
          ! grep -q "window.__AML_ACTIVE_VERSION__=V0342_RUNTIME" /tmp/v0342.js
          ! grep -q 'Operational Radar · v${V0342_RUNTIME}' /tmp/v0342.js
          ! grep -q "window.__AML_ACTIVE_VERSION__=VERSION" /tmp/v0343.js

      - name: Publish current live status
        if: always()
        env:
          LIVE: ${{ steps.live.outcome }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          live=os.environ.get('LIVE')
          deploy=os.environ.get('DEPLOY_CONCLUSION') or 'manual'
          ok=(live=='success' and deploy in ('success','manual'))
          payload={
            'workbench_version':os.environ['ATLAS_RELEASE'],
            'build':os.environ['ATLAS_BUILD'],
            'product_name':'ATLAS AML',
            'release_policy':'SINGLE_ACTIVE_RELEASE',
            'legacy_release_policy':'GIT_HISTORY_ONLY_NOT_ACTIVE_RUNTIME',
            'pages_deploy':deploy,
            'live_smoke':live,
            'status':'success' if ok else 'failure',
            'visible_version_authority':'ATLAS_RELEASE_GUARD_ONLY',
            'asset_coherency_policy':'ALL_LOCAL_JS_CSS_PINNED_TO_CURRENT_BUILD',
            'required_assets':['atlas-release.json','atlas-release-guard.js','v0342-runtime.js','v0343-final.module.js','v038-entity360.js','v0391-entity-entry.js','v037-public-spend.js','v040-theme-bootstrap.js','v0402-aie-brand.js','v0422-auth-bootstrap-fix.js','v0333-auth-preflight.js','app.js'],
            'blocked_runtime_authorities':['v035-final.module.js','v036-final.module.js']
          }
          Path('data/public_spend_v037_live_status.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name "aml-workbench-bot"
          git config user.email "aml-workbench-bot@users.noreply.github.com"
          git add data/public_spend_v037_live_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: publica smoke live ATLAS AML current release"
          git pull --rebase origin main
          git push origin main

      - name: Fail if current release is not served
        if: steps.live.outcome != 'success' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success')
        run: exit 1
