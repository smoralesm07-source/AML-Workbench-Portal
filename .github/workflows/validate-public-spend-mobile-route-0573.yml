name: Validate Public Spend Progressive Route

on:
  pull_request:
    paths:
      - 'assets/atlas-public-spend-mobile-route-0573.js'
      - 'assets/atlas-public-spend-route-authority-0578.js'
      - 'assets/atlas-public-spend-progressive-0577.css'
      - 'assets/atlas-mobile-nav.js'
      - 'index.html'
      - 'tools/build_atlas_site.py'
      - 'tests/atlas-public-spend-mobile-route-0573.mjs'
      - '.github/workflows/validate-public-spend-mobile-route-0573.yml'
  push:
    branches: [main]
    paths:
      - 'assets/atlas-public-spend-mobile-route-0573.js'
      - 'assets/atlas-public-spend-route-authority-0578.js'
      - 'assets/atlas-public-spend-progressive-0577.css'
      - 'assets/atlas-mobile-nav.js'
      - 'index.html'
      - 'tools/build_atlas_site.py'
      - 'tests/atlas-public-spend-mobile-route-0573.mjs'
      - '.github/workflows/validate-public-spend-mobile-route-0573.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check assets/atlas-public-spend-mobile-route-0573.js
          node --check assets/atlas-public-spend-route-authority-0578.js
      - name: Progressive route contract
        run: node tests/atlas-public-spend-mobile-route-0573.mjs
      - name: Verify compiled production artifact
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_atlas_site.py --out _site-public-spend-route
          test -s _site-public-spend-route/assets/atlas-public-spend-mobile-route-0573.js
          test -s _site-public-spend-route/assets/atlas-public-spend-route-authority-0578.js
          test -s _site-public-spend-route/assets/atlas-public-spend-progressive-0577.css
          test ! -e _site-public-spend-route/v037-public-spend.js
          test ! -e _site-public-spend-route/v037-public-spend.css
          grep -q 'progressive route 0577' _site-public-spend-route/assets/atlas-public-spend-mobile-route-0573.js
          grep -q 'navigation authority 0579' _site-public-spend-route/assets/atlas-public-spend-route-authority-0578.js
          grep -q "const VERSION='0579.0'" _site-public-spend-route/assets/atlas-public-spend-route-authority-0578.js
          grep -q '__atlasPublicSpendAuthority0579' _site-public-spend-route/assets/atlas-public-spend-route-authority-0578.js
          grep -q 'scheduleRecovery' _site-public-spend-route/assets/atlas-public-spend-route-authority-0578.js
          grep -q "if(view===VIEW)return openFast('window.navigate')" _site-public-spend-route/assets/atlas-public-spend-route-authority-0578.js
          grep -q 'atlas-public-spend-mobile-route-0573.js?v=0577-1' _site-public-spend-route/index.html
          grep -q 'atlas-public-spend-route-authority-0578.js?v=0579-1' _site-public-spend-route/index.html
