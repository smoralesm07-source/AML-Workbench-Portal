name: Validate Public Spend Native V2

on:
  pull_request:
    paths:
      - 'assets/atlas-public-spend-v2.js'
      - 'assets/atlas-public-spend-v2.css'
      - 'assets/atlas-public-spend-route-authority-0578.js'
      - 'assets/atlas-mobile-nav.js'
      - 'index.html'
      - 'atlas-runtime-manifest.json'
      - 'tools/build_atlas_site.py'
      - 'tests/atlas-public-spend-mobile-route-0573.mjs'
      - '.github/workflows/validate-public-spend-mobile-route-0573.yml'
  push:
    branches: [main]
    paths:
      - 'assets/atlas-public-spend-v2.js'
      - 'assets/atlas-public-spend-v2.css'
      - 'assets/atlas-public-spend-route-authority-0578.js'
      - 'assets/atlas-mobile-nav.js'
      - 'index.html'
      - 'atlas-runtime-manifest.json'
      - 'tools/build_atlas_site.py'
      - 'tests/atlas-public-spend-mobile-route-0573.mjs'
      - '.github/workflows/validate-public-spend-mobile-route-0573.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check assets/atlas-public-spend-v2.js
          node --check assets/atlas-public-spend-route-authority-0578.js
      - name: Native GP2 contract
        run: node tests/atlas-public-spend-mobile-route-0573.mjs
      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_atlas_site.py --out _site-public-spend-route
          test -s _site-public-spend-route/assets/atlas-public-spend-v2.js
          test -s _site-public-spend-route/assets/atlas-public-spend-v2.css
          test -s _site-public-spend-route/assets/atlas-public-spend-route-authority-0578.js
          test ! -e _site-public-spend-route/v037-public-spend.js
          test ! -e _site-public-spend-route/v037-public-spend.css
          grep -q "VERSION='GP2.2'" _site-public-spend-route/assets/atlas-public-spend-v2.js
          grep -q 'PRESUPUESTO_SPEND_VIEW_V2' _site-public-spend-route/assets/atlas-public-spend-v2.js
          grep -q 'AtlasPublicSpendV2' _site-public-spend-route/assets/atlas-public-spend-v2.js
          ! grep -q '__AML_PUBLIC_SPEND__' _site-public-spend-route/assets/atlas-public-spend-v2.js
          grep -q "VERSION='GP2-AUTH.3'" _site-public-spend-route/assets/atlas-public-spend-route-authority-0578.js
          grep -q "HOST='.atlas-public-spend-v2-host'" _site-public-spend-route/assets/atlas-public-spend-route-authority-0578.js
          grep -q '__atlasGp2Authority' _site-public-spend-route/assets/atlas-public-spend-route-authority-0578.js
          grep -q 'atlas-public-spend-v2.css?v=gp2-2' _site-public-spend-route/index.html
          grep -q 'atlas-public-spend-v2.js?v=gp2-2' _site-public-spend-route/index.html
          grep -q 'atlas-public-spend-route-authority-0578.js?v=gp2-a3' _site-public-spend-route/index.html
          ! grep -q 'atlas-public-spend-mobile-route-0573.js' _site-public-spend-route/index.html
          ! grep -q 'atlas-public-spend-guided-0570.js' _site-public-spend-route/index.html
          ! grep -q 'atlas-public-spend-audit-0550.js' _site-public-spend-route/index.html
          ! grep -q 'v037-public-spend.js' _site-public-spend-route/index.html
