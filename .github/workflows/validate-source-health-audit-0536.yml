name: Validate Source Health Audit 0536

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/atlas-source-health-audit-0536.js'
      - 'assets/atlas-source-health-audit-0536.css'
      - 'tests/atlas-source-health-audit-0536.mjs'
      - 'index.html'
      - '.github/workflows/validate-source-health-audit-0536.yml'
  push:
    branches: [main]
    paths:
      - 'assets/atlas-source-health-audit-0536.js'
      - 'assets/atlas-source-health-audit-0536.css'
      - 'tests/atlas-source-health-audit-0536.mjs'
      - 'index.html'
      - '.github/workflows/validate-source-health-audit-0536.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/atlas-source-health-audit-0536.mjs
