name: Refresh AML Workbench Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: aml-workbench-pages-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6

      - name: Validate publishable build
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f build.json
          test -f v0342-runtime.js
          test -f v0342-runtime.css
          grep -q 'AML Analytical Workbench · v0.34.2' index.html
          grep -q 'data-aml-version="0.34.2"' index.html
          grep -q '"app_version": "0.34.2"' build.json
          grep -q 'v034-sanctions-v12-core.js?b=0342' index.html
          grep -q 'v0341-sanctions-hardening.js?b=0342' index.html
          grep -q 'v0342-runtime.js?b=0342' index.html
          ! grep -q 'v0321-runtime-bootstrap.js' index.html
          ! grep -q 'v0331-runtime-bootstrap.js' index.html
          ! grep -q 'v0334-runtime-bootstrap.js' index.html

      - name: Request GitHub Pages rebuild from latest main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10"
