name: Refresh AML Workbench Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write

concurrency:
  group: aml-workbench-pages-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6

      - name: Validate publishable build
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f build.json
          test -f v0342-runtime.js
          test -f v0342-runtime.css
          grep -q 'AML Analytical Workbench · v0.34.2' index.html
          grep -q 'data-aml-version="0.34.2"' index.html
          grep -q '"app_version": "0.34.2"' build.json
          grep -q 'v034-sanctions-v12-core.js?b=0342' index.html
          grep -q 'v0341-sanctions-hardening.js?b=0342' index.html
          grep -q 'v0342-runtime.js?b=0342' index.html
          ! grep -q 'v0321-runtime-bootstrap.js' index.html
          ! grep -q 'v0331-runtime-bootstrap.js' index.html
          ! grep -q 'v0334-runtime-bootstrap.js' index.html

      - name: Detect whether public Pages is stale
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "import json; print(json.load(open('build.json'))['app_version'])")
          BUILD=$(python -c "import json; print(json.load(open('build.json'))['build'])")
          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/?build=${BUILD}-${GITHUB_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$URL" | grep -Fq "AML Analytical Workbench · v${VERSION}"; then
            echo 'stale=false' >> "$GITHUB_OUTPUT"
            echo "Pages already serves v${VERSION}."
          else
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo "Pages is stale; expected v${VERSION}."
          fi

      - name: Request Pages rebuild with rate-limit backoff
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          accepted=0
          for attempt in $(seq 1 11); do
            echo "Pages rebuild request ${attempt}/11"
            if gh api --silent --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10"; then
              accepted=1
              echo 'Pages rebuild accepted.'
              break
            fi
            if [ "$attempt" -lt 11 ]; then
              echo 'Build request not accepted yet (possibly soft build limit). Retrying in 5 minutes.'
              sleep 300
            fi
          done
          if [ "$accepted" -ne 1 ]; then
            echo 'Pages did not accept a rebuild within the retry window.' >&2
            exit 1
          fi

      - name: Verify public version after rebuild
        if: steps.freshness.outputs.stale == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.freshness.outputs.version }}
          BUILD: ${{ steps.freshness.outputs.build }}
        run: |
          set -u
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          for attempt in $(seq 1 20); do
            probe="${base}?build=${BUILD}-${GITHUB_SHA}-${attempt}"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$probe" | grep -Fq "AML Analytical Workbench · v${VERSION}"; then
              echo "Public Pages verified at v${VERSION}."
              exit 0
            fi
            echo "Waiting for Pages/CDN propagation (${attempt}/20)…"
            sleep 30
          done
          echo "Pages rebuild was accepted but public propagation did not reach v${VERSION} within 10 minutes." >&2
          exit 1
