name: Force current AML Workbench Pages build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-refresh.yml'
      - 'index.html'
      - 'build.json'
      - 'v034-sanctions-v12-core.js'
      - 'v034-sanctions-v12-ui.js'
      - 'v034-sanctions-v12-charts.js'
      - 'v034-sanctions-v12.css'
      - 'v0341-sanctions-hardening.js'
      - 'v0342-runtime.js'
      - 'v0342-runtime.css'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: aml-workbench-pages-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6

      - name: Validate Sanciones v12 is the active route
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AML Analytical Workbench · v0.34.2' index.html
          grep -q 'v034-sanctions-v12-core.js?b=0342' index.html
          grep -q 'v034-sanctions-v12-ui.js?b=0342' index.html
          grep -q 'v034-sanctions-v12-charts.js?b=0342' index.html
          grep -q 'v0341-sanctions-hardening.js?b=0342' index.html
          grep -q 'loadSanctions=v034Load' v034-sanctions-v12-core.js
          grep -q 'Consulta directa de entidad' v034-sanctions-v12-ui.js
          grep -q 'Últimas sanciones · Top 5' v034-sanctions-v12-ui.js
          grep -q 'Concentración regional de sanciones' v034-sanctions-v12-ui.js

      - name: Request GitHub Pages build and record result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          status='accepted'
          response=''
          if ! response=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" 2>&1); then
            status='failed'
          fi
          python - <<PY
          import json, os
          payload={
            'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
            'workflow_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
            'commit': os.environ.get('GITHUB_SHA'),
            'status': '${status}',
            'response': '''${response}''',
          }
          open('.pages-runtime-status.json','w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pages-runtime-status.json
          git commit -m "ci: record Pages runtime status [skip ci]" || true
          git push origin HEAD:main
          test "$status" = 'accepted'
