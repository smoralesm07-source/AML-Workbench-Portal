name: Validate v0.20.6
on:
  push:
    branches: [main]
    paths:
      - 'v019-live.js'
      - 'v019.css'
      - 'v0191-tuning.js'
      - 'v0191-csp.js'
      - 'v0191.css'
      - 'v0192-ux.js'
      - 'v0192.css'
      - 'v0193-uaf.js'
      - 'v0193-core.js'
      - 'v0193-questions.js'
      - 'v0193.css'
      - 'v0193-territory.js'
      - 'v0193-territory.css'
      - 'v0194-home.js'
      - 'v0194-bridge.js'
      - 'v0194-home.css'
      - 'v020-radar.js'
      - 'v020.css'
      - 'v0201-insights.js'
      - 'v0201-fixes.js'
      - 'v0201-insights.css'
      - 'v0202-alerts.js'
      - 'v0202-alerts.css'
      - 'v0203-dashboard.js'
      - 'v0203-dashboard.css'
      - 'v0204-uaf-indicators.js'
      - 'v0204-uaf-indicators.css'
      - 'v0205-reconciliation.js'
      - 'v0205-reconciliation.css'
      - 'v0206-stability.js'
      - 'data/uaf_reportability_sector_2025.json'
      - 'data/uaf_dashboard_snapshot.json'
      - 'index.html'
      - '.github/workflows/validate-v019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check v019-live.js
          node --check v0191-tuning.js
          node --check v0191-csp.js
          node --check v0192-ux.js
          node --check v0193-uaf.js
          node --check v0193-core.js
          node --check v0193-questions.js
          node --check v0193-territory.js
          node --check v0194-home.js
          node --check v0194-bridge.js
          node --check v020-radar.js
          node --check v0201-insights.js
          node --check v0201-fixes.js
          node --check v0202-alerts.js
          node --check v0203-dashboard.js
          node --check v0204-uaf-indicators.js
          node --check v0205-reconciliation.js
          node --check v0206-stability.js
      - name: Validate local UAF JSON assets
        run: |
          python - <<'PY'
          import json
          for path in ['data/uaf_reportability_sector_2025.json','data/uaf_dashboard_snapshot.json']:
              with open(path, encoding='utf-8') as f:
                  json.load(f)
          with open('data/uaf_reportability_sector_2025.json', encoding='utf-8') as f:
              r=json.load(f)
          assert len(r.get('sectors', [])) == 48, len(r.get('sectors', []))
          assert r.get('totals', {}).get('registered_so_2025') == 9911
          assert r.get('totals', {}).get('ros_2025') == 21828
          PY
      - name: Ensure no inline event handlers
        run: |
          if grep -E 'onclick=|onchange=|onmouseover=' v019-live.js v0191-tuning.js v0191-csp.js v0192-ux.js v0193-uaf.js v0193-core.js v0193-questions.js v0193-territory.js v0194-home.js v0194-bridge.js v020-radar.js v0201-insights.js v0201-fixes.js v0202-alerts.js v0203-dashboard.js v0204-uaf-indicators.js v0205-reconciliation.js v0206-stability.js; then
            echo 'Inline event handler found; incompatible with CSP.'
            exit 1
          fi
      - name: Ensure CSP-safe active layers
        run: |
          grep -q 'v0191-csp.js' index.html
          grep -q 'v0192-ux.js' index.html
          grep -q 'v0193-uaf.js' index.html
          grep -q 'v0193-core.js' index.html
          grep -q 'v0193-questions.js' index.html
          grep -q 'v0193-territory.js' index.html
          grep -q 'v0194-home.js' index.html
          grep -q 'v0194-bridge.js' index.html
          grep -q 'v020-radar.js' index.html
          grep -q 'v020.css' index.html
          grep -q 'v0201-insights.js' index.html
          grep -q 'v0201-fixes.js' index.html
          grep -q 'v0201-insights.css' index.html
          grep -q 'v0202-alerts.js' index.html
          grep -q 'v0202-alerts.css' index.html
          grep -q 'v0203-dashboard.js' index.html
          grep -q 'v0203-dashboard.css' index.html
          grep -q 'v0204-uaf-indicators.js' index.html
          grep -q 'v0204-uaf-indicators.css' index.html
          grep -q 'v0205-reconciliation.js' index.html
          grep -q 'v0205-reconciliation.css' index.html
          grep -q 'v0206-stability.js' index.html
          grep -q 'uaf_reportability_sector_2025.json' v0206-stability.js
          if grep -E 'style=' v0191-csp.js v0192-ux.js v0193-uaf.js v0193-core.js v0193-questions.js v0193-territory.js v0194-home.js v0194-bridge.js v020-radar.js v0201-insights.js v0201-fixes.js v0202-alerts.js v0203-dashboard.js v0204-uaf-indicators.js v0205-reconciliation.js v0206-stability.js; then
            echo 'Inline style found in CSP-safe renderer.'
            exit 1
          fi
