name: Validate v0.31.2
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/validate-v019.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/validate-v019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for f in *.js; do node --check "$f"; done
      - name: Validate local UAF JSON assets
        run: |
          python - <<'PY'
          import json
          for path in ['data/uaf_reportability_sector_2025.json','data/uaf_dashboard_snapshot.json']:
              with open(path, encoding='utf-8') as f: json.load(f)
          with open('data/uaf_reportability_sector_2025.json', encoding='utf-8') as f: r=json.load(f)
          assert len(r.get('sectors', [])) == 48
          assert r.get('totals', {}).get('registered_so_2025') == 9911
          assert r.get('totals', {}).get('ros_2025') == 21828
          PY
      - name: Validate IPA3 and territorial scoring contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          global_js=Path('v028-ipa3-global.js').read_text(encoding='utf-8')
          sanc_js=Path('v028-sanctions-ipa3.js').read_text(encoding='utf-8')
          territory=Path('v029-territory-analytics.js').read_text(encoding='utf-8')
          model=Path('v027-model-consistency.js').read_text(encoding='utf-8')
          perf=Path('v0302-performance.js').read_text(encoding='utf-8')
          assert "const V028_SCORE_VIEW='aml_v_ipa3_entity_score_v0_4'" in global_js
          assert "version:'0.4-shadow'" in global_js
          assert 'window.AML_IPA3=' in global_js
          assert "V0302_IPA_SNAPSHOT='aml_ipa3_entity_score_snapshot_v0_4'" in perf
          assert "const V028_SANCTIONS_VIEW='aml_v028_sanctions_with_identity'" in sanc_js
          assert "V029_ANALYTICS_VERSION='TERRITORY-ANALYTICS-0.29.0'" in territory
          assert "V027_GEO_METHOD='GEO-RISK-B-0.27.0'" in model
          assert 'MISSING_IS_NOT_ZERO_STRICT' in model
          PY
      - name: Validate OSFL and fast runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('v030-osfl.js').read_text(encoding='utf-8')
          css=Path('v030-osfl.css').read_text(encoding='utf-8')
          fix=Path('v0301-osfl-consistency.js').read_text(encoding='utf-8')
          perf=Path('v0302-performance.js').read_text(encoding='utf-8')
          boot=Path('v0312-runtime-bootstrap.js').read_text(encoding='utf-8')

          assert 'AML Analytical Workbench · v0.31.2' in html
          assert set(re.findall(r'\?b=(\d+)',html))=={'0312'}
          assert 'v030-osfl.css?b=0312' in html
          assert 'v0302-performance.css?b=0312' in html
          assert 'v030-osfl.js?b=0312' in html
          assert 'v0301-osfl-consistency.js?b=0312' in html
          assert 'v0302-performance.js?b=0312' in html
          assert 'v0312-runtime-bootstrap.js?b=0312' in html
          assert 'v0302-runtime-bootstrap.js' not in html
          assert 'v0311-runtime-bootstrap.js' not in html
          assert html.rfind('v0312-runtime-bootstrap.js?b=0312') > html.rfind('v0312-territory-refinement.js?b=0312') > html.rfind('v031-territory-cockpit.js?b=0312') > html.rfind('v0302-performance.js?b=0312')
          assert "const V030_ENTITY_VIEW='aml_v029_osfl_entity'" in js
          assert 'V030_CHILE' in js and 'data-v030-map-region' in js
          assert '.v030-map-stage' in css and '.v030-region' in css
          assert 'R.8' in js and 'aporte IPA 0' in js
          assert 'OSFL sustantivas' in fix
          assert 'public_body_reclassified' in fix
          assert "V0302_OSFL_DASH='aml_osfl_dashboard_runtime_snapshot'" in perf
          assert "V0302_OVERVIEW='aml_overview_runtime_snapshot'" in perf
          assert "V0302_HEALTH_VIEW='aml_v0302_runtime_health'" in perf
          assert 'v0302RuntimeStatus' in perf
          assert "const V0312_RUNTIME='0.31.2'" in boot
          PY
      - name: Validate geographic risk clarity v0.31.2
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          base=Path('v031-territory-cockpit.js').read_text(encoding='utf-8')
          js=Path('v0312-territory-refinement.js').read_text(encoding='utf-8')
          css=Path('v0312-territory-refinement.css').read_text(encoding='utf-8')
          assert 'v0312-territory-refinement.css?b=0312' in html
          assert 'v0312-territory-refinement.js?b=0312' in html
          assert "V022_STATE.method='B'" in js
          assert "const V0312_INDICATOR='Índice de Prioridad Territorial'" in js
          assert "const V0312_INDICATOR_SHORT='IPT'" in js
          assert "V031_SCORE_FORMULA" in js and "scores?.B" in js
          assert 'v0312CeadPanel' in js
          assert 'Abrir CEAD oficial' in js and 'Ver dataset usado' in js
          assert 'cead_catalog_art27_v4.json' in js
          assert 'Qué delitos comprende esta familia' in js
          assert "v031CountChart(all,'phenomena')" in js
          assert "v031CountChart(all,'drivers')" not in js
          assert 'v031Matrix(all)' not in js
          assert 'v0312-tablewrap' in css and 'table-layout:fixed' in css
          assert 'overflow-x:hidden!important' in css
          assert 'window.AML_TERRITORY_CEAD=' in js
          assert 'Score B' not in js
          assert 'r.scores.B=' not in base and 'scores.B =' not in base
          PY
      - name: Ensure CSP-safe final runtime
        run: |
          if grep -E 'onclick=|onchange=|onmouseover=|style=' v0301-osfl-consistency.js v0302-performance.js v031-territory-cockpit.js v0312-territory-refinement.js v0312-runtime-bootstrap.js; then
            echo 'Inline handler/style found in final runtime.'
            exit 1
          fi
