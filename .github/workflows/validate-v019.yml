name: Validate v0.33.4
on:
  push:
    branches: [main]
    paths: ['*.js','*.css','index.html','docs/**','data/**','.github/workflows/validate-v019.yml']
  pull_request:
    paths: ['*.js','*.css','index.html','docs/**','data/**','.github/workflows/validate-v019.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for f in *.js; do node --check "$f"; done
      - name: Validate local UAF JSON assets
        run: |
          python - <<'PY'
          import json
          for path in ['data/uaf_reportability_sector_2025.json','data/uaf_dashboard_snapshot.json']:
              with open(path, encoding='utf-8') as f: json.load(f)
          with open('data/uaf_reportability_sector_2025.json', encoding='utf-8') as f: r=json.load(f)
          assert len(r.get('sectors', [])) == 48
          assert r.get('totals', {}).get('registered_so_2025') == 9911
          assert r.get('totals', {}).get('ros_2025') == 21828
          PY
      - name: Validate retained OSFL and IPA3 contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          global_js=Path('v028-ipa3-global.js').read_text(encoding='utf-8')
          model=Path('v027-model-consistency.js').read_text(encoding='utf-8')
          expert=Path('v032-osfl-expert.js').read_text(encoding='utf-8')
          polish=Path('v0321-osfl-polish.js').read_text(encoding='utf-8')
          css=Path('v032-osfl-expert.css').read_text(encoding='utf-8')
          responsive=Path('v0331-osfl-layout.css').read_text(encoding='utf-8')
          assert "version:'0.4-shadow'" in global_js and 'MISSING_IS_NOT_ZERO_STRICT' in model
          assert "V032_REGION_RUNTIME='aml_osfl_region_runtime_snapshot'" in expert
          assert "V032_ENTITY_RUNTIME='aml_osfl_entity_runtime_snapshot'" in expert
          assert 'También son SO UAF' in expert
          assert 'v032HydrateIpaTop' in expert and 'data-v032-ipa-open' in expert
          assert 'v032SalesHistory' in expert and 'PRESUPUESTO ABIERTO' in expert
          assert 'SIGNALIZED_TRANSACTIONS_ONLY' in expert and 'v030SyncMapAndCharts=function' in expert
          assert 'Universo OSFL analizado' in polish
          assert 'FULL_ON_360_OPEN' in polish and 'v032GetEntity=async function' in polish
          assert '.v032-drawer-head' in css and '.v032-budget-summary' in css
          assert 'container-type:inline-size' in responsive
          assert '@container osfl (max-width:1100px)' in responsive
          assert '.v030-explorer-controls{grid-template-columns:repeat(auto-fit' in responsive
          PY
      - name: Validate IRG and deterministic v0.33.4 runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          html=Path('index.html').read_text(encoding='utf-8')
          irg=Path('v032-irg-territory.js').read_text(encoding='utf-8')
          docs=Path('docs/geographic-risk-methodology-v3-irg.md').read_text(encoding='utf-8')
          auth=Path('v0333-auth-preflight.js').read_text(encoding='utf-8')
          boot=Path('v0334-runtime-bootstrap.js').read_text(encoding='utf-8')
          catalog=json.loads(Path('data/irg_sector_vulnerability_v1.json').read_text(encoding='utf-8'))

          assert 'AML Analytical Workbench · v0.33.4' in html
          assert set(re.findall(r'\?b=(\d+)',html))=={'0334'}
          assert '<script src="./v0333-auth-preflight.js?b=0334"></script>' in html
          assert html.index('v0333-auth-preflight.js?b=0334') < html.index('app.js?b=0334')
          assert '<script src="./v0331-runtime-bootstrap.js?b=0334"></script>' in html
          assert '<script type="module" src="./v0331-runtime-bootstrap.js' not in html
          assert html.rfind('v0334-runtime-bootstrap.js?b=0334') > html.rfind('v0332-radar-intelligence.js?b=0334')
          assert 'originalOnAuthStateChange' in auth and 'window.setTimeout' in auth
          assert 'clearPersistedSupabaseAuth' in auth
          assert "const V0334_RUNTIME='0.33.4'" in boot
          assert 'window.__AML_RUNTIME_VERSION_APPLIER__=v0334ApplyVersion' in boot

          assert catalog['schema']=='IRG_SECTOR_VULNERABILITY_V1'
          assert catalog['risk_method']=='SIMPLE_MEAN_OF_SIX_STRUCTURAL_DIMENSIONS'
          assert len(catalog['sectors'])==55
          assert "const V032_METHOD='IRG-LAFT-0.32.0'" in irg
          assert "const V032_WEIGHTS={vulnerability:0.45,density:0.20,gap:0.20,threat:0.15}" in irg
          assert 'CGR_BUDGET_IPA_PRESS_OSFL_DO_NOT_RECEIVE_INVENTED_IRG_WEIGHTS' in irg
          assert 'No se renormalizan los pesos' in docs
          PY
      - name: Ensure CSP-safe active runtime
        run: |
          if grep -E 'onclick=|onchange=|onmouseover=|style=' v032-osfl-expert.js v0321-osfl-polish.js v032-irg-territory.js v0333-auth-preflight.js v0334-runtime-bootstrap.js; then
            echo 'Inline handler/style found in active runtime.'
            exit 1
          fi
