name: Validate v0.20.1
on:
  push:
    branches: [main]
    paths:
      - 'v019-live.js'
      - 'v019.css'
      - 'v0191-tuning.js'
      - 'v0191-csp.js'
      - 'v0191.css'
      - 'v0192-ux.js'
      - 'v0192.css'
      - 'v0193-uaf.js'
      - 'v0193-core.js'
      - 'v0193-questions.js'
      - 'v0193.css'
      - 'v0193-territory.js'
      - 'v0193-territory.css'
      - 'v0194-home.js'
      - 'v0194-bridge.js'
      - 'v0194-home.css'
      - 'v020-radar.js'
      - 'v020.css'
      - 'v0201-insights.js'
      - 'v0201-insights.css'
      - 'index.html'
      - '.github/workflows/validate-v019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check v019-live.js
          node --check v0191-tuning.js
          node --check v0191-csp.js
          node --check v0192-ux.js
          node --check v0193-uaf.js
          node --check v0193-core.js
          node --check v0193-questions.js
          node --check v0193-territory.js
          node --check v0194-home.js
          node --check v0194-bridge.js
          node --check v020-radar.js
          node --check v0201-insights.js
      - name: Ensure no inline event handlers
        run: |
          if grep -E 'onclick=|onchange=|onmouseover=' v019-live.js v0191-tuning.js v0191-csp.js v0192-ux.js v0193-uaf.js v0193-core.js v0193-questions.js v0193-territory.js v0194-home.js v0194-bridge.js v020-radar.js v0201-insights.js; then
            echo 'Inline event handler found; incompatible with CSP.'
            exit 1
          fi
      - name: Ensure CSP-safe active layers
        run: |
          grep -q 'v0191-csp.js' index.html
          grep -q 'v0192-ux.js' index.html
          grep -q 'v0193-uaf.js' index.html
          grep -q 'v0193-core.js' index.html
          grep -q 'v0193-questions.js' index.html
          grep -q 'v0193-territory.js' index.html
          grep -q 'v0194-home.js' index.html
          grep -q 'v0194-bridge.js' index.html
          grep -q 'v020-radar.js' index.html
          grep -q 'v020.css' index.html
          grep -q 'v0201-insights.js' index.html
          grep -q 'v0201-insights.css' index.html
          if grep -E 'style=' v0191-csp.js v0192-ux.js v0193-uaf.js v0193-core.js v0193-questions.js v0193-territory.js v0194-home.js v0194-bridge.js v020-radar.js v0201-insights.js; then
            echo 'Inline style found in CSP-safe renderer.'
            exit 1
          fi
