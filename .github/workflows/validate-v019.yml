name: Validate v0.32.0
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/validate-v019.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/validate-v019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for f in *.js; do node --check "$f"; done
      - name: Validate local UAF JSON assets
        run: |
          python - <<'PY'
          import json
          for path in ['data/uaf_reportability_sector_2025.json','data/uaf_dashboard_snapshot.json']:
              with open(path, encoding='utf-8') as f: json.load(f)
          with open('data/uaf_reportability_sector_2025.json', encoding='utf-8') as f: r=json.load(f)
          assert len(r.get('sectors', [])) == 48
          assert r.get('totals', {}).get('registered_so_2025') == 9911
          assert r.get('totals', {}).get('ros_2025') == 21828
          PY
      - name: Validate retained IPA3 and fast-runtime contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          global_js=Path('v028-ipa3-global.js').read_text(encoding='utf-8')
          sanc_js=Path('v028-sanctions-ipa3.js').read_text(encoding='utf-8')
          perf=Path('v0302-performance.js').read_text(encoding='utf-8')
          assert "const V028_SCORE_VIEW='aml_v_ipa3_entity_score_v0_4'" in global_js
          assert "version:'0.4-shadow'" in global_js
          assert 'window.AML_IPA3=' in global_js
          assert "V0302_IPA_SNAPSHOT='aml_ipa3_entity_score_snapshot_v0_4'" in perf
          assert "const V028_SANCTIONS_VIEW='aml_v028_sanctions_with_identity'" in sanc_js
          assert "V0302_OSFL_DASH='aml_osfl_dashboard_runtime_snapshot'" in perf
          assert "V0302_OVERVIEW='aml_overview_runtime_snapshot'" in perf
          assert "V0302_HEALTH_VIEW='aml_v0302_runtime_health'" in perf
          PY
      - name: Validate IRG-LAFT v0.32.0 contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('v032-irg-territory.js').read_text(encoding='utf-8')
          css=Path('v032-irg-territory.css').read_text(encoding='utf-8')
          docs=Path('docs/geographic-risk-methodology-v3-irg.md').read_text(encoding='utf-8')
          catalog=json.loads(Path('data/irg_sector_vulnerability_v1.json').read_text(encoding='utf-8'))

          assert 'AML Analytical Workbench · v0.32.0' in html
          assert set(re.findall(r'\?b=(\d+)',html))=={'0320'}
          assert 'v032-irg-territory.css?b=0320' in html
          assert 'v032-irg-territory.js?b=0320' in html
          assert html.rfind('v032-irg-territory.js?b=0320') > html.rfind('v0312-runtime-bootstrap.js?b=0320')

          assert catalog['schema']=='IRG_SECTOR_VULNERABILITY_V1'
          assert catalog['risk_method']=='SIMPLE_MEAN_OF_SIX_STRUCTURAL_DIMENSIONS'
          sectors=catalog['sectors']
          assert len(sectors)==55
          assert {x['uaf_sector_id'] for x in sectors}==set(range(1,56))
          by={x['uaf_sector_id']:x for x in sectors}
          assert by[21]['risk_inherent_1_5']==4.83
          assert by[52]['risk_inherent_1_5']==4.33
          assert by[54]['risk_inherent_1_5']==4.33

          assert "const V032_METHOD='IRG-LAFT-0.32.0'" in js
          assert "const V032_UAF_VIEW='aml_v032_geo_uaf_territory'" in js
          assert "const V032_WEIGHTS={vulnerability:0.45,density:0.20,gap:0.20,threat:0.15}" in js
          assert "const V032_CONF_WEIGHTS={completeness:0.35,geo:0.30,mapping:0.20,freshness:0.15}" in js
          assert 'function v032StrictIRG' in js
          assert "m.mapping_status==='VALIDATED_RULE'" in Path('v022-territory-risk.js').read_text(encoding='utf-8')
          assert 'secondary_sources_direct_weight:0' in js
          assert 'CGR_BUDGET_IPA_PRESS_OSFL_DO_NOT_RECEIVE_INVENTED_IRG_WEIGHTS' in js
          assert '70% percentil de intensidad y 30% percentil de tendencia positiva' in js
          assert 'No se renormalizan los pesos' in docs
          assert 'UAF_UNLOCATED_RECORDS_ARE_NOT_IMPUTED' in docs
          assert 'table-layout:fixed' in css
          assert '.v032-comparator' in css
          assert 'overflow:hidden' in css
          PY
      - name: Ensure CSP-safe final runtime
        run: |
          if grep -E 'onclick=|onchange=|onmouseover=|style=' v0301-osfl-consistency.js v0302-performance.js v031-territory-cockpit.js v0312-territory-refinement.js v0312-runtime-bootstrap.js v032-irg-territory.js; then
            echo 'Inline handler/style found in final runtime.'
            exit 1
          fi
