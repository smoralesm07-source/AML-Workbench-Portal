name: Validate v0.30.1
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/validate-v019.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/validate-v019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for f in *.js; do node --check "$f"; done
      - name: Validate local UAF JSON assets
        run: |
          python - <<'PY'
          import json
          for path in ['data/uaf_reportability_sector_2025.json','data/uaf_dashboard_snapshot.json']:
              with open(path, encoding='utf-8') as f: json.load(f)
          with open('data/uaf_reportability_sector_2025.json', encoding='utf-8') as f: r=json.load(f)
          assert len(r.get('sectors', [])) == 48
          assert r.get('totals', {}).get('registered_so_2025') == 9911
          assert r.get('totals', {}).get('ros_2025') == 21828
          PY
      - name: Validate global IPA3 and territory contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          global_js=Path('v028-ipa3-global.js').read_text(encoding='utf-8')
          sanc_js=Path('v028-sanctions-ipa3.js').read_text(encoding='utf-8')
          territory=Path('v029-territory-analytics.js').read_text(encoding='utf-8')
          model=Path('v027-model-consistency.js').read_text(encoding='utf-8')
          assert "const V028_SCORE_VIEW='aml_v_ipa3_entity_score_v0_4'" in global_js
          assert "version:'0.4-shadow'" in global_js
          assert 'window.AML_IPA3=' in global_js
          assert "const V028_SANCTIONS_VIEW='aml_v028_sanctions_with_identity'" in sanc_js
          assert "V029_ANALYTICS_VERSION='TERRITORY-ANALYTICS-0.29.0'" in territory
          assert "V027_GEO_METHOD='GEO-RISK-B-0.27.0'" in model
          assert 'MISSING_IS_NOT_ZERO_STRICT' in model
          PY
      - name: Validate native OSFL module
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('v030-osfl.js').read_text(encoding='utf-8')
          css=Path('v030-osfl.css').read_text(encoding='utf-8')
          fix=Path('v0301-osfl-consistency.js').read_text(encoding='utf-8')
          boot=Path('v0301-runtime-bootstrap.js').read_text(encoding='utf-8')

          assert 'AML Analytical Workbench · v0.30.1' in html
          assert 'v030-osfl.css?b=0300' in html
          assert 'v030-osfl.js?b=0300' in html
          assert 'v0301-osfl-consistency.js?b=0301' in html
          assert 'v0301-runtime-bootstrap.js?b=0301' in html
          assert 'v030-runtime-bootstrap.js' not in html
          assert html.rfind('v0301-runtime-bootstrap.js?b=0301') > html.rfind('v0301-osfl-consistency.js?b=0301') > html.rfind('v030-osfl.js?b=0300')

          # Native data contract: no static enriched entity JSON.
          assert "const V030_ENTITY_VIEW='aml_v029_osfl_entity'" in js
          assert "const V030_REGION_VIEW='aml_v029_osfl_region'" in js
          assert "const V030_YEAR_VIEW='aml_v029_osfl_year'" in js
          assert 'v023-osfl-entities.json' not in js and 'fetch(' not in js.split('const V030_CHILE',1)[0]
          assert 'sb.from(V030_ENTITY_VIEW)' in js
          assert 'aml_v_ipa3_mark_scores_v0_4' in js
          assert 'aml_sii_entity_year' in js
          assert 'aml_v028_sanctions_with_identity' in js
          assert 'aml_uaf_entity_profile' in js
          assert 'data-v030-open-entity360' in js

          # Preserve/improve the supplied vector-map concept: 16 named regional geometries.
          for name in ['Arica y Parinacota','Tarapacá','Antofagasta','Atacama','Coquimbo','Valparaíso','Metropolitana',"O'Higgins",'Maule','Ñuble','Biobío','La Araucanía','Los Ríos','Los Lagos','Aysén','Magallanes']:
              assert name in js
          assert 'V030_CHILE' in js and 'data-v030-map-region' in js
          assert '.v030-map-stage' in css and '.v030-region' in css

          # Semantics/guardrails and source/canonical reconciliation.
          assert 'R.8' in js and 'aporte IPA 0' in js
          assert 'IPA 3.0 · SHADOW' in js
          assert 'OSFL sustantivas' in fix
          assert 'public_body_reclassified' in fix
          assert '100% del snapshot en Entity Hub' in fix
          assert "const V0301_RUNTIME='0.30.1'" in boot
          assert 'window.__AML_RUNTIME_VERSION_APPLIER__=v0301ApplyVersion' in boot
          PY
      - name: Ensure CSP-safe final OSFL runtime
        run: |
          if grep -E 'onclick=|onchange=|onmouseover=|style=' v0301-osfl-consistency.js v0301-runtime-bootstrap.js; then
            echo 'Inline handler/style found in final OSFL consistency runtime.'
            exit 1
          fi
