name: Validate v0.27.2
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/validate-v019.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/validate-v019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for f in *.js; do node --check "$f"; done
      - name: Validate local UAF JSON assets
        run: |
          python - <<'PY'
          import json
          for path in ['data/uaf_reportability_sector_2025.json','data/uaf_dashboard_snapshot.json']:
              with open(path, encoding='utf-8') as f: json.load(f)
          with open('data/uaf_reportability_sector_2025.json', encoding='utf-8') as f: r=json.load(f)
          assert len(r.get('sectors', [])) == 48
          assert r.get('totals', {}).get('registered_so_2025') == 9911
          assert r.get('totals', {}).get('ros_2025') == 21828
          PY
      - name: Validate v0.27.2 single visible version authority
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('v0272-runtime-version.css').read_text(encoding='utf-8')
          boot=Path('v0272-runtime-bootstrap.js').read_text(encoding='utf-8')
          legacy21=Path('v0211-bootstrap.css').read_text(encoding='utf-8')
          legacy19=Path('v0192-ux.js').read_text(encoding='utf-8')
          model=Path('v027-model-consistency.js').read_text(encoding='utf-8')
          source=Path('v027-source-null-hardening.js').read_text(encoding='utf-8')

          assert 'AML Analytical Workbench · v0.27.2' in html
          assert '?b=0271' not in html and '?b=0270' not in html
          assert 'v0272-runtime-version.css?b=0272' in html
          assert 'v0272-runtime-bootstrap.js?b=0272' in html
          assert html.rfind('v0272-runtime-bootstrap.js?b=0272') > html.rfind('v0271-runtime-bootstrap.js?b=0272')

          # The visible label must no longer depend on mutable textContent.
          assert 'content:attr(data-runtime-label)!important' in css
          assert "const V0272='0.27.2'" in boot
          assert "badge.setAttribute('data-runtime-label',label)" in boot
          assert 'window.__AML_ACTIVE_VERSION__=V0272' in boot
          assert 'window.__AML_RUNTIME_VERSION_APPLIER__=v0272ApplyVersion' in boot

          # Known historical writers may exist, but they cannot own the visible label.
          assert "content:'Operational Radar · v0.21.1'" not in legacy21
          assert 'setInterval(apply,1200)' in legacy19

          # Core model consistency contracts remain present.
          assert 'MISSING_IS_NOT_ZERO_STRICT' in model
          assert "V027_IPA_SCORE_VERSION='0.4-shadow'" in model
          assert "cross:8.5,ipa:15" in model and 'context:8.5' not in model
          assert 'a.positive_trend=a.yoy_pct===null?null' in source
          assert 'const s=v027Number(f.aml_score)' in source
          PY
      - name: Ensure CSP-safe final runtime
        run: |
          if grep -E 'onclick=|onchange=|onmouseover=|style=' v0271-runtime-bootstrap.js v0272-runtime-bootstrap.js; then
            echo 'Inline handler/style found in final runtime.'
            exit 1
          fi
