name: Validate v0.32.1
on:
  push:
    branches: [main]
    paths: ['*.js','*.css','index.html','docs/**','data/**','.github/workflows/validate-v019.yml']
  pull_request:
    paths: ['*.js','*.css','index.html','docs/**','data/**','.github/workflows/validate-v019.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for f in *.js; do node --check "$f"; done
      - name: Validate local UAF JSON assets
        run: |
          python - <<'PY'
          import json
          for path in ['data/uaf_reportability_sector_2025.json','data/uaf_dashboard_snapshot.json']:
              with open(path, encoding='utf-8') as f: json.load(f)
          with open('data/uaf_reportability_sector_2025.json', encoding='utf-8') as f: r=json.load(f)
          assert len(r.get('sectors', [])) == 48
          assert r.get('totals', {}).get('registered_so_2025') == 9911
          assert r.get('totals', {}).get('ros_2025') == 21828
          PY
      - name: Validate model and v0.32.1 OSFL contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          global_js=Path('v028-ipa3-global.js').read_text(encoding='utf-8')
          model=Path('v027-model-consistency.js').read_text(encoding='utf-8')
          expert=Path('v032-osfl-expert.js').read_text(encoding='utf-8')
          polish=Path('v0321-osfl-polish.js').read_text(encoding='utf-8')
          css=Path('v032-osfl-expert.css').read_text(encoding='utf-8')
          boot=Path('v0321-runtime-bootstrap.js').read_text(encoding='utf-8')
          assert 'AML Analytical Workbench · v0.32.1' in html
          assert set(re.findall(r'\?b=(\d+)',html))=={'0321'}
          assert 'v032-osfl-expert.js?b=0321' in html and 'v0321-osfl-polish.js?b=0321' in html
          assert 'v0321-runtime-bootstrap.js?b=0321' in html and 'v032-runtime-bootstrap.js' not in html
          assert html.rfind('v0321-runtime-bootstrap.js?b=0321') > html.rfind('v0321-osfl-polish.js?b=0321') > html.rfind('v032-osfl-expert.js?b=0321')
          assert "version:'0.4-shadow'" in global_js and 'MISSING_IS_NOT_ZERO_STRICT' in model
          assert "V032_REGION_RUNTIME='aml_osfl_region_runtime_snapshot'" in expert
          assert "V032_ENTITY_RUNTIME='aml_osfl_entity_runtime_snapshot'" in expert
          assert 'También son SO UAF' in expert
          assert 'v032HydrateIpaTop' in expert and 'data-v032-ipa-open' in expert
          assert 'v032SalesHistory' in expert and 'PRESUPUESTO ABIERTO' in expert
          assert 'SIGNALIZED_TRANSACTIONS_ONLY' in expert and 'v030SyncMapAndCharts=function' in expert
          assert 'Universo OSFL analizado' in polish
          assert 'FULL_ON_360_OPEN' in polish and 'v032GetEntity=async function' in polish
          assert '.v032-drawer-head' in css and '.v032-budget-summary' in css
          assert "const V0321_RUNTIME='0.32.1'" in boot
          PY
      - name: Validate territory remains intact
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('v0312-territory-refinement.js').read_text(encoding='utf-8')
          assert "V022_STATE.method='B'" in js
          assert "const V0312_INDICATOR='Índice de Prioridad Territorial'" in js
          assert 'Score B' not in js
          PY
      - name: Ensure CSP-safe final runtime
        run: |
          if grep -E 'onclick=|onchange=|onmouseover=|style=' v032-osfl-expert.js v0321-osfl-polish.js v0321-runtime-bootstrap.js; then
            echo 'Inline handler/style found in final runtime.'
            exit 1
          fi
