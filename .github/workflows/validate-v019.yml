name: Validate v0.32.0
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/validate-v019.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/validate-v019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for f in *.js; do node --check "$f"; done
      - name: Validate local UAF JSON assets
        run: |
          python - <<'PY'
          import json
          for path in ['data/uaf_reportability_sector_2025.json','data/uaf_dashboard_snapshot.json']:
              with open(path, encoding='utf-8') as f: json.load(f)
          with open('data/uaf_reportability_sector_2025.json', encoding='utf-8') as f: r=json.load(f)
          assert len(r.get('sectors', [])) == 48
          assert r.get('totals', {}).get('registered_so_2025') == 9911
          assert r.get('totals', {}).get('ros_2025') == 21828
          PY
      - name: Validate IPA3 and territorial scoring contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          global_js=Path('v028-ipa3-global.js').read_text(encoding='utf-8')
          sanc_js=Path('v028-sanctions-ipa3.js').read_text(encoding='utf-8')
          territory=Path('v029-territory-analytics.js').read_text(encoding='utf-8')
          model=Path('v027-model-consistency.js').read_text(encoding='utf-8')
          perf=Path('v0302-performance.js').read_text(encoding='utf-8')
          assert "const V028_SCORE_VIEW='aml_v_ipa3_entity_score_v0_4'" in global_js
          assert "version:'0.4-shadow'" in global_js
          assert 'window.AML_IPA3=' in global_js
          assert "V0302_IPA_SNAPSHOT='aml_ipa3_entity_score_snapshot_v0_4'" in perf
          assert "const V028_SANCTIONS_VIEW='aml_v028_sanctions_with_identity'" in sanc_js
          assert "V029_ANALYTICS_VERSION='TERRITORY-ANALYTICS-0.29.0'" in territory
          assert "V027_GEO_METHOD='GEO-RISK-B-0.27.0'" in model
          assert 'MISSING_IS_NOT_ZERO_STRICT' in model
          PY
      - name: Validate OSFL expert v0.32.0
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          base=Path('v030-osfl.js').read_text(encoding='utf-8')
          expert=Path('v032-osfl-expert.js').read_text(encoding='utf-8')
          css=Path('v032-osfl-expert.css').read_text(encoding='utf-8')
          boot=Path('v032-runtime-bootstrap.js').read_text(encoding='utf-8')
          assert 'AML Analytical Workbench · v0.32.0' in html
          assert set(re.findall(r'\?b=(\d+)',html))=={'0320'}
          assert 'v032-osfl-expert.css?b=0320' in html
          assert 'v032-osfl-expert.js?b=0320' in html
          assert 'v032-runtime-bootstrap.js?b=0320' in html
          assert 'v0312-runtime-bootstrap.js' not in html
          assert html.rfind('v032-runtime-bootstrap.js?b=0320') > html.rfind('v032-osfl-expert.js?b=0320') > html.rfind('v0312-territory-refinement.js?b=0320')
          assert 'V030_CHILE' in base and 'data-v030-map-region' in base
          assert "V032_REGION_RUNTIME='aml_osfl_region_runtime_snapshot'" in expert
          assert "V032_ENTITY_RUNTIME='aml_osfl_entity_runtime_snapshot'" in expert
          assert 'También son SO UAF' in expert
          assert 'OSFL sustantivas' not in expert and 'Perfiles enlazados' not in expert
          assert 'v032HydrateIpaTop' in expert and 'data-v032-ipa-open' in expert
          assert 'v032SalesHistory' in expert and 'sales_band_code' in expert
          assert 'PRESUPUESTO ABIERTO' in expert and 'SIGNALIZED_TRANSACTIONS_ONLY' in expert
          assert 'v030SyncMapAndCharts=function' in expert
          assert '.v032-drawer-head' in css and '.v032-sii-kpis' in css and '.v032-budget-summary' in css
          assert "const V032_RUNTIME='0.32.0'" in boot
          assert 'window.__AML_RUNTIME_VERSION_APPLIER__=v032ApplyVersion' in boot
          PY
      - name: Validate geographic risk clarity remains intact
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('v0312-territory-refinement.js').read_text(encoding='utf-8')
          css=Path('v0312-territory-refinement.css').read_text(encoding='utf-8')
          assert "V022_STATE.method='B'" in js
          assert "const V0312_INDICATOR='Índice de Prioridad Territorial'" in js
          assert 'v0312CeadPanel' in js
          assert 'Abrir CEAD oficial' in js and 'Ver dataset usado' in js
          assert 'v0312-tablewrap' in css and 'table-layout:fixed' in css
          assert 'Score B' not in js
          PY
      - name: Ensure CSP-safe final runtime
        run: |
          if grep -E 'onclick=|onchange=|onmouseover=|style=' v0301-osfl-consistency.js v0302-performance.js v031-territory-cockpit.js v0312-territory-refinement.js v032-osfl-expert.js v032-runtime-bootstrap.js; then
            echo 'Inline handler/style found in final runtime.'
            exit 1
          fi
