name: Validate v0.29.0
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/validate-v019.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/validate-v019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for f in *.js; do node --check "$f"; done
      - name: Validate local UAF JSON assets
        run: |
          python - <<'PY'
          import json
          for path in ['data/uaf_reportability_sector_2025.json','data/uaf_dashboard_snapshot.json']:
              with open(path, encoding='utf-8') as f: json.load(f)
          with open('data/uaf_reportability_sector_2025.json', encoding='utf-8') as f: r=json.load(f)
          assert len(r.get('sectors', [])) == 48
          assert r.get('totals', {}).get('registered_so_2025') == 9911
          assert r.get('totals', {}).get('ros_2025') == 21828
          PY
      - name: Validate v0.28.0 global IPA3 contract remains intact
        run: |
          python - <<'PY'
          from pathlib import Path
          global_js=Path('v028-ipa3-global.js').read_text(encoding='utf-8')
          sanc_js=Path('v028-sanctions-ipa3.js').read_text(encoding='utf-8')
          model=Path('v027-model-consistency.js').read_text(encoding='utf-8')
          assert "const V028_SCORE_VIEW='aml_v_ipa3_entity_score_v0_4'" in global_js
          assert "const V028_MARK_VIEW='aml_v_ipa3_mark_scores_v0_4'" in global_js
          assert "version:'0.4-shadow'" in global_js
          assert 'window.AML_IPA3=' in global_js
          assert "const V028_SANCTIONS_VIEW='aml_v028_sanctions_with_identity'" in sanc_js
          assert "V027_GEO_METHOD='GEO-RISK-B-0.27.0'" in model
          assert 'MISSING_IS_NOT_ZERO_STRICT' in model
          PY
      - name: Validate v0.29.0 territory analytics
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('v029-territory-analytics.js').read_text(encoding='utf-8')
          css=Path('v029-territory-analytics.css').read_text(encoding='utf-8')
          assert 'AML Analytical Workbench · v0.29.0' in html
          assert 'v029-territory-analytics.css?b=0290' in html
          assert 'v029-territory-analytics.js?b=0290' in html
          assert html.rfind('v029-territory-analytics.js?b=0290') > html.rfind('v028-sanctions-ipa3.js?b=0290')
          assert '?b=0280' not in html and '?b=0272' not in html
          assert "const V029='0.29.0'" in js
          assert "V029_ANALYTICS_VERSION='TERRITORY-ANALYTICS-0.29.0'" in js
          assert "V022_STATE.method='B'" in js
          assert 'Score B · Percentil robusto' in js
          assert 'V029_FILTERS={region:null,profiles:new Set(),phenomena:new Set(),drivers:new Set(),matrix:new Set()}' in js
          assert 'data-v029-filter' in js and 'data-v029-select' in js
          assert 'MULTISOURCE_CONVERGENCE' in js
          assert 'CEAD_ACCELERATION' in js
          assert 'IPA_SANCTIONS' in js
          assert 'RECENT_FORMATION' in js
          assert 'phenomena_codes' in js and 'analytical_priority' in js
          assert 'window.AML_TERRITORY_ANALYTICS=' in js
          assert 'r.scores.B=' not in js
          assert '.v029-filterbar' in css
          assert '.v029-chart-grid' in css
          assert '.v029-risk-table' in css
          assert '.v029-narrative' in css
          assert '.v029-filtered-out' in css
          PY
      - name: Ensure CSP-safe v0.29 runtime
        run: |
          if grep -E 'onclick=|onchange=|onmouseover=|style=' v029-territory-analytics.js; then
            echo 'Inline handler/style found in v0.29 runtime.'
            exit 1
          fi
          grep -q 'EXPLANATORY_PROFILE_IS_NOT_CAUSAL_INFERENCE' docs/territory-analytics-v029.md
          grep -q 'PHENOMENA_DO_NOT_CHANGE_SCORE_B' docs/territory-analytics-v029.md
