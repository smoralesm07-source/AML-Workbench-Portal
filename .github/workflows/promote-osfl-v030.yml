name: Promote OSFL assets v0.30
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-osfl-v030.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Namespace OSFL module as v0.30
        run: |
          python - <<'PY'
          from pathlib import Path

          js=Path('v029-osfl.js').read_text(encoding='utf-8')
          js=js.replace('v0.29.0','v0.30.0').replace("const V029='0.29.0';","const V030='0.30.0';").replace("const V029_BUILD='0290';","const V030_BUILD='0300';")
          js=js.replace('V029_','V030_').replace('V029','V030').replace('v029','v030')
          js=js.replace('aml_v030_','aml_v029_')
          js=js.replace('const CHILE = ','const V030_CHILE = ').replace('CHILE.order','V030_CHILE.order').replace('CHILE.paths','V030_CHILE.paths').replace('CHILE.viewBox','V030_CHILE.viewBox')
          Path('v030-osfl.js').write_text(js,encoding='utf-8')

          css=Path('v029-osfl.css').read_text(encoding='utf-8').replace('v0.29.0','v0.30.0').replace('v029','v030')
          Path('v030-osfl.css').write_text(css,encoding='utf-8')

          boot=Path('v029-runtime-bootstrap.js').read_text(encoding='utf-8').replace('v0.29.0','v0.30.0').replace("V029_RUNTIME='0.29.0'","V030_RUNTIME='0.30.0'").replace("V029_RUNTIME_BUILD='0290'","V030_RUNTIME_BUILD='0300'").replace('V029_RUNTIME','V030_RUNTIME').replace('v029','v030')
          Path('v030-runtime-bootstrap.js').write_text(boot,encoding='utf-8')

          for p in ['v029-osfl.js','v029-osfl.css','v029-runtime-bootstrap.js']:
              Path(p).unlink()
          PY
          node --check v030-osfl.js
          node --check v030-runtime-bootstrap.js
          ! grep -E 'onclick=|onchange=|onmouseover=|style=' v030-osfl.js
          grep -q "const V030='0.30.0'" v030-osfl.js
          grep -q "const V030_CHILE" v030-osfl.js
          ! grep -q "const V029=" v030-osfl.js
      - name: Commit generated v0.30 assets
        run: |
          git config user.name radar-bot
          git config user.email actions@users.noreply.github.com
          git add v030-osfl.js v030-osfl.css v030-runtime-bootstrap.js v029-osfl.js v029-osfl.css v029-runtime-bootstrap.js
          git commit -m 'feat: namespace OSFL module as v0.30.0'
          git push
