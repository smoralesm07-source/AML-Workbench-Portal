name: Validate Universo SO 0640

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis
        run: |
          node --check assets/atlas-universo-so-0640.js
          node --check assets/atlas-universo-so-0660.js
          node --check assets/atlas-public-spend-context-0571.js
      - name: Contrato 0640
        run: node tests/atlas-universo-so-0640.mjs
      - name: Regresión congelamiento 0670
        run: node tests/atlas-runtime-freeze-0670.mjs
      - name: Publicación
        run: |
          python tools/build_atlas_site.py --out _site
          test -s _site/assets/atlas-universo-so-0640.js
          test -s _site/assets/atlas-universo-so-0640.css
          test -s _site/assets/atlas-universo-so-0660.js
          test -s _site/assets/atlas-public-spend-context-0571.js
          grep -q 'atlas-universo-so-0640.js?v=0640-1' _site/index.html
          grep -q 'atlas-universo-so-0640.css?v=0640-1' _site/index.html
