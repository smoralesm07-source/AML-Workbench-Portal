name: Validate current Sanciones v12 route

on:
  pull_request:
    branches: [main]
    paths:
      - 'atlas-runtime-manifest.json'
      - 'atlas-sanctions-v12-approved-*.js'
      - 'atlas-sanctions-v12-route.js'
      - 'v019-live.js'
      - '.github/workflows/validate-sanctions-route-current.yml'
  push:
    branches: [main]
    paths:
      - 'atlas-runtime-manifest.json'
      - 'atlas-sanctions-v12-approved-*.js'
      - 'atlas-sanctions-v12-route.js'
      - 'v019-live.js'
      - '.github/workflows/validate-sanctions-route-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate direct route authority
        shell: bash
        run: |
          set -euo pipefail
          node --check atlas-sanctions-v12-route.js
          grep -q 'legacyFrozenRouteBypassed:true' atlas-sanctions-v12-route.js
          grep -q 'AML_SANCTIONS_V12_APPROVED' atlas-sanctions-v12-route.js
          python - <<'PY'
          import json
          m=json.load(open('atlas-runtime-manifest.json',encoding='utf-8'))
          s=[x['path'] for x in m['scripts']]
          approved=[f'atlas-sanctions-v12-approved-{i:02d}.js' for i in range(1,7)]
          assert all(x in s for x in approved),approved
          assert s.index('atlas-sanctions-v12-route.js')==s.index('atlas-current-ui.js')-1,s[-12:]
          assert s.index('atlas-sanctions-v12-approved-06.js')==s.index('atlas-sanctions-v12-route.js')-1,s[-12:]
          PY
      - name: Validate compiled route is last sanctions navigation authority
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_atlas_site.py --out _site-route-test
          for f in _site-route-test/atlas-runtime-current-*.js _site-route-test/atlas-module-current-*.js; do
            test -e "$f" || continue
            node --check "$f"
          done
          grep -R -q 'AML_SANCTIONS_V12_APPROVED.reload' _site-route-test/atlas-runtime-current-*.js
          grep -R -q 'legacyFrozenRouteBypassed:true' _site-route-test/atlas-runtime-current-*.js
          grep -R -q 'Consulta directa de entidad' _site-route-test/atlas-runtime-current-*.js
