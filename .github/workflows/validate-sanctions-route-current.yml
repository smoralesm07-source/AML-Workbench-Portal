name: Validate current Sanciones route

on:
  pull_request:
    branches: [main]
    paths:
      - 'atlas-runtime-manifest.json'
      - 'assets/atlas-sanctions-spectrum-0940.js'
      - 'atlas-sanctions-v12-approved-*.js'
      - 'atlas-sanctions-v12-route.js'
      - 'v019-live.js'
      - '.github/workflows/validate-sanctions-route-current.yml'
  push:
    branches: [main]
    paths:
      - 'atlas-runtime-manifest.json'
      - 'assets/atlas-sanctions-spectrum-0940.js'
      - 'atlas-sanctions-v12-approved-*.js'
      - 'atlas-sanctions-v12-route.js'
      - 'v019-live.js'
      - '.github/workflows/validate-sanctions-route-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate direct route authority
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/atlas-sanctions-spectrum-0940.js
          node --check atlas-sanctions-v12-route.js
          grep -q 'currentSpectrumPinned:true' atlas-sanctions-v12-route.js
          grep -q 'ATLAS_SANCTIONS_CURRENT.load' atlas-sanctions-v12-route.js
          grep -q 'AML_SANCTIONS_V12_APPROVED.reload' atlas-sanctions-v12-route.js
          python - <<'PY'
          import json
          m=json.load(open('atlas-runtime-manifest.json',encoding='utf-8'))
          s=[x['path'] for x in m['scripts']]
          current='assets/atlas-sanctions-spectrum-0940.js'
          route='atlas-sanctions-v12-route.js'
          fallback='atlas-sanctions-v12-approved-06.js'
          assert current in s
          assert s.index(fallback)<s.index(current)<s.index(route)<s.index('atlas-current-ui.js'),s[-16:]
          assert s.index(route)==s.index('atlas-current-ui.js')-1,s[-16:]
          PY
      - name: Validate compiled route is last sanctions navigation authority
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_atlas_site.py --out _site-route-test
          for f in _site-route-test/atlas-runtime-current-*.js _site-route-test/atlas-module-current-*.js; do
            test -e "$f" || continue
            node --check "$f"
          done
          grep -R -q 'ATLAS_SANCTIONS_CURRENT.load' _site-route-test/atlas-runtime-current-*.js
          grep -R -q 'currentSpectrumPinned:true' _site-route-test/atlas-runtime-current-*.js
          grep -R -q 'AML_SANCTIONS_V12_APPROVED.reload' _site-route-test/atlas-runtime-current-*.js
          grep -R -q 'SANCTIONS_SPECTRUM_CURRENT_0940' _site-route-test/atlas-runtime-current-*.js
