name: Fix Sanciones v12 route and publish

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[fix-sanctions-route] ATLAS 0.43.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Promote canonical release and route contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          release=json.load(open('atlas-release.json',encoding='utf-8'))
          build=json.load(open('build.json',encoding='utf-8'))
          manifest=json.load(open('atlas-runtime-manifest.json',encoding='utf-8'))

          release['release']='0.43.5'; release['build']='0435'
          build['app_version']='0.43.5'; build['build']='0435'
          manifest['release']='0.43.5'; manifest['build']='0435'

          route='atlas-sanctions-v12-route.js'
          scripts=manifest['scripts']
          scripts=[x for x in scripts if x.get('path')!=route]
          idx=next(i for i,x in enumerate(scripts) if x.get('path')=='atlas-current-ui.js')
          scripts.insert(idx,{'path':route,'type':'classic','role':'sanctions-v12-route-authority'})
          manifest['scripts']=scripts

          build['feature']=str(build.get('feature',''))+'+SANCTIONS_V12_DIRECT_ROUTE_0435'
          build['sanctions_navigation_contract']='DIRECT_APPROVED_V12_ROUTE+BYPASS_FROZEN_V019_LEGACY_REFERENCE'
          build['sanctions_runtime_authority']='atlas-sanctions-v12-approved-01..06.js+atlas-sanctions-v12-route.js'
          release['ui_authority_policy']='ATLAS_CURRENT_UI+ANALYTICS_VISUAL_AUTHORITY+SANCTIONS_V12_DIRECT_ROUTE'

          Path('atlas-release.json').write_text(json.dumps(release,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('build.json').write_text(json.dumps(build,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('atlas-runtime-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate route and compile exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check atlas-sanctions-v12-route.js
          python tools/build_atlas_site.py --out _site-route
          for f in _site-route/atlas-runtime-current-*.js _site-route/atlas-module-current-*.js; do
            test -e "$f" || continue
            node --check "$f"
          done
          grep -R -q 'AML_SANCTIONS_V12_APPROVED' _site-route/atlas-runtime-current-*.js
          grep -R -q 'legacyFrozenRouteBypassed:true' _site-route/atlas-runtime-current-*.js
          grep -R -q 'target:\x27AML_SANCTIONS_V12_APPROVED.reload\x27' _site-route/atlas-runtime-current-*.js || grep -R -q "target:'AML_SANCTIONS_V12_APPROVED.reload'" _site-route/atlas-runtime-current-*.js
          grep -R -q 'Consulta directa de entidad' _site-route/atlas-runtime-current-*.js
          python - <<'PY'
          import json
          m=json.load(open('atlas-runtime-manifest.json'))
          s=[x['path'] for x in m['scripts']]
          assert s.index('atlas-sanctions-v12-route.js')==s.index('atlas-current-ui.js')-1,s[-12:]
          assert all(f'atlas-sanctions-v12-approved-{i:02d}.js' in s for i in range(1,7))
          print('route contract OK')
          PY

      - name: Commit repaired canonical release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-release.json build.json atlas-runtime-manifest.json
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
          else
            git commit -m 'fix: route Sanciones directly to approved v12 in ATLAS 0.43.5'
            git push origin HEAD:main
          fi

      - name: Dispatch canonical Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pages.yml --ref main
          sleep 8
          RUN_ID=$(gh run list --workflow pages.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "PAGES_RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          gh run watch "$RUN_ID" --exit-status

      - name: Verify public compiled route authority
        shell: bash
        run: |
          set -euo pipefail
          URL='https://smoralesm07-source.github.io/AML-Workbench-Portal/'
          stamp=$(date +%s)
          curl -fsSL --retry 10 --retry-delay 3 "${URL}atlas-release.json?_atlas=${stamp}" -o /tmp/release.json
          curl -fsSL --retry 10 --retry-delay 3 "${URL}atlas-runtime-report.json?_atlas=${stamp}" -o /tmp/runtime.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/release.json')); rt=json.load(open('/tmp/runtime.json'))
          assert r['release']=='0.43.5' and r['build']=='0435',r
          assert rt['release']=='0.43.5' and rt['build']=='0435',rt
          print(rt['published_js'])
          PY
          for js in $(python - <<'PY'
          import json
          print(' '.join(json.load(open('/tmp/runtime.json'))['published_js']))
          PY
          ); do curl -fsSL --retry 5 "${URL}${js}?_atlas=${stamp}" -o "/tmp/${js}"; done
          grep -R -q 'legacyFrozenRouteBypassed:true' /tmp/atlas-runtime-current-*.js
          grep -R -q 'AML_SANCTIONS_V12_APPROVED.reload' /tmp/atlas-runtime-current-*.js
          grep -R -q 'Consulta directa de entidad' /tmp/atlas-runtime-current-*.js

      - name: Report repair status
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          conclusion='success'
          if [ '${{ job.status }}' != 'success' ]; then conclusion='failure'; fi
          gh issue comment '${{ github.event.issue.number }}' --body "## Sanciones v12 route repair\n\n- Release: \`0.43.5 / 0435\`\n- Repair job: \`${conclusion}\`\n- pages.yml run: \`${PAGES_RUN_ID:-not-started}\`\n- Route target: \`AML_SANCTIONS_V12_APPROVED.reload()\`\n- Frozen v019 legacy Sanciones route: \`bypassed\`\n- Public bundle marker check: completed when repair job is success."
