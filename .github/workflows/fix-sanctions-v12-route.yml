name: Audit retired Sanciones v12 repair

on:
  workflow_dispatch:

# Historical repair workflow retained only as a guardrail.
# It must never rewrite release metadata, push main or deploy GitHub Pages.
permissions:
  contents: read

jobs:
  audit-retired-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Assert current release cannot regress to 0.43.5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('atlas-release.json').read_text(encoding='utf-8'))
          build=json.loads(Path('build.json').read_text(encoding='utf-8'))
          runtime=json.loads(Path('atlas-runtime-manifest.json').read_text(encoding='utf-8'))
          assert release['release']==build['app_version']==runtime['release']
          assert str(release['build'])==str(build['build'])==str(runtime['build'])
          assert release['release']!='0.43.5', 'obsolete Sanciones repair release detected'
          assert release['deployment_policy']=='SINGLE_ACTIVE_RELEASE'
          assert release['runtime_policy']=='CANONICAL_COMPILED_RUNTIME_ONLY'
          assert release['pages_artifact_policy']=='COMPILED_CURRENT_BUNDLES_ONLY'
          assert Path('.github/workflows/deploy-atlas-pages-current.yml').is_file()
          print(f"retired repair safely isolated; current ATLAS={release['release']}/{release['build']}")
          PY

      - name: Validate current Sanciones authority without mutation
        shell: bash
        run: |
          set -euo pipefail
          node --check atlas-sanctions-v12-route.js
          node --check assets/atlas-sanctions-radiography-0960.js
          grep -q 'legacyFrozenRouteBypassed:true' atlas-sanctions-v12-route.js
          grep -q 'SANCTIONS_RADIOGRAPHY_CURRENT_0961' assets/atlas-sanctions-radiography-0960.js

      - name: Assert canonical Pages is the sole deployment path
        shell: bash
        run: |
          set -euo pipefail
          current='.github/workflows/fix-sanctions-v12-route.yml'
          ! grep -q 'git push origin HEAD:main' "$current"
          ! grep -q 'actions/deploy-pages' "$current"
          ! grep -q 'actions/upload-pages-artifact' "$current"
          ! grep -q 'pages: write' "$current"
          echo 'Obsolete repair cannot mutate main or production Pages.'
