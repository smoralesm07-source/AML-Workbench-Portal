name: Validate RES Reconciliation 0555

on:
  pull_request:
    paths:
      - 'assets/atlas-res-reconciliation-0555.js'
      - 'assets/atlas-res-reconciliation-0555.css'
      - 'assets/atlas-entity-res-bootstrap-0553.js'
      - 'assets/atlas-entity-uaf-highlight-0548.js'
      - '.github/workflows/validate-res-reconciliation-0555.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/atlas-res-reconciliation-0555.js
          node --check assets/atlas-entity-res-bootstrap-0553.js
          node --check assets/atlas-entity-uaf-highlight-0548.js
      - name: Reconciliation governance contract
        run: |
          python - <<'PY'
          from pathlib import Path
          recon=Path('assets/atlas-res-reconciliation-0555.js').read_text()
          bootstrap=Path('assets/atlas-entity-res-bootstrap-0553.js').read_text()
          hook=Path('assets/atlas-entity-uaf-highlight-0548.js').read_text()
          assert '__ATLAS_ENTITY_RES__' in recon
          assert 'data-v0434-entity' in recon
          assert "identityPolicy:'ENTITY_ID_CANONICO_ONLY'" in recon
          assert 'nameMatching:false' in recon
          assert 'scoreMutation:false' in recon
          assert 'res_constitution_date' in recon
          assert 'res_capital' in recon
          assert 'atlas-res-reconciliation-0555.js' in bootstrap
          assert "'conciliacion-uaf-sii'" in bootstrap
          assert '?v=0555-1' in hook
          assert 'similarity(' not in recon.lower()
          print('RES reconciliation governance contract OK')
          PY
