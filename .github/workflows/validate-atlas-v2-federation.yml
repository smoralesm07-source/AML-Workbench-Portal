name: Validate ATLAS v2 Federation

on:
  pull_request:
    branches: [main]
    paths: &atlas_v2_federation_paths
      - 'atlas-v2-release.json'
      - 'atlas-v2.html'
      - 'atlas-release.json'
      - 'src/v2/**'
      - 'tools/build_atlas_v2_primary.py'
      - 'tools/e2e_atlas_runtime_smoke.mjs'
      - 'tools/e2e_atlas_v2_ux_preflight.mjs'
      - 'tools/serve_atlas_v2_e2e.mjs'
      - 'tools/test_atlas_v2_data_client.js'
      - 'tools/test_atlas_v2_session.js'
      - 'supabase/functions/atlas-v2-read/**'
      - 'supabase/functions/atlas-v2-session-exchange/**'
      - 'supabase/core-functions/atlas-v2-e2e-auth/**'
      - 'supabase/migrations/*atlas_v2*'
      - 'supabase/core-migrations/*atlas_v2*'
      - '.github/workflows/e2e-atlas-runtime-smoke.yml'
      - '.github/workflows/validate-atlas-v2-federation.yml'
  push:
    branches: [main]
    paths: *atlas_v2_federation_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  federation-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate current v2 source boundaries
        run: |
          set -euo pipefail
          for f in \
            src/v2/atlas-v2-production-config.js src/v2/atlas-v2-health.js src/v2/atlas-v2-core-auth.js \
            src/v2/atlas-v2-data.js src/v2/atlas-v2-session.js src/v2/atlas-v2-access.js \
            src/v2/atlas-v2-shell.js src/v2/atlas-v2-boot.js src/v2/atlas-v2-viz.js \
            src/v2/entity-search-adapter.js src/v2/explore-surface.js src/v2/entity360-adapter.js \
            src/v2/entity360-surface.js src/v2/public-spend-surface.js src/v2/relations-surface.js \
            src/v2/universes-adapter.js src/v2/universes-surface.js src/v2/territory-adapter.js \
            src/v2/territory-surface.js src/v2/watch-adapter.js src/v2/watch-surface.js \
            tools/e2e_atlas_runtime_smoke.mjs tools/e2e_atlas_v2_ux_preflight.mjs \
            tools/serve_atlas_v2_e2e.mjs tools/test_atlas_v2_data_client.js tools/test_atlas_v2_session.js; do node --check "$f"; done
          python3 -m py_compile tools/build_atlas_v2_primary.py
          git diff --check

      - name: Run governed data and federation unit smokes
        run: |
          node tools/test_atlas_v2_data_client.js
          node tools/test_atlas_v2_session.js

      - name: Validate release, auth, search and federation invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('atlas-v2-release.json').read_text())
          l=json.loads(Path('atlas-release.json').read_text())
          html=Path('atlas-v2.html').read_text()
          session=Path('src/v2/atlas-v2-session.js').read_text()
          access=Path('src/v2/atlas-v2-access.js').read_text()
          boot=Path('src/v2/atlas-v2-boot.js').read_text()
          search=Path('src/v2/entity-search-adapter.js').read_text()
          entity=Path('src/v2/entity360-adapter.js').read_text()
          edge=Path('supabase/functions/atlas-v2-read/index.ts').read_text()
          exchange=Path('supabase/functions/atlas-v2-session-exchange/index.ts').read_text()
          broker=Path('supabase/core-functions/atlas-v2-e2e-auth/index.ts').read_text()
          sql=Path('supabase/core-migrations/20260907111841_atlas_v2_entity_search_allowlist_hardening.sql').read_text()
          e2e=Path('.github/workflows/e2e-atlas-runtime-smoke.yml').read_text()

          assert p['release']=='2.0.2' and str(p['build'])=='2002'
          assert p['product_contract']=='ANALYTICS_FIRST' and p['followup_policy']=='OPTIONAL_NOT_WORKFLOW'
          assert p['visual_navigation']=='INTERACTIVE_FIRST' and p['entity_search']=='RUT_NAME_UAF_PRESS'
          assert str(p['legacy_fallback']['release'])==str(l['release']) and str(p['legacy_fallback']['build'])==str(l['build'])
          assert p['legacy_fallback']['authority_active_on_primary'] is False
          assert 'v2-primary-4' in html and 'atlas-runtime-current-' not in html
          assert 'ATLAS_V2_SESSION_EXCHANGE_V1' in session and 'refreshToken' not in session
          assert 'AtlasV2Access' in access and 'global.AtlasV2Data.create' in access and 'getAccessToken' in access
          assert "STRUCTURAL_VERSION = 'v2-primary-4'" in boot and 'entity-search-adapter.js' in boot and 'atlas-v2-viz.js' in boot
          assert 'ATLAS_ENTITY_SEARCH_V2' in search and "operation: 'entity_search'" in search
          assert 'normalizeReference' in entity and 'entityId' in entity
          assert 'atlas_v2_entity_search' in edge and 'search_entities' in edge
          assert 'aml_allowed_users' in sql and 'auth.uid()' in sql and 'ATLAS_CORE_FORBIDDEN' in sql
          assert 'security invoker' in sql.lower()
          assert 'ATLAS_V2_SESSION_EXCHANGE_V1' in exchange and 'aml_allowed_users' in exchange
          assert 'SUPABASE_SECRET_KEYS' in exchange and 'SUPABASE_SERVICE_ROLE_KEY' not in exchange
          assert 'const MAIN_REF = "refs/heads/main"' in broker
          assert '.github/workflows/e2e-atlas-runtime-smoke.yml@${MAIN_REF}' in broker
          assert 'pull_request' not in broker and 'refs/pull/231/merge' not in broker
          assert 'pull_request:' not in e2e and 'id-token: write' in e2e and 'audience=atlas-v2-e2e' in e2e
          assert 'entity search security/gateway contract' in e2e
          print('ATLAS 2.0.2 federation/search invariants: OK')
          PY

      - name: Build and verify dual release identities
        run: |
          set -euo pipefail
          python3 tools/build_atlas_v2_primary.py --out _site-federation
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('_site-federation')
          p=json.loads((root/'atlas-v2-release.json').read_text())
          l=json.loads((root/'atlas-release.json').read_text())
          r=json.loads((root/'atlas-runtime-report.json').read_text())
          html=(root/'index.html').read_text()
          legacy=(root/'legacy.html').read_text()
          assert r['release']=='2.0.2' and r['build']=='2002'
          assert r['v2_visual_navigation']=='INTERACTIVE_FIRST'
          assert r['v2_entity_search']=='RUT_NAME_UAF_PRESS'
          assert r['v2_version']=='v2-primary-4'
          assert 'v2-primary-4' in html
          assert 'atlas-runtime-current-' not in html and 'atlas-runtime-current-' in legacy
          assert f'data-aml-version="{p["release"]}"' in html
          assert f'data-aml-version="{l["release"]}"' in legacy
          print('ATLAS 2.0.2 fresh-asset primary + frozen rollback build: OK')
          PY