name: Validate Digital Identity 0524

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and contract
        run: |
          node --check assets/atlas-entity-search-alias-0522.js
          node --check assets/atlas-entity-sherlock-0521.js
          node tests/atlas-digital-identity-0524.mjs
