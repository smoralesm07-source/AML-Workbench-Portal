name: Validate ATLAS Architecture v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'atlas-v2-release.json'
      - 'docs/ARCHITECTURE_V2.md'
      - 'docs/ATLAS_V2_ANALYTICS_FIRST.md'
      - 'src/v2/**'
      - 'tools/build_atlas_v2_primary.py'
      - 'tools/e2e_atlas_runtime_smoke.mjs'
      - 'tools/e2e_atlas_v2_ux_preflight.mjs'
      - 'supabase/functions/atlas-v2-read/**'
      - 'supabase/functions/atlas-v2-source-ingest/**'
      - 'supabase/functions/atlas-v2-session-exchange/**'
      - 'supabase/core-functions/atlas-v2-e2e-auth/**'
      - 'supabase/migrations/*atlas_architecture_v2*'
      - 'supabase/migrations/*atlas_v2*'
      - 'supabase/core-migrations/*atlas_v2*'
      - '.github/workflows/validate-atlas-architecture-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and current runtime boundaries
        run: |
          set -euo pipefail
          for f in \
            src/v2/atlas-v2-production-config.js src/v2/atlas-v2-health.js src/v2/atlas-v2-core-auth.js \
            src/v2/atlas-v2-data.js src/v2/atlas-v2-session.js src/v2/atlas-v2-access.js \
            src/v2/atlas-v2-shell.js src/v2/atlas-v2-boot.js src/v2/atlas-v2-viz.js \
            src/v2/entity-search-adapter.js src/v2/explore-surface.js src/v2/entity360-adapter.js \
            src/v2/entity360-surface.js src/v2/public-spend-surface.js src/v2/relations-surface.js \
            src/v2/universes-adapter.js src/v2/universes-surface.js src/v2/territory-adapter.js \
            src/v2/territory-surface.js src/v2/watch-adapter.js src/v2/watch-surface.js \
            tools/e2e_atlas_runtime_smoke.mjs tools/e2e_atlas_v2_ux_preflight.mjs; do node --check "$f"; done
          python3 -m py_compile tools/build_atlas_v2_primary.py
          git diff --check

      - name: Architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('atlas-v2-release.json').read_text())
          l=json.loads(Path('atlas-release.json').read_text())
          doc=Path('docs/ARCHITECTURE_V2.md').read_text()
          product=Path('docs/ATLAS_V2_ANALYTICS_FIRST.md').read_text()
          shell=Path('src/v2/atlas-v2-shell.js').read_text()
          boot=Path('src/v2/atlas-v2-boot.js').read_text()
          explore=Path('src/v2/explore-surface.js').read_text()
          entity=Path('src/v2/entity360-surface.js').read_text()
          viz=Path('src/v2/atlas-v2-viz.js').read_text()
          search=Path('src/v2/entity-search-adapter.js').read_text()
          read_edge=Path('supabase/functions/atlas-v2-read/index.ts').read_text()
          exchange=Path('supabase/functions/atlas-v2-session-exchange/index.ts').read_text()
          broker=Path('supabase/core-functions/atlas-v2-e2e-auth/index.ts').read_text()
          search_sql=Path('supabase/core-migrations/20260907111841_atlas_v2_entity_search_allowlist_hardening.sql').read_text()
          mdir=Path('supabase/migrations')

          assert p['release']=='2.0.2' and str(p['build'])=='2002'
          assert p['runtime']=='ATLAS_V2_ANALYTICS'
          assert p['visual_navigation']=='INTERACTIVE_FIRST'
          assert p['entity_search']=='RUT_NAME_UAF_PRESS'
          assert str(p['legacy_fallback']['release'])==str(l['release'])
          assert str(p['legacy_fallback']['build'])==str(l['build'])
          assert p['legacy_fallback']['authority_active_on_primary'] is False
          assert 'SOURCE -> LANDING -> NORMALIZE -> FUSION -> ANALYTICS -> READ MODEL -> READ API -> ATLAS -> DRILL-DOWN' in doc
          assert 'Exploration is free; follow-up is optional.' in product
          for forbidden in ["id: 'casos'","id: 'tareas'","id: 'cola'","id: 'asignaciones'","id: 'sla'"]:
              assert forbidden not in shell
          assert "STRUCTURAL_VERSION = 'v2-primary-4'" in boot
          assert 'atlas-v2-viz.js' in boot and 'entity-search-adapter.js' in boot
          assert 'AtlasV2Viz.horizontalBars' in explore and 'AtlasV2Viz.segmented' in explore
          assert 'AtlasV2EntitySearch.search' in entity and 'lineChart' in entity
          assert all(x in viz for x in ['horizontalBars','lineChart','segmented'])
          assert 'ATLAS_ENTITY_SEARCH_V2' in search and "operation: 'entity_search'" in search
          assert 'atlas_v2_entity_search' in read_edge and 'entity_search' in read_edge
          assert 'x-atlas-trace-id' in read_edge and 'server-timing' in read_edge
          assert 'SUPABASE_SERVICE_ROLE_KEY' not in read_edge
          assert 'aml_allowed_users' in search_sql and 'auth.uid()' in search_sql
          assert 'security definer' in search_sql.lower() and 'security invoker' in search_sql.lower()
          assert 'SUPABASE_SECRET_KEYS' in exchange and 'SUPABASE_SERVICE_ROLE_KEY' not in exchange
          assert 'const MAIN_REF = "refs/heads/main"' in broker

          required_migrations=[
            '20260905010825_atlas_architecture_v2_foundation.sql',
            '20260905011305_atlas_architecture_v2_job_automation.sql',
            '20260905011448_atlas_architecture_v2_hardening.sql',
            '20260905011656_atlas_architecture_v2_model_head_fk_index.sql',
            '20260905013212_atlas_architecture_v2_public_spend_source_bridge.sql',
            '20260905013223_atlas_architecture_v2_source_ingest_rpc.sql',
            '20260905013449_atlas_architecture_v2_public_spend_drilldown.sql',
            '20260905013657_atlas_architecture_v2_public_spend_search_indexes.sql',
            '20260905015600_atlas_architecture_v2_budget_detail_backend.sql',
            '20260905020045_atlas_architecture_v2_queue_privilege_boundary.sql',
            '20260905021121_atlas_architecture_v2_budget_context.sql',
            '20260905023655_atlas_architecture_v2_budget_contextual_drilldown.sql',
            '20260905024011_atlas_architecture_v2_budget_flow_contextual_search.sql',
            '20260905030623_atlas_v2_federated_session_grants.sql',
          ]
          assert not [x for x in required_migrations if not (mdir/x).is_file()]
          obsolete=['src/v2/public-spend-shadow.js','src/v2/public-spend-adapter.js','src/v2/public-spend-route-bridge.js','tools/build_atlas_v2_cutover.py']
          assert not [x for x in obsolete if Path(x).exists()]
          print('ATLAS Architecture v2.0.2 invariants: OK')
          PY

      - name: Build production primary and frozen fallback
        run: |
          set -euo pipefail
          python3 tools/build_atlas_v2_primary.py --out _architecture_v2
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('_architecture_v2')
          p=json.loads((root/'atlas-v2-release.json').read_text())
          l=json.loads((root/'atlas-release.json').read_text())
          r=json.loads((root/'atlas-runtime-report.json').read_text())
          html=(root/'index.html').read_text()
          legacy=(root/'legacy.html').read_text()
          assert r['release']=='2.0.2' and r['build']=='2002'
          assert r['v2_explore_mode']=='LIVE_PULSE_VISUAL'
          assert r['v2_visual_navigation']=='INTERACTIVE_FIRST'
          assert r['v2_entity_search']=='RUT_NAME_UAF_PRESS'
          assert r['v2_version']=='v2-primary-4'
          assert 'v2-primary-4' in html
          assert 'atlas-runtime-current-' not in html and 'atlas-runtime-current-' in legacy
          assert r['legacy_authority_active_on_primary'] is False
          assert f'data-aml-version="{l["release"]}"' in legacy
          print('ATLAS Architecture v2.0.2 fresh-asset dual-release build: OK')
          PY