name: Deploy approved Sanciones v12

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: atlas-sanctions-v12-approved
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[deploy-sanctions-v12] ATLAS 0.43.4'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote approved v12 into canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          release=Path('atlas-release.json')
          r=json.loads(release.read_text(encoding='utf-8'))
          r['release']='0.43.4'; r['build']='0434'
          release.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          build=Path('build.json')
          b=json.loads(build.read_text(encoding='utf-8'))
          b['app_version']='0.43.4'; b['build']='0434'
          feature=str(b.get('feature','')).replace('SANCTIONS_V12_APPROVED_UI_CURRENT','').replace('SANCTIONS_V12','')
          feature='+'.join(x for x in feature.split('+') if x)
          b['feature']=feature+'+SANCTIONS_V12_APPROVED_UI_CURRENT'
          b['sanctions_ui_contract']='APPROVED_V12_ATLAS_THEME_NATIVE'
          b['sanctions_runtime_authority']='atlas-sanctions-v12-approved-01..06.js'
          b['sanctions_style_authority']='atlas-sanctions-v12-approved-01..04.css'
          b['sanctions_data_contract']='RADAR_SANCTIONS+ENTITY_HUB_V1+WORKBENCH_IDENTITY+UAF_RECONCILIATION'
          build.write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          manifest=Path('atlas-runtime-manifest.json')
          m=json.loads(manifest.read_text(encoding='utf-8'))
          m['release']='0.43.4'; m['build']='0434'

          old_styles={'v034-sanctions-v12.css'}
          approved_styles=[f'atlas-sanctions-v12-approved-{i:02d}.css' for i in range(1,5)]
          m['styles']=[x for x in m['styles'] if x not in old_styles and x not in approved_styles]
          m['styles'].extend(approved_styles)

          old_scripts={'v034-sanctions-v12-core.js','v034-sanctions-v12-ui.js','v034-sanctions-v12-charts.js','v0341-sanctions-hardening.js'}
          approved=[{'path':f'atlas-sanctions-v12-approved-{i:02d}.js','type':'classic','role':'sanctions-v12-approved-current'} for i in range(1,7)]
          scripts=[x for x in m['scripts'] if x.get('path') not in old_scripts and not x.get('path','').startswith('atlas-sanctions-v12-approved-')]
          pos=next((i for i,x in enumerate(scripts) if x.get('path')=='atlas-current-ui.js'),len(scripts))
          scripts[pos:pos]=approved
          m['scripts']=scripts
          manifest.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          grep -q '"release": "0.43.4"' atlas-release.json
          grep -q '"app_version": "0.43.4"' build.json
          grep -q 'atlas-sanctions-v12-approved-01.js' atlas-runtime-manifest.json
          grep -q 'atlas-sanctions-v12-approved-06.js' atlas-runtime-manifest.json
          grep -q 'atlas-sanctions-v12-approved-01.css' atlas-runtime-manifest.json
          ! grep -q 'v034-sanctions-v12-core.js' atlas-runtime-manifest.json
          ! grep -q 'v0341-sanctions-hardening.js' atlas-runtime-manifest.json

      - name: Build canonical ATLAS runtime
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_atlas_site.py --out _site | tee /tmp/build-report.txt
          for f in _site/atlas-runtime-current-*.js _site/atlas-module-current-*.js; do node --check "$f"; done
          grep -R -q 'AML_SANCTIONS_V12_APPROVED' _site/atlas-runtime-current-*.js
          grep -R -q 'Consulta directa de entidad' _site/atlas-runtime-current-*.js
          grep -R -q 'Últimas sanciones · Top 5' _site/atlas-runtime-current-*.js
          grep -R -q 'Concentración regional de sanciones' _site/atlas-runtime-current-*.js
          grep -R -q 'Entidades sancionadas' _site/atlas-runtime-current-*.js
          grep -q '.sv12-approved' _site/atlas-runtime-current.css
          grep -q '"release": "0.43.4"' _site/atlas-runtime-report.json

      - name: Commit canonical release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-release.json atlas-runtime-manifest.json build.json
          git commit -m 'feat: replace Sanciones with approved v12 in ATLAS 0.43.4 [skip ci]' || true
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled current release
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy ATLAS 0.43.4
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Live smoke approved Sanciones v12
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          sleep 12
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/?release=0434-${GITHUB_RUN_ID}" -o /tmp/index.html
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/atlas-runtime-report.json?release=0434-${GITHUB_RUN_ID}" -o /tmp/runtime.json
          grep -q 'data-atlas-release="0.43.4"' /tmp/index.html
          python - <<'PY' > /tmp/assets.txt
          import json
          r=json.load(open('/tmp/runtime.json'))
          assert r['release']=='0.43.4' and r['build']=='0434'
          for x in r['published_js']: print(x)
          PY
          FOUND=0
          while read -r asset; do
            curl -fsSL -H 'Cache-Control: no-cache' "$BASE/$asset?release=0434-${GITHUB_RUN_ID}" -o "/tmp/$asset"
            if grep -q 'AML_SANCTIONS_V12_APPROVED' "/tmp/$asset"; then
              grep -q 'Consulta directa de entidad' "/tmp/$asset"
              grep -q 'Últimas sanciones · Top 5' "/tmp/$asset"
              grep -q 'Concentración regional de sanciones' "/tmp/$asset"
              grep -q 'Entidades sancionadas' "/tmp/$asset"
              FOUND=1
            fi
          done < /tmp/assets.txt
          test "$FOUND" -eq 1
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/atlas-runtime-current.css?release=0434-${GITHUB_RUN_ID}" -o /tmp/current.css
          grep -q '.sv12-approved' /tmp/current.css
          echo 'PUBLIC_APPROVED_V12=yes' >> "$GITHUB_ENV"

      - name: Report deployment
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        shell: bash
        run: |
          cat > /tmp/report.md <<EOF
          ## Sanciones v12 aprobada · deployment

          - Release: \`0.43.4 / 0434\`
          - Canonical build: \`completed\`
          - deploy-pages: \`${DEPLOY_OUTCOME}\`
          - live smoke: \`${SMOKE_OUTCOME}\`
          - public approved-v12 marker: \`${PUBLIC_APPROVED_V12:-no}\`
          - old v034 sanctions fragments removed from manifest: \`yes\`
          - palette authority: \`ATLAS theme tokens\`
          - URL: \`${PAGE_URL}\`
          EOF
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/report.md
