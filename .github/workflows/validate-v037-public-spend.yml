name: Validate Gasto Público · ATLAS AML v0.39

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v037-public-spend.js'
      - 'v037-public-spend.css'
      - 'v037-final.module.js'
      - 'v038-entity360.js'
      - 'v038-entity360.css'
      - 'v038-final.module.js'
      - 'v039-atlas-brand.js'
      - 'v039-atlas-brand.css'
      - 'index.html'
      - 'build.json'
      - 'docs/public-spend-module-v037.md'
      - '.github/workflows/validate-v037-public-spend.yml'

permissions:
  contents: write

concurrency:
  group: validate-public-spend-atlas-v039
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        id: js
        run: |
          set -euo pipefail
          node --check v037-public-spend.js
          node --check v037-final.module.js
          node --check v038-entity360.js
          node --check v038-final.module.js
          node --check v039-atlas-brand.js

      - name: Validate ATLAS Workbench integration contract
        id: app
        run: |
          set -euo pipefail
          grep -q 'data-aml-version="0.39.0"' index.html
          grep -q 'data-aml-build="0390"' index.html
          grep -q 'ATLAS AML' index.html
          grep -q 'v039-atlas-brand.css?b=0390' index.html
          grep -q 'v039-atlas-brand.js?b=0390' index.html
          grep -q 'v037-public-spend.css?b=0370' index.html
          grep -q 'v037-public-spend.js?b=0370' index.html
          grep -q 'v037-final.module.js?b=0370' index.html
          grep -q 'v038-entity360.css?b=0380' index.html
          grep -q 'v038-entity360.js?b=0380' index.html
          grep -q 'v038-final.module.js?b=0390' index.html
          grep -q '"app_version": "0.39.0"' build.json
          grep -q 'ATLAS_AML_V039' build.json
          grep -q 'PUBLIC_SPEND_V131_NATIVE' build.json
          grep -q 'ENTITY360_V038' build.json
          grep -q 'RADAR_PRESUPUESTO_ABIERTO_V131' build.json
          grep -q 'PARTIDA_CAPITULO' build.json
          grep -q 'FULL_PRIVATE_RELATION_UNIVERSE' build.json
          grep -q 'PROVEEDOR_SOURCE_TRUE_AND_NOT_INTRAESTADO_AND_NOT_PUBLIC_NAME' v037-public-spend.js
          grep -q 'aml_entities' v037-public-spend.js
          grep -q 'aml_v0205_uaf_sii_reconciliation' v037-public-spend.js
          grep -q 'aml_v028_sanctions_with_identity' v037-public-spend.js
          grep -q "uafReference:'OPTIONAL_INDEPENDENT'" v037-public-spend.js
          grep -q 'focusRut' v037-final.module.js
          grep -q 'data-v037-entity-bridge' v037-final.module.js
          grep -q 'v037LoadData' v038-entity360.js
          grep -q 'RUT_EXACT_ONLY+MISSING_IS_NOT_ZERO+MARKS_ARE_PRIORITIZATION' build.json
          grep -q 'cleanLegacyEntityBridge' v038-final.module.js
          grep -q 'atlas:nav-news' v039-atlas-brand.js

      - name: Validate live Radar Presupuesto Abierto contracts
        id: source
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          base='https://raw.githubusercontent.com/smoralesm07-source/Rada_Presupuesto_Abierto/main/docs/data/'
          def load(name):
              req=urllib.request.Request(base+name,headers={'User-Agent':'ATLAS-AML-v039-validation'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.load(r)
          status=load('spend_corrected_v3_status.json')
          ui=load('spend_v131_status.json')
          assert status.get('validation')=='success'
          assert status.get('facts')=='success'
          assert status.get('multiyear')=='success'
          assert status.get('parity_audit')=='success'
          assert status.get('compact')=='success'
          assert status.get('service_grain')=='PARTIDA_CAPITULO'
          assert status.get('provider_metrics')=='FULL_PRIVATE_RELATION_UNIVERSE'
          assert status.get('payment_basis')=='FECHA_PAGO_AND_MONTO_PAGO'
          assert status.get('recipient_rut_scope')=='ALL_BENEFICIARIES_AND_RECIPIENTS'
          assert status.get('provider_base_rule')=='PROVEEDOR_SOURCE_TRUE_AND_NOT_INTRAESTADO_AND_NOT_PUBLIC_NAME'
          assert ui.get('mark_filter_bundle')=='success'
          assert ui.get('filter_mode')=='single_toggle'
          assert ui.get('uaf_reference')=='optional_independent'
          required={'flow','kpis','reads','service_rank','growth','dependence_influence','table'}
          assert required.issubset(set(ui.get('synchronized_views') or []))
          print('[OK] source contracts')
          PY

      - name: Publish validation status
        if: always()
        env:
          JS: ${{ steps.js.outcome }}
          APP: ${{ steps.app.outcome }}
          SOURCE: ${{ steps.source.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          ok=all(os.environ.get(k)=='success' for k in ('JS','APP','SOURCE'))
          payload={
            'generated_at':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'workbench_version':'0.39.0',
            'product_name':'ATLAS AML',
            'entity360_ui':'0.38.0',
            'public_spend_ui':'13.1',
            'javascript':os.environ.get('JS'),
            'app_contract':os.environ.get('APP'),
            'source_contract':os.environ.get('SOURCE'),
            'status':'success' if ok else 'failure',
            'identity_policy':'RUT_OR_ENTITY_ID_EXACT_ONLY',
            'marks_policy':'PRIORITIZATION_NOT_FINDINGS',
            'uaf_reference':'OPTIONAL_INDEPENDENT'
          }
          Path('data/public_spend_v037_status.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name "aml-workbench-bot"
          git config user.email "aml-workbench-bot@users.noreply.github.com"
          git add data/public_spend_v037_status.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: publica validación Gasto Público · ATLAS AML v0.39"
            git pull --rebase origin main
            git push origin main
          fi