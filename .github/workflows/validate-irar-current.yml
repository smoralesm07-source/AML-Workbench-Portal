name: Validate IRAR · ATLAS current

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-irar-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate IRAR methodology and adapters
        run: |
          node --check assets/atlas-irar-current.js
          node --check assets/atlas-reportability-irar.js
          node --check assets/atlas-irg-irar-adapter.module.js
          node tests/atlas-irar-current.mjs
          node tests/atlas-irar-ui-integration.mjs
          node -e "JSON.parse(require('fs').readFileSync('data/irar_methodology_v1.json','utf8')); console.log('IRAR methodology JSON OK')"
      - name: Validate runtime wiring
        run: |
          grep -q 'atlas-irar-current.js' index.html
          grep -q 'atlas-reportability-irar.js' index.html
          grep -q 'atlas-irg-irar-adapter.module.js' index.html
          ! grep -q 'atlas-reportability-icr.js' index.html
          grep -q 'IRAR_ADJUSTED' assets/atlas-reportability-irar.js
          grep -q 'IRAR-UI-1.2' assets/atlas-reportability-irar.js
          grep -q 'atlas-irar-expected-zone' assets/atlas-reportability-irar.js
          grep -q 'Credibilidad estadística IRAR' assets/atlas-reportability-irar.js
          grep -q '<span class="atlas-irar-dot' assets/atlas-reportability-irar.js
          grep -q 'IRG-LAFT-0.34.0' assets/atlas-irg-irar-adapter.module.js
      - name: Build canonical ATLAS candidate
        run: |
          python tools/build_atlas_site.py --out _site-irar
          test -f _site-irar/index.html
          test -f _site-irar/assets/atlas-irar-current.js
          test -f _site-irar/assets/atlas-reportability-irar.js
          test -f _site-irar/assets/atlas-irg-irar-adapter.module.js
          grep -q 'atlas-reportability-irar.js?v=0468-3' _site-irar/index.html
          grep -q 'atlas-irg-irar-adapter.module.js' _site-irar/index.html
          grep -q 'IRAR-UI-1.2' _site-irar/assets/atlas-reportability-irar.js
