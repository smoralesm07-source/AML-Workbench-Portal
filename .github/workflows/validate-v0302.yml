name: Validate Runtime Snapshots v0.32.1
on:
  push:
    branches: [main]
    paths: ['index.html','v0302-*.js','v0302-*.css','v031-*.js','v031-*.css','v0312-*.js','v0312-*.css','v032-*.js','v032-*.css','v0321-*.js','v0321-*.css','.github/workflows/validate-v0302.yml']
  pull_request:
    paths: ['index.html','v0302-*.js','v0302-*.css','v031-*.js','v031-*.css','v0312-*.js','v0312-*.css','v032-*.js','v032-*.css','v0321-*.js','v0321-*.css','.github/workflows/validate-v0302.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check v0302-performance.js
          node --check v031-territory-cockpit.js
          node --check v0312-territory-refinement.js
          node --check v032-osfl-expert.js
          node --check v0321-osfl-polish.js
          node --check v0321-runtime-bootstrap.js
      - name: Validate fast snapshots and final build order
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          perf=Path('v0302-performance.js').read_text(encoding='utf-8')
          osfl=Path('v032-osfl-expert.js').read_text(encoding='utf-8')
          polish=Path('v0321-osfl-polish.js').read_text(encoding='utf-8')
          boot=Path('v0321-runtime-bootstrap.js').read_text(encoding='utf-8')
          assert 'AML Analytical Workbench · v0.32.1' in html
          assert set(re.findall(r'\?b=(\d+)',html))=={'0321'}
          assert 'v0302-performance.js?b=0321' in html
          assert 'v032-osfl-expert.js?b=0321' in html
          assert 'v0321-osfl-polish.js?b=0321' in html
          assert 'v0321-runtime-bootstrap.js?b=0321' in html
          assert 'v032-runtime-bootstrap.js' not in html
          assert html.rfind('v0321-runtime-bootstrap.js?b=0321') > html.rfind('v0321-osfl-polish.js?b=0321') > html.rfind('v032-osfl-expert.js?b=0321') > html.rfind('v0302-performance.js?b=0321')
          assert "V0302_IPA_SNAPSHOT='aml_ipa3_entity_score_snapshot_v0_4'" in perf
          assert "V0302_OSFL_DASH='aml_osfl_dashboard_runtime_snapshot'" in perf
          assert "V0302_OVERVIEW='aml_overview_runtime_snapshot'" in perf
          assert "V032_REGION_RUNTIME='aml_osfl_region_runtime_snapshot'" in osfl
          assert 'FULL_ON_360_OPEN' in polish
          assert "const V0321_RUNTIME='0.32.1'" in boot
          PY
