name: Validate v0.30.2 Runtime

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'v0302-*.js'
      - 'v0302-*.css'
      - 'v030-osfl.js'
      - 'v028-ipa3-global.js'
      - '.github/workflows/validate-v0302.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'v0302-*.js'
      - 'v0302-*.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check v0302-performance.js
          node --check v0302-runtime-bootstrap.js
      - name: Validate atomic build and runtime snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          perf=Path('v0302-performance.js').read_text(encoding='utf-8')
          boot=Path('v0302-runtime-bootstrap.js').read_text(encoding='utf-8')
          assert 'AML Analytical Workbench · v0.30.2' in html
          assert '?b=0300' not in html and '?b=0301' not in html
          assert html.count('?b=0302') >= 50
          assert 'v0302-performance.js?b=0302' in html
          assert 'v0302-runtime-bootstrap.js?b=0302' in html
          assert html.rfind('v0302-runtime-bootstrap.js?b=0302') > html.rfind('v0302-performance.js?b=0302')
          assert 'v0271-runtime-bootstrap.js' not in html
          assert 'v0272-runtime-bootstrap.js' not in html
          assert "V0302_IPA_SNAPSHOT='aml_ipa3_entity_score_snapshot_v0_4'" in perf
          assert "V0302_OSFL_DASH='aml_osfl_dashboard_runtime_snapshot'" in perf
          assert "V0302_OVERVIEW='aml_overview_runtime_snapshot'" in perf
          assert "sb.from('aml_sync_state')" in perf
          assert 'V0205_VIEW' not in perf
          assert 'v024Unavailable=function()' in perf
          assert "const V0302_RUNTIME='0.30.2'" in boot
          PY
