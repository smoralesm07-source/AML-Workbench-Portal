name: Verify Live ATLAS AML current release

on:
  workflow_run:
    workflows:
      - 'Deploy current ATLAS AML release'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-live-atlas-current
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Load current release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          m=json.load(open('atlas-release.json',encoding='utf-8'))
          print(f"ATLAS_RELEASE={m['release']}")
          print(f"ATLAS_BUILD={m['build']}")
          PY

      - name: Verify exact served compiled release
        shell: bash
        run: |
          set -euo pipefail
          URL='https://smoralesm07-source.github.io/AML-Workbench-Portal/'
          stamp=$(date +%s)
          curl -fsSL --retry 10 --retry-delay 3 "${URL}?atlas_release=${ATLAS_RELEASE}:${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/live.html
          curl -fsSL "${URL}atlas-release.json?_atlas=${stamp}" -o /tmp/release.json
          curl -fsSL "${URL}atlas-runtime-report.json?_atlas=${stamp}" -o /tmp/runtime.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/release.json'))
          rt=json.load(open('/tmp/runtime.json'))
          assert r['release']==os.environ['ATLAS_RELEASE'],r
          assert r['build']==os.environ['ATLAS_BUILD'],r
          assert r['runtime_policy']=='CANONICAL_COMPILED_RUNTIME_ONLY',r
          assert r['pages_artifact_policy']=='COMPILED_CURRENT_BUNDLES_ONLY',r
          assert rt['release']==os.environ['ATLAS_RELEASE'],rt
          assert rt['build']==os.environ['ATLAS_BUILD'],rt
          assert rt['policy']=='CANONICAL_COMPILED_RUNTIME_ONLY',rt
          assert rt['publish_mode']=='COMPILED_BUNDLES_ONLY',rt
          assert rt['historical_source_assets_published'] is False,rt
          assert rt.get('legacy_auth_runtime_published') is False,rt
          assert rt['visible_version_authority']=='atlas-release-guard.js',rt
          assert rt['published_css']==['atlas-runtime-current.css','assets/atlas-public-spend-v2.css'],rt
          assert 'assets/atlas-public-spend-v2.js' in rt['published_js'],rt
          assert 'assets/atlas-public-spend-route-authority-0578.js' in rt['published_js'],rt
          PY
          grep -q "data-aml-version=\"${ATLAS_RELEASE}\"" /tmp/live.html
          grep -q "data-aml-build=\"${ATLAS_BUILD}\"" /tmp/live.html
          grep -q "atlas-runtime-current.css?r=${ATLAS_BUILD}" /tmp/live.html
          grep -q "atlas-runtime-current-01.js?r=${ATLAS_BUILD}" /tmp/live.html
          grep -q 'assets/atlas-public-spend-v2.js?v=gp2-2' /tmp/live.html
          grep -q 'assets/atlas-public-spend-route-authority-0578.js?v=gp2-a3' /tmp/live.html
          grep -q 'assets/atlas-radar-integrated-cleanup-0641.js?v=0704-1' /tmp/live.html
          grep -q 'assets/atlas-universo-so-workbench-0700.js?v=0704-2' /tmp/live.html
          grep -q 'assets/atlas-operational-recovery-0704.js?v=0704-1' /tmp/live.html
          curl -fsSL "${URL}assets/atlas-operational-recovery-0704.js?_atlas=${stamp}" -o /tmp/recovery.js
          grep -q "VERSION='0.70.4'" /tmp/recovery.js
          grep -q "v019LoadOverview" /tmp/recovery.js
          grep -q "v019LoadQuestions" /tmp/recovery.js
          grep -q "AtlasPublicSpendV2" /tmp/recovery.js
          ! grep -q '?b=' /tmp/live.html
          ! grep -q 'atlas-auth-stability-0440.js' /tmp/live.html
          for old in v0222-radar-hotfix.js v028-ipa3-global.js v032-irg-territory.js v0342-runtime.js v035-radar-command-center.js v037-public-spend.js v038-entity360.js v039-atlas-brand.js v040-theme-bootstrap.js v0441-session-shell-guard.module.js; do
            if curl -fsS "${URL}${old}?_atlas=${stamp}" -o /dev/null; then
              echo "Versioned source/runtime unexpectedly served: $old"
              exit 1
            fi
          done
          if curl -fsS "${URL}assets/atlas-auth-stability-0440.js?_atlas=${stamp}" -o /dev/null; then
            echo "Legacy standalone auth runtime unexpectedly served"
            exit 1
          fi

      - name: Require successful deploy trigger
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: exit 1
