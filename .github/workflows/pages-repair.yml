name: Repair AML Workbench Pages

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  actions: read

concurrency:
  group: aml-workbench-pages-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[pages-repair] AML Workbench v0.34.2'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Inspect repository and Pages configuration
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          APP_VERSION=$(python - <<'PY'
          import json
          print(json.load(open('build.json'))['app_version'])
          PY
          )
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          SANCTIONS_OK=no
          if grep -q 'v034-sanctions-v12-core.js?b=0342' index.html && \
             grep -q 'v034-sanctions-v12-ui.js?b=0342' index.html && \
             grep -q 'v034-sanctions-v12-charts.js?b=0342' index.html && \
             grep -q 'v0341-sanctions-hardening.js?b=0342' index.html; then
            SANCTIONS_OK=yes
          fi
          echo "SANCTIONS_OK=$SANCTIONS_OK" >> "$GITHUB_ENV"

          gh api "repos/${GITHUB_REPOSITORY}/pages" > /tmp/pages.json 2>/tmp/pages.err
          echo "PAGES_API_STATUS=$?" >> "$GITHUB_ENV"
          gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" > /tmp/latest-build.json 2>/tmp/latest-build.err
          echo "LATEST_BUILD_API_STATUS=$?" >> "$GITHUB_ENV"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml" > /tmp/workflow.json 2>/tmp/workflow.err
          echo "WORKFLOW_API_STATUS=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Configure GitHub Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload current main as Pages artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy current main
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Verify public site
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          sleep 10
          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/?repair=${GITHUB_RUN_ID}"
          curl -fsSL -H 'Cache-Control: no-cache' "$URL" -o /tmp/public.html
          CURL_STATUS=$?
          if [ "$CURL_STATUS" -eq 0 ] && grep -q 'v0.34.2' /tmp/public.html; then
            echo 'PUBLIC_VERSION_OK=yes' >> "$GITHUB_ENV"
          else
            echo 'PUBLIC_VERSION_OK=no' >> "$GITHUB_ENV"
          fi
          echo "PUBLIC_CURL_STATUS=$CURL_STATUS" >> "$GITHUB_ENV"
          exit 0

      - name: Report repair result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/report.md
          import json, os, pathlib
          def read_json(path):
              p=pathlib.Path(path)
              if not p.exists() or not p.read_text(errors='ignore').strip(): return None
              try: return json.loads(p.read_text())
              except Exception: return p.read_text(errors='ignore')[:1500]
          pages=read_json('/tmp/pages.json')
          latest=read_json('/tmp/latest-build.json')
          workflow=read_json('/tmp/workflow.json')
          print('## Pages repair diagnostic')
          print()
          print(f"- HEAD: `{os.getenv('HEAD_SHA','?')}`")
          print(f"- App version: `{os.getenv('APP_VERSION','?')}`")
          print(f"- Sanciones v12 assets in index: `{os.getenv('SANCTIONS_OK','?')}`")
          if isinstance(pages,dict):
              print(f"- Pages status: `{pages.get('status')}`")
              print(f"- Pages build_type: `{pages.get('build_type')}`")
              print(f"- Pages source: `{pages.get('source')}`")
              print(f"- Pages html_url: `{pages.get('html_url')}`")
          else:
              print(f"- Pages API response: `{str(pages)[:600]}`")
          if isinstance(latest,dict):
              print(f"- Latest Pages build status: `{latest.get('status')}`")
              print(f"- Latest Pages build commit: `{latest.get('commit')}`")
              print(f"- Latest Pages build updated_at: `{latest.get('updated_at')}`")
              err=latest.get('error') or {}
              if err: print(f"- Latest build error: `{err}`")
          if isinstance(workflow,dict):
              print(f"- pages.yml workflow state: `{workflow.get('state')}`")
              print(f"- pages.yml workflow id: `{workflow.get('id')}`")
          print(f"- configure-pages: `{os.getenv('CONFIGURE_OUTCOME','?')}`")
          print(f"- upload-pages-artifact: `{os.getenv('UPLOAD_OUTCOME','?')}`")
          print(f"- deploy-pages: `{os.getenv('DEPLOY_OUTCOME','?')}`")
          print(f"- deployed URL: `{os.getenv('PAGE_URL','')}`")
          print(f"- public v0.34.2 observed after deploy: `{os.getenv('PUBLIC_VERSION_OK','?')}`")
          print(f"- public curl status: `{os.getenv('PUBLIC_CURL_STATUS','?')}`")
          PY
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/report.md
