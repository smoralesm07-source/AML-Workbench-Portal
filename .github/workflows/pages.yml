name: Deploy current ATLAS AML release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/public_spend_v037_status.json'
      - 'data/public_spend_v037_live_status.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-aml-pages
  cancel-in-progress: true

env:
  ATLAS_RELEASE: '0.42.4'
  ATLAS_BUILD: '0424'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Synchronize with HEAD of main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git reset --hard origin/main
          echo "Deploying $(git rev-parse HEAD)"

      - name: Verify current release and runtime authority safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          m=json.load(open('atlas-release.json',encoding='utf-8'))
          b=json.load(open('build.json',encoding='utf-8'))
          assert m['release']==os.environ['ATLAS_RELEASE'],m
          assert m['build']==os.environ['ATLAS_BUILD'],m
          assert b['app_version']==os.environ['ATLAS_RELEASE'],b
          assert b['build']==os.environ['ATLAS_BUILD'],b
          assert m['deployment_policy']=='SINGLE_ACTIVE_RELEASE',m
          assert m['visible_version_policy']=='ATLAS_RELEASE_GUARD_ONLY_LEGACY_RUNTIME_DELEGATES',m
          assert m['asset_coherency_policy']=='ALL_LOCAL_JS_CSS_PINNED_TO_CURRENT_BUILD',m
          assert b['visible_version_authority']=='ATLAS_RELEASE_GUARD_ONLY',b
          assert b['asset_coherency_policy']=='ALL_LOCAL_JS_CSS_PINNED_TO_CURRENT_BUILD',b
          PY
          node --check atlas-release-guard.js
          node --check v040-theme-bootstrap.js
          node --check v0402-aie-brand.js
          node --check v0422-auth-bootstrap-fix.js
          node --check v0206-stability.js
          node --check v0342-runtime.js
          node --check v0343-final.module.js
          node --check v0333-auth-preflight.js
          node --check app.js
          grep -q "const RELEASE='0.42.4'" atlas-release-guard.js
          grep -q "const BUILD='0424'" atlas-release-guard.js
          grep -q "ALL_LOCAL_JS_CSS_PINNED_TO_CURRENT_BUILD" atlas-release-guard.js
          grep -q "atlas-release-guard-via-v0342-compat" v0342-runtime.js
          grep -q "atlas-release-guard-via-v0343-compat" v0343-final.module.js
          ! grep -q "window.__AML_ACTIVE_VERSION__=V0342_RUNTIME" v0342-runtime.js
          ! grep -q 'Operational Radar · v${V0342_RUNTIME}' v0342-runtime.js
          ! grep -q "window.__AML_ACTIVE_VERSION__=VERSION" v0343-final.module.js
          grep -q "CHILD_INSERTIONS_ONLY_NO_CHARACTERDATA_LOOP" v0402-aie-brand.js
          ! grep -q "characterData:true" v0402-aie-brand.js
          grep -q "ATLAS_LEGACY_VERSION_WATCHERS_DISABLED" v0206-stability.js
          ! grep -q "VERSION_OBSERVER.observe" v0206-stability.js
          grep -q "audit is best-effort" v0422-auth-bootstrap-fix.js
          grep -q "AUTH_TIMEOUT=6500" v0422-auth-bootstrap-fix.js

      - name: Build clean coherent Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'prototypes' \
            --exclude 'tests' \
            --exclude 'docs' \
            --exclude '*.md' \
            --exclude '.pages-*' \
            --exclude 'v035-final.module.js' \
            --exclude 'v036-final.module.js'

          python - <<'PY'
          from pathlib import Path
          import os,re

          rel=os.environ['ATLAS_RELEASE']; build=os.environ['ATLAS_BUILD']
          index=Path('_site/index.html')
          s=index.read_text(encoding='utf-8')
          s=re.sub(r'data-aml-version="[^"]+"',f'data-aml-version="{rel}"',s,count=1)
          s=re.sub(r'data-aml-build="[^"]+"',f'data-aml-build="{build}"',s,count=1)
          s=re.sub(r'data-atlas-release="[^"]+"',f'data-atlas-release="{rel}"',s,count=1)
          s=re.sub(r'<title>.*?</title>',f'<title>ATLAS AML · v{rel}</title>',s,count=1,flags=re.S)
          s='\n'.join(line for line in s.splitlines() if 'v035-final.module.js' not in line and 'v036-final.module.js' not in line)+'\n'
          index.write_text(s,encoding='utf-8')

          # One release => one coherent asset graph. Rewrite every same-origin JS/CSS
          # reference in HTML and JavaScript, including dynamic imports created by
          # historical compatibility modules. This removes all fixed ?b=03xx caches.
          static_ref=re.compile(r'(\./[A-Za-z0-9_./-]+\.(?:js|css))(?:\?[^\"\'`\s<>)]+)?')
          for path in list(Path('_site').rglob('*.html')) + list(Path('_site').rglob('*.js')):
              text=path.read_text(encoding='utf-8')
              text=static_ref.sub(lambda m:f'{m.group(1)}?r={build}',text)
              path.write_text(text,encoding='utf-8')

          # Ensure the auth rescue layer is present immediately after app.js.
          s=index.read_text(encoding='utf-8')
          rescue=f'  <script src="./v0422-auth-bootstrap-fix.js?r={build}"></script>'
          if 'v0422-auth-bootstrap-fix.js' not in s:
              app_tag=re.search(r'  <script src="\./app\.js\?r='+re.escape(build)+r'"></script>',s)
              if not app_tag: raise SystemExit('app.js release tag not found')
              pos=app_tag.end(); s=s[:pos]+'\n'+rescue+s[pos:]
              index.write_text(s,encoding='utf-8')

          # Contract: every local JS/CSS reference in index is pinned to this build.
          s=index.read_text(encoding='utf-8')
          refs=re.findall(r'(?:src|href)="(\./[^\"]+\.(?:js|css)(?:\?[^\"]*)?)"',s)
          stale=[x for x in refs if f'?r={build}' not in x]
          if stale: raise SystemExit('stale local assets: '+', '.join(stale[:20]))
          if '?b=' in '\n'.join(refs): raise SystemExit('legacy ?b= cache key remains in production index')
          PY

          touch _site/.nojekyll
          test -f _site/v0422-auth-bootstrap-fix.js
          test ! -e _site/v035-final.module.js
          test ! -e _site/v036-final.module.js
          grep -q "data-aml-version=\"${ATLAS_RELEASE}\"" _site/index.html
          grep -q "data-aml-build=\"${ATLAS_BUILD}\"" _site/index.html
          grep -q "v0342-runtime.js?r=${ATLAS_BUILD}" _site/index.html
          grep -q "v0343-final.module.js?r=${ATLAS_BUILD}" _site/index.html
          grep -q "v038-entity360.js?r=${ATLAS_BUILD}" _site/index.html
          grep -q "v0391-entity-entry.js?r=${ATLAS_BUILD}" _site/index.html
          grep -q "v037-public-spend.js?r=${ATLAS_BUILD}" _site/index.html
          ! grep -q '?b=' _site/index.html
          grep -q "v0344-public-entities.module.js?r=${ATLAS_BUILD}" _site/v0343-final.module.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload current release only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy current release
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test exact deployed asset graph
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          url="${PAGE_URL%/}/?atlas_release=${ATLAS_RELEASE}:${ATLAS_BUILD}&_atlas=${stamp}"
          curl --fail --silent --show-error --location --retry 10 --retry-delay 2 "$url" -o /tmp/atlas.html
          grep -q "data-aml-version=\"${ATLAS_RELEASE}\"" /tmp/atlas.html
          grep -q "data-aml-build=\"${ATLAS_BUILD}\"" /tmp/atlas.html
          grep -q "v0342-runtime.js?r=${ATLAS_BUILD}" /tmp/atlas.html
          grep -q "v0343-final.module.js?r=${ATLAS_BUILD}" /tmp/atlas.html
          grep -q "v038-entity360.js?r=${ATLAS_BUILD}" /tmp/atlas.html
          grep -q "v0391-entity-entry.js?r=${ATLAS_BUILD}" /tmp/atlas.html
          grep -q "v037-public-spend.js?r=${ATLAS_BUILD}" /tmp/atlas.html
          ! grep -q '?b=' /tmp/atlas.html
          curl --fail --silent --show-error --location "${PAGE_URL%/}/v0342-runtime.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/v0342.js
          curl --fail --silent --show-error --location "${PAGE_URL%/}/v0343-final.module.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/v0343.js
          grep -q "atlas-release-guard-via-v0342-compat" /tmp/v0342.js
          grep -q "atlas-release-guard-via-v0343-compat" /tmp/v0343.js
          grep -q "v0344-public-entities.module.js?r=${ATLAS_BUILD}" /tmp/v0343.js
          ! grep -q "window.__AML_ACTIVE_VERSION__=V0342_RUNTIME" /tmp/v0342.js
          ! grep -q 'Operational Radar · v${V0342_RUNTIME}' /tmp/v0342.js
          ! grep -q "window.__AML_ACTIVE_VERSION__=VERSION" /tmp/v0343.js
