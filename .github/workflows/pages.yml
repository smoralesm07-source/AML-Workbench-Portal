name: Deploy current ATLAS AML release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/public_spend_v037_status.json'
      - 'data/public_spend_v037_live_status.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-aml-pages
  cancel-in-progress: true

env:
  ATLAS_RELEASE: '0.42.5'
  ATLAS_BUILD: '0425'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Synchronize with HEAD of main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git reset --hard origin/main
          echo "Deploying $(git rev-parse HEAD)"

      - name: Verify current release and UI authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          release=json.load(open('atlas-release.json',encoding='utf-8'))
          build=json.load(open('build.json',encoding='utf-8'))
          assert release['release']==os.environ['ATLAS_RELEASE'],release
          assert release['build']==os.environ['ATLAS_BUILD'],release
          assert release['ui_authority_policy']=='ATLAS_CURRENT_UI_LAST_WRITER',release
          assert release['navigation_policy']=='UNIFORM_LEVEL_NO_LEGACY_PSEUDO_MARKERS',release
          assert build['app_version']==os.environ['ATLAS_RELEASE'],build
          assert build['build']==os.environ['ATLAS_BUILD'],build
          assert build['ui_authority_policy']=='ATLAS_CURRENT_UI_LAST_WRITER',build
          PY
          node --check atlas-release-guard.js
          node --check atlas-current-ui.js
          node --check v040-theme-bootstrap.js
          node --check v037-final.module.js
          node --check v038-final.module.js
          node --check v0422-auth-bootstrap-fix.js
          grep -q "const RELEASE='0.42.5'" atlas-release-guard.js
          grep -q "const BUILD='0425'" atlas-release-guard.js
          grep -q "atlas-current-ui.css" v040-theme-bootstrap.js
          grep -q "atlas-current-ui.js" v040-theme-bootstrap.js
          grep -q "atlas:nav-refresh" v037-final.module.js
          grep -q "atlas-release-guard-via-v037-compat" v037-final.module.js
          grep -q "atlas-release-guard-via-v038-compat" v038-final.module.js
          ! grep -q "window.__AML_ACTIVE_VERSION__=VERSION" v037-final.module.js
          ! grep -q "window.__AML_ACTIVE_VERSION__=VERSION" v038-final.module.js
          grep -q 'data-view="public-spend"' atlas-current-ui.css
          grep -q 'content:none!important' atlas-current-ui.css

      - name: Build clean coherent Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'prototypes' \
            --exclude 'tests' \
            --exclude 'docs' \
            --exclude '*.md' \
            --exclude '.pages-*' \
            --exclude 'v035-final.module.js' \
            --exclude 'v036-final.module.js'

          python - <<'PY'
          from pathlib import Path
          import os,re
          rel=os.environ['ATLAS_RELEASE']; build=os.environ['ATLAS_BUILD']
          index=Path('_site/index.html')
          s=index.read_text(encoding='utf-8')
          s=re.sub(r'data-aml-version="[^"]+"',f'data-aml-version="{rel}"',s,count=1)
          s=re.sub(r'data-aml-build="[^"]+"',f'data-aml-build="{build}"',s,count=1)
          s=re.sub(r'data-atlas-release="[^"]+"',f'data-atlas-release="{rel}"',s,count=1)
          s=re.sub(r'<title>.*?</title>',f'<title>ATLAS AML · v{rel}</title>',s,count=1,flags=re.S)
          s='\n'.join(line for line in s.splitlines() if 'v035-final.module.js' not in line and 'v036-final.module.js' not in line)+'\n'
          index.write_text(s,encoding='utf-8')

          # Every same-origin JS/CSS reference, including dynamic imports, belongs
          # to one build. Historical ?b=03xx keys never enter the Pages artifact.
          static_ref=re.compile(r'(\./[A-Za-z0-9_./-]+\.(?:js|css))(?:\?[^\"\'`\s<>)]+)?')
          for path in list(Path('_site').rglob('*.html'))+list(Path('_site').rglob('*.js')):
              text=path.read_text(encoding='utf-8')
              text=static_ref.sub(lambda m:f'{m.group(1)}?r={build}',text)
              path.write_text(text,encoding='utf-8')

          s=index.read_text(encoding='utf-8')
          rescue=f'  <script src="./v0422-auth-bootstrap-fix.js?r={build}"></script>'
          if 'v0422-auth-bootstrap-fix.js' not in s:
              app_tag=re.search(r'  <script src="\./app\.js\?r='+re.escape(build)+r'"></script>',s)
              if not app_tag: raise SystemExit('app.js release tag not found')
              pos=app_tag.end();s=s[:pos]+'\n'+rescue+s[pos:]
              index.write_text(s,encoding='utf-8')

          refs=re.findall(r'(?:src|href)="(\./[^\"]+\.(?:js|css)(?:\?[^\"]*)?)"',index.read_text(encoding='utf-8'))
          stale=[x for x in refs if f'?r={build}' not in x]
          if stale: raise SystemExit('stale local assets: '+', '.join(stale[:20]))
          PY

          touch _site/.nojekyll
          test -f _site/atlas-current-ui.js
          test -f _site/atlas-current-ui.css
          test ! -e _site/v035-final.module.js
          test ! -e _site/v036-final.module.js
          grep -q "data-aml-version=\"${ATLAS_RELEASE}\"" _site/index.html
          grep -q "data-aml-build=\"${ATLAS_BUILD}\"" _site/index.html
          ! grep -q '?b=' _site/index.html
          grep -q "atlas-current-ui.js?r=${ATLAS_BUILD}" _site/v040-theme-bootstrap.js
          grep -q "atlas-current-ui.css?r=${ATLAS_BUILD}" _site/v040-theme-bootstrap.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload current release only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy current release
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test current UI authority
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          url="${PAGE_URL%/}/?atlas_release=${ATLAS_RELEASE}:${ATLAS_BUILD}&_atlas=${stamp}"
          curl --fail --silent --show-error --location --retry 10 --retry-delay 2 "$url" -o /tmp/atlas.html
          grep -q "data-aml-version=\"${ATLAS_RELEASE}\"" /tmp/atlas.html
          grep -q "data-aml-build=\"${ATLAS_BUILD}\"" /tmp/atlas.html
          ! grep -q '?b=' /tmp/atlas.html
          base="${PAGE_URL%/}"
          curl -fsSL "$base/v040-theme-bootstrap.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/theme.js
          curl -fsSL "$base/atlas-current-ui.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/current.js
          curl -fsSL "$base/atlas-current-ui.css?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/current.css
          curl -fsSL "$base/v037-final.module.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/v037.js
          curl -fsSL "$base/v038-final.module.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/v038.js
          grep -q "atlas-current-ui.js?r=${ATLAS_BUILD}" /tmp/theme.js
          grep -q "atlas-current-ui.css?r=${ATLAS_BUILD}" /tmp/theme.js
          grep -q "Gasto público" /tmp/current.js
          grep -q "content:none!important" /tmp/current.css
          grep -q "atlas-release-guard-via-v037-compat" /tmp/v037.js
          grep -q "atlas-release-guard-via-v038-compat" /tmp/v038.js
