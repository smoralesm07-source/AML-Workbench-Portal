name: Deploy AML Workbench Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate public shell
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          ! grep -R -E 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_|client_secret' . --exclude-dir=.git
          grep -q 'sb_publishable_' index.html
          grep -q "provider:'azure'" index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
