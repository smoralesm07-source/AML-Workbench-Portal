name: Deploy current ATLAS AML release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/public_spend_v037_status.json'
      - 'data/public_spend_v037_live_status.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-aml-pages
  cancel-in-progress: true

env:
  ATLAS_RELEASE: '0.42.0'
  ATLAS_BUILD: '0420'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout HEAD of main, never the triggering historical SHA
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Synchronize again with current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git reset --hard origin/main
          echo "Deploying $(git rev-parse HEAD) from current main"

      - name: Verify single active release manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          m=json.load(open('atlas-release.json',encoding='utf-8'))
          assert m['release']==os.environ['ATLAS_RELEASE'], m
          assert m['build']==os.environ['ATLAS_BUILD'], m
          assert m['deployment_policy']=='SINGLE_ACTIVE_RELEASE', m
          assert m['legacy_release_policy']=='GIT_HISTORY_ONLY_NOT_ACTIVE_RUNTIME', m
          print('[OK] single active release',m['release'],m['build'])
          PY
          test -f atlas-release-guard.js
          node --check atlas-release-guard.js
          node --check v036-radar-integrado-runtime-fix.js
          node --check v0402-reconciliation-live.js

      - name: Build clean Pages artifact from current release only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'prototypes' \
            --exclude 'tests' \
            --exclude 'docs' \
            --exclude '*.md' \
            --exclude '.pages-*' \
            --exclude 'v035-final.module.js' \
            --exclude 'v036-final.module.js'

          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          rel=os.environ['ATLAS_RELEASE']; build=os.environ['ATLAS_BUILD']

          # Canonical document identity.
          s=re.sub(r'data-aml-version="[^"]+"',f'data-aml-version="{rel}"',s,count=1)
          s=re.sub(r'data-aml-build="[^"]+"',f'data-aml-build="{build}"',s,count=1)
          if 'data-atlas-release=' not in s:
              s=s.replace('<html lang="es" ',f'<html lang="es" data-atlas-release="{rel}" data-atlas-release-policy="single-active" ',1)
          s=re.sub(r'<title>.*?</title>',f'<title>ATLAS AML · v{rel}</title>',s,count=1,flags=re.S)

          # Release guard is the first local runtime authority after CSP.
          guard=f'  <script src="./atlas-release-guard.js?r={build}"></script>\n'
          if 'atlas-release-guard.js' not in s:
              marker='  <script src="./v040-theme-bootstrap.js?b=0400"></script>\n'
              s=s.replace(marker,guard+marker,1)

          # Never execute obsolete final runtime authorities again.
          s='\n'.join(line for line in s.splitlines() if 'v035-final.module.js' not in line and 'v036-final.module.js' not in line)+'\n'

          # Force fresh copies of every layer that has changed after the old 0.39 shell.
          replacements={
            './v040-theme-bootstrap.js?b=0400':f'./v040-theme-bootstrap.js?r={build}',
            './v039-atlas-brand.css?b=0390':f'./v039-atlas-brand.css?r={build}',
            './v040-theme-system.css?b=0400':f'./v040-theme-system.css?r={build}',
            './v036-radar-integrado-runtime-fix.js?b=0360':f'./v036-radar-integrado-runtime-fix.js?r={build}',
            './v0402-reconciliation-live.js?b=0402':f'./v0402-reconciliation-live.js?r={build}',
            './v038-final.module.js?b=0390':f'./v038-final.module.js?r={build}',
            './v039-atlas-brand.js?b=0390':f'./v039-atlas-brand.js?r={build}',
          }
          for old,new in replacements.items(): s=s.replace(old,new)

          p.write_text(s,encoding='utf-8')
          PY

          touch _site/.nojekyll

          # Production artifact must contain exactly one app entry point and current release authority.
          test -f _site/index.html
          test -f _site/atlas-release.json
          test -f _site/atlas-release-guard.js
          test ! -e _site/prototypes
          test ! -e _site/tests
          test ! -e _site/.github
          test ! -e _site/v035-final.module.js
          test ! -e _site/v036-final.module.js
          grep -q "data-aml-version=\"${ATLAS_RELEASE}\"" _site/index.html
          grep -q "data-aml-build=\"${ATLAS_BUILD}\"" _site/index.html
          grep -q "data-atlas-release=\"${ATLAS_RELEASE}\"" _site/index.html
          grep -q "atlas-release-guard.js?r=${ATLAS_BUILD}" _site/index.html
          ! grep -q 'v035-final.module.js' _site/index.html
          ! grep -q 'v036-final.module.js' _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload current release artifact only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy current main release
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test exact deployed release
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          stamp=$(date +%s)
          curl --fail --silent --show-error --location --retry 8 --retry-delay 2 "${PAGE_URL%/}/?atlas_release=${ATLAS_RELEASE}:${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/atlas.html
          grep -q "data-aml-version=\"${ATLAS_RELEASE}\"" /tmp/atlas.html
          grep -q "data-aml-build=\"${ATLAS_BUILD}\"" /tmp/atlas.html
          grep -q "data-atlas-release=\"${ATLAS_RELEASE}\"" /tmp/atlas.html
          grep -q "atlas-release-guard.js?r=${ATLAS_BUILD}" /tmp/atlas.html
          ! grep -q 'v035-final.module.js' /tmp/atlas.html
          ! grep -q 'v036-final.module.js' /tmp/atlas.html
          curl --fail --silent --show-error --location "${PAGE_URL%/}/atlas-release.json?_atlas=${stamp}" -o /tmp/release.json
          python - <<'PY'
          import json,os
          m=json.load(open('/tmp/release.json'))
          assert m['release']==os.environ['ATLAS_RELEASE'],m
          assert m['build']==os.environ['ATLAS_BUILD'],m
          assert m['deployment_policy']=='SINGLE_ACTIVE_RELEASE',m
          print('[OK] live ATLAS release',m['release'],m['build'])
          PY
