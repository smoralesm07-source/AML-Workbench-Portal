name: Deploy current ATLAS AML release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-aml-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate canonical Atlas 0.70.5 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-aml-version="0.70.5"' index.html
          grep -q 'data-aml-build="0705"' index.html
          grep -q '<title>ATLAS AML · v0.70.5</title>' index.html
          grep -q '"release": "0.70.5"' atlas-release.json
          grep -q '"build": "0705"' atlas-release.json
          grep -q '"release": "0.70.5"' atlas-runtime-manifest.json
          grep -q '"build": "0705"' atlas-runtime-manifest.json
          grep -q '"app_version":"0.70.5"' build.json
          grep -q '"build":"0705"' build.json
          grep -q 'atlas-source-health-global-0694.js?v=0710-1' index.html
          grep -q 'atlas-universo-so-workbench-0700.js?v=0705-2' index.html
          ! grep -Eq 'atlas-universo-so-(0600|0610|0620|0630|0640)' index.html
          for f in assets/atlas-universo-so-0600.js assets/atlas-universo-so-0610.js assets/atlas-universo-so-0620.js assets/atlas-universo-so-0630.js assets/atlas-universo-so-0640.js; do test ! -e "$f"; done
          node --check atlas-release-guard.js
          node --check assets/atlas-source-health-global-0694.js
          node --check assets/atlas-universo-so-workbench-0700.js
          grep -q 'workbench:true' assets/atlas-universo-so-workbench-0700.js
          grep -q 'routeAuthority:true' assets/atlas-universo-so-workbench-0700.js
          grep -q 'canonical:true' assets/atlas-universo-so-workbench-0700.js

      - name: Force Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=workflow \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" >/dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare exact main as Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'tests/'
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/atlas-release.json
          test -s _site/atlas-runtime-manifest.json
          grep -q 'data-aml-version="0.70.5"' _site/index.html
          grep -q 'data-aml-build="0705"' _site/index.html
          grep -q 'atlas-source-health-global-0694.js?v=0710-1' _site/index.html
          grep -q 'atlas-universo-so-workbench-0700.js?v=0705-2' _site/index.html
          ! grep -Eq 'atlas-universo-so-(0600|0610|0620|0630|0640)' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy Atlas 0.70.5
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"; stamp=$(date +%s)
          curl -fsSL --retry 15 --retry-delay 2 "$base/?_atlas=$stamp" -o /tmp/index.html
          curl -fsSL --retry 15 --retry-delay 2 "$base/atlas-release.json?_atlas=$stamp" -o /tmp/release.json
          grep -q 'data-aml-version="0.70.5"' /tmp/index.html
          grep -q 'data-aml-build="0705"' /tmp/index.html
          grep -q 'atlas-universo-so-workbench-0700.js?v=0705-2' /tmp/index.html
          ! grep -Eq 'atlas-universo-so-(0600|0610|0620|0630|0640)' /tmp/index.html
          python - <<'PY'
          import json
          r=json.load(open('/tmp/release.json'))
          assert r['release']=='0.70.5',r
          assert r['build']=='0705',r
          PY
          echo 'ATLAS AML 0.70.5 canonical runtime is live.'
