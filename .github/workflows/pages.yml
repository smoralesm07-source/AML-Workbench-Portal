name: Deploy AML Workbench Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aml-workbench-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Verify current release contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-aml-version="0.35.0"' index.html
          grep -q 'data-aml-build="0350"' index.html
          grep -q 'v035-radar-command-center.css?b=0350' index.html
          grep -q 'v035-radar-command-center-patch.css?b=0350' index.html
          grep -q 'v035-radar-command-center.js?b=0350' index.html
          grep -q 'v035-radar-command-center-patch.js?b=0350' index.html
          grep -q 'v035-final.module.js?b=0350' index.html
          grep -q 'v034-sanctions-v12-core.js?b=0343' index.html
          grep -q 'v034-sanctions-v12-ui.js?b=0343' index.html
          grep -q 'v034-sanctions-v12-charts.js?b=0343' index.html
          grep -q 'v0341-sanctions-hardening.js?b=0343' index.html
          grep -q '"app_version": "0.35.0"' build.json
          grep -q 'RADAR_INTEGRADO_UAF_COMMAND_CENTER' build.json
          grep -q 'UAF_ANALYTICS_ABSORBED_IN_RADAR_INTEGRADO' build.json
          grep -q 'v0344-public-entities.module.js?b=0343' v0343-final.module.js
          test -f v035-radar-command-center.js
          test -f v035-radar-command-center.css
          test -f v035-radar-command-center-patch.js
          test -f v035-radar-command-center-patch.css
          test -f v035-final.module.js
          test -f v0344-public-entities.module.js
          test -f v0344-public-entities.css

      - name: Validate final JavaScript layers
        shell: bash
        run: |
          set -euo pipefail
          node --check v035-radar-command-center.js
          node --check v035-radar-command-center-patch.js
          node --check v035-final.module.js
          node --check v0343-final.module.js
          node --check v0344-public-entities.module.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload current main as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy current main
        id: deployment
        uses: actions/deploy-pages@v4
