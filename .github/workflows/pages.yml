name: Deploy current ATLAS AML release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/public_spend_v037_status.json'
      - 'data/public_spend_v037_live_status.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-aml-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Synchronize with HEAD of main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git reset --hard origin/main
          echo "Deploying $(git rev-parse HEAD)"

      - name: Load release metadata from single source of truth
        shell: bash
        run: |
          set -euo pipefail
          echo "ATLAS_RELEASE=$(python -c \"import json; print(json.load(open('atlas-release.json'))['release'])\")" >> "$GITHUB_ENV"
          echo "ATLAS_BUILD=$(python -c \"import json; print(json.load(open('atlas-release.json'))['build'])\")" >> "$GITHUB_ENV"

      - name: Verify canonical runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('atlas-release.json',encoding='utf-8'))
          m=json.load(open('atlas-runtime-manifest.json',encoding='utf-8'))
          b=json.load(open('build.json',encoding='utf-8'))
          assert r['release']==m['release']==b['app_version']
          assert r['build']==m['build']==b['build']
          assert r['runtime_policy']=='CANONICAL_ACTIVE_RUNTIME_ONLY'
          assert r['pages_artifact_policy']=='ALLOWLIST_ACTIVE_RUNTIME_ONLY'
          assert m['policy']=='CANONICAL_ACTIVE_RUNTIME_ONLY'
          assert b['future_change_policy']=='BRANCH_PR_VALIDATE_CURRENT_MERGE_MAIN_AUTO_DEPLOY_LIVE_SMOKE'
          PY
          node --check atlas-release-guard.js
          node --check v040-theme-bootstrap.js
          node --check atlas-current-ui.js
          node --check atlas-cgr-bridge.js
          grep -q 'release-agnostic' atlas-release-guard.js
          grep -q 'CANONICAL_ACTIVE_RUNTIME_ONLY' atlas-release-guard.js
          grep -q 'FIRST_PAINT_ONLY' v040-theme-bootstrap.js
          grep -q 'AtlasTheme' atlas-current-ui.js
          grep -q 'window.v035OpenCgr=openCgr' atlas-cgr-bridge.js

      - name: Build allowlisted current runtime only
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_atlas_site.py --out _site
          test -f _site/index.html
          test -f _site/atlas-runtime-report.json
          test -f _site/atlas-current-ui.js
          test -f _site/atlas-cgr-bridge.js
          test ! -e _site/v0342-runtime.js
          test ! -e _site/v0343-final.module.js
          test ! -e _site/v035-radar-command-center.js
          test ! -e _site/v037-final.module.js
          test ! -e _site/v038-final.module.js
          test ! -e _site/v039-atlas-brand.js
          grep -q "data-aml-version=\"${ATLAS_RELEASE}\"" _site/index.html
          grep -q "data-aml-build=\"${ATLAS_BUILD}\"" _site/index.html
          grep -q "atlas-current-ui.js?r=${ATLAS_BUILD}" _site/index.html
          grep -q "atlas-cgr-bridge.js?r=${ATLAS_BUILD}" _site/index.html
          ! grep -q '?b=' _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload current release only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy current release
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test exact canonical release
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          base="${PAGE_URL%/}"
          curl -fsSL --retry 10 --retry-delay 2 "$base/?atlas_release=${ATLAS_RELEASE}:${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/atlas.html
          curl -fsSL "$base/atlas-release.json?_atlas=${stamp}" -o /tmp/release.json
          curl -fsSL "$base/atlas-runtime-report.json?_atlas=${stamp}" -o /tmp/runtime.json
          curl -fsSL "$base/atlas-current-ui.js?r=${ATLAS_BUILD}&_atlas=${stamp}" -o /tmp/current.js
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/release.json'))
          rt=json.load(open('/tmp/runtime.json'))
          assert r['release']==os.environ['ATLAS_RELEASE'] and r['build']==os.environ['ATLAS_BUILD'],r
          assert rt['release']==os.environ['ATLAS_RELEASE'] and rt['build']==os.environ['ATLAS_BUILD'],rt
          assert rt['policy']=='CANONICAL_ACTIVE_RUNTIME_ONLY',rt
          PY
          grep -q "data-aml-version=\"${ATLAS_RELEASE}\"" /tmp/atlas.html
          grep -q "data-aml-build=\"${ATLAS_BUILD}\"" /tmp/atlas.html
          grep -q "atlas-current-ui.js?r=${ATLAS_BUILD}" /tmp/atlas.html
          grep -q "Gasto público" /tmp/current.js
          ! grep -q '?b=' /tmp/atlas.html
          for old in v0342-runtime.js v0343-final.module.js v035-radar-command-center.js v037-final.module.js v038-final.module.js v039-atlas-brand.js; do
            if curl -fsS "$base/$old?_atlas=${stamp}" -o /dev/null; then
              echo "Historical runtime unexpectedly published: $old"
              exit 1
            fi
          done
