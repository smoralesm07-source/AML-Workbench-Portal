name: Deploy AML Workbench Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aml-workbench-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate current public shell
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f build.json
          test -f v0342-runtime.js
          test -f v0342-runtime.css
          grep -q 'AML Analytical Workbench · v0.34.2' index.html
          grep -q 'data-aml-version="0.34.2"' index.html
          grep -q '"app_version": "0.34.2"' build.json
          grep -q 'v0342-runtime.js?b=0342' index.html
          grep -q 'v0342-runtime.css?b=0342' index.html
          ! grep -q 'v0321-runtime-bootstrap.js' index.html
          ! grep -q 'v0331-runtime-bootstrap.js' index.html
          ! grep -q 'v0334-runtime-bootstrap.js' index.html
          ! grep -R -E 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_|client_secret' . --exclude-dir=.git
          grep -q 'sb_publishable_' app.js
          grep -q "provider:'azure'" app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare immutable site artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'tests/' \
            --exclude 'docs/' \
            --exclude '*.md'
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/v0342-runtime.js
          test -f _site/v0342-runtime.css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy current build
        id: deployment
        uses: actions/deploy-pages@v4
