name: Deploy Cloudflare Maigret

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/maigret-service/**'
      - '.github/workflows/deploy-cloudflare-maigret.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/maigret-service/**'
      - '.github/workflows/deploy-cloudflare-maigret.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/maigret-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Worker and container configuration
        run: npx wrangler deploy --dry-run

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/maigret-service
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy atlas-maigret-osint
        id: deploy
        shell: bash
        run: |
          set +e
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish deployment report
        if: always()
        shell: bash
        run: |
          status="SUCCESS"
          if [ "${{ steps.deploy.outputs.exit_code }}" != "0" ]; then status="FAILURE"; fi
          {
            echo "## Cloudflare Maigret deployment · $status"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            grep -E 'https://|Version ID|Uploaded|Deployed|containers|ERROR|Error|error' deploy.log | tail -80 || tail -80 deploy.log
            echo '```'
          } > deployment-report.md
          cat deployment-report.md >> "$GITHUB_STEP_SUMMARY"
          gh issue comment 86 --repo "$GITHUB_REPOSITORY" --body-file deployment-report.md
      - name: Fail if deployment failed
        if: steps.deploy.outputs.exit_code != '0'
        run: exit 1
