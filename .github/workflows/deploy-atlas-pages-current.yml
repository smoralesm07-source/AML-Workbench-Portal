name: Deploy ATLAS AML current

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-current
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate canonical 0.90.1 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('atlas-release.json').read_text())
          runtime=json.loads(Path('atlas-runtime-manifest.json').read_text())
          build=json.loads(Path('build.json').read_text())
          guard=Path('atlas-release-guard.js').read_text()
          ui=Path('assets/atlas-ui-authority-0901.js').read_text()
          css=Path('assets/atlas-ui-authority-0901.css').read_text()
          html=Path('index.html').read_text()
          loader=Path('assets/atlas-universo-so-entity-explorer-0813.js').read_text()
          universo=Path('assets/atlas-universo-so-entity-explorer-0816.js').read_text()
          candidates=Path('assets/atlas-universo-so-candidate-management-0820.js').read_text()

          assert release['release']=='0.90.1' and release['build']=='0901'
          assert runtime['release']=='0.90.1' and runtime['build']=='0901'
          assert build['app_version']=='0.90.1' and build['build']=='0901'
          assert "release:'0.90.1',build:'0901'" in guard
          assert 'atlas-release-guard-0901-freeze-safe' in guard
          assert 'assets/atlas-ui-authority-0901.js' in [x['path'] for x in runtime['scripts']]
          assert "RELEASE='0.90.1'" in ui and "BUILD='0901'" in ui
          assert 'data-atlas-ui-authority' in ui
          assert 'html[data-atlas-release="0.90.1"]' in css

          # Current feature surfaces must remain present while the shared shell is hardened.
          assert 'atlas-universo-so-contact-osint-0840.css?v=0840-1' in html
          assert 'atlas-universo-so-contact-osint-0840.js?v=0840-1' in html
          assert 'ENTITY_EXPLORER_SPECIALIZATION_0816_LOADING' in loader
          assert 'ENTITY_EXPLORER_SPECIALIZATION_0816' in universo
          assert "VERSION='0.83.1'" in candidates
          assert Path('assets/territorio-aml-beta.html').is_file()
          assert Path('assets/atlas-territory-communal-beta-0900.js').is_file()
          assert Path('assets/atlas-territory-communal-beta-0900.css').is_file()
          PY
          node --check atlas-release-guard.js
          node --check assets/atlas-ui-authority-0901.js
          node --check assets/atlas-universo-so-entity-explorer-0813.js
          node --check assets/atlas-universo-so-entity-explorer-0816.js
          node --check assets/atlas-universo-so-candidate-management-0820.js
          node tests/atlas-runtime-freeze-0712.mjs

      - name: Build canonical Atlas site
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_atlas_site.py --out _site
          test -s _site/index.html
          test -s _site/atlas-release.json
          test -s _site/atlas-release-guard.js
          test -s _site/atlas-runtime-current-01.js
          test -s _site/assets/atlas-ui-authority-0901.js
          test -s _site/assets/atlas-ui-authority-0901.css
          test -s _site/assets/atlas-universo-so-contact-osint-0840.js
          test -s _site/assets/territorio-aml-beta.html
          python3 - <<'PY'
          from pathlib import Path
          import json
          html=Path('_site/index.html').read_text()
          release=json.loads(Path('_site/atlas-release.json').read_text())
          assert release['release']=='0.90.1' and release['build']=='0901'
          assert 'data-aml-version="0.90.1"' in html
          assert 'data-aml-build="0901"' in html
          assert 'data-atlas-release="0.90.1"' in html
          assert '<title>ATLAS AML · v0.90.1</title>' in html
          assert 'atlas-release-guard.js?r=0901' in html
          assert 'atlas-runtime-current-01.js?r=0901' in html
          assert 'ATLAS AML · v0.70.5' not in html
          assert 'data-aml-version="0.70.5"' not in html
          PY
          for js in _site/atlas-runtime-current-*.js _site/atlas-module-current-*.js; do
            test -f "$js" || continue
            node --check "$js"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Atlas 0.90.1 and current UI authority
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          ok=0
          for attempt in $(seq 1 12); do
            stamp="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            html="$(curl -fsSL --retry 2 --max-time 20 "${base}/?atlas0901=${stamp}" || true)"
            release="$(curl -fsSL --retry 2 --max-time 20 "${base}/atlas-release.json?atlas0901=${stamp}" || true)"
            ui="$(curl -fsSL --retry 2 --max-time 20 "${base}/assets/atlas-ui-authority-0901.js?atlas0901=${stamp}" || true)"
            css="$(curl -fsSL --retry 2 --max-time 20 "${base}/assets/atlas-ui-authority-0901.css?atlas0901=${stamp}" || true)"
            if printf '%s' "$html" | grep -q 'data-aml-version="0.90.1"' \
              && printf '%s' "$html" | grep -q '<title>ATLAS AML · v0.90.1</title>' \
              && ! printf '%s' "$html" | grep -q 'data-aml-version="0.70.5"' \
              && printf '%s' "$release" | grep -q '"release": "0.90.1"' \
              && printf '%s' "$release" | grep -q '"build": "0901"' \
              && printf '%s' "$ui" | grep -q "RELEASE='0.90.1'" \
              && printf '%s' "$css" | grep -q 'data-atlas-release="0.90.1"'; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" -eq 1
          echo "ATLAS AML 0.90.1 live smoke OK: ${PAGE_URL}"
