name: Deploy ATLAS AML current

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-current
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate canonical source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-aml-version="0.70.5"' index.html
          grep -q 'data-aml-build="0705"' index.html
          grep -q '<title>ATLAS AML · v0.70.5</title>' index.html
          grep -q '"release": "0.70.5"' atlas-release.json
          grep -q '"build": "0705"' atlas-release.json
          grep -q '"release": "0.70.5"' atlas-runtime-manifest.json
          grep -q '"build": "0705"' atlas-runtime-manifest.json
          grep -q 'atlas-source-health-global-0694.js?v=0710-1' index.html
          grep -q 'atlas-universo-so-workbench-0700.js?v=0705-2' index.html
          ! grep -Eq 'atlas-universo-so-(0600|0610|0620|0630|0640)' index.html
          node --check atlas-release-guard.js
          node --check assets/atlas-source-health-global-0694.js
          node --check assets/atlas-universo-so-workbench-0700.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'tests/'
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q 'data-aml-version="0.70.5"' _site/index.html
          ! grep -Eq 'atlas-universo-so-(0600|0610|0620|0630|0640)' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
