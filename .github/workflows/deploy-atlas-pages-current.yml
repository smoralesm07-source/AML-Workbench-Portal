name: Deploy ATLAS AML current

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-current
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate v2 primary source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('atlas-release.json').read_text())
          runtime=json.loads(Path('atlas-runtime-manifest.json').read_text())
          build=json.loads(Path('build.json').read_text())
          rel=str(release['release']); bid=str(release['build'])
          assert runtime['release']==rel and str(runtime['build'])==bid
          assert build['app_version']==rel and str(build['build'])==bid
          assert release['deployment_policy']=='SINGLE_ACTIVE_RELEASE'
          for path in [
              'atlas-v2.html',
              'src/v2/atlas-v2-production-config.js',
              'src/v2/atlas-v2-core-auth.js',
              'src/v2/atlas-v2-core-auth.css',
              'src/v2/atlas-v2-data.js',
              'src/v2/atlas-v2-session.js',
              'src/v2/atlas-v2-access.js',
              'src/v2/atlas-v2-shell.js',
              'src/v2/atlas-v2-shell.css',
              'src/v2/atlas-v2-boot.js',
              'tools/build_atlas_v2_primary.py',
          ]:
              assert Path(path).is_file(), path
          html=Path('atlas-v2.html').read_text(encoding='utf-8')
          assert 'data-atlas-v2-primary="analytics"' in html
          assert 'atlas-v2-core-auth.js' in html
          assert 'ldmtlwzqaqmegedktlxr.supabase.co' in html
          assert 'bzqxvidggykkdouotylg.supabase.co' in html
          print(f'validated ATLAS v2 primary sources for {rel}/{bid}')
          PY
          for f in \
            src/v2/atlas-v2-production-config.js \
            src/v2/atlas-v2-core-auth.js \
            src/v2/atlas-v2-data.js \
            src/v2/atlas-v2-session.js \
            src/v2/atlas-v2-access.js \
            src/v2/atlas-v2-shell.js \
            src/v2/atlas-v2-boot.js \
            src/v2/entity360-adapter.js \
            src/v2/entity360-surface.js \
            src/v2/public-spend-surface.js \
            src/v2/relations-surface.js \
            src/v2/universes-adapter.js \
            src/v2/universes-surface.js \
            src/v2/territory-adapter.js \
            src/v2/territory-surface.js \
            src/v2/watch-adapter.js \
            src/v2/watch-surface.js; do
            node --check "$f"
          done

      - name: Build v2 primary site with explicit legacy rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_atlas_v2_primary.py --out _site
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('_site/atlas-release.json').read_text())
          report=json.loads(Path('_site/atlas-runtime-report.json').read_text())
          html=Path('_site/index.html').read_text(encoding='utf-8')
          legacy=Path('_site/legacy.html').read_text(encoding='utf-8')
          assert report['primary_runtime']=='ATLAS_V2_ANALYTICS'
          assert report['legacy_fallback']=='legacy.html'
          assert report['legacy_authority_active_on_primary'] is False
          assert 'data-atlas-v2-primary="analytics"' in html
          assert 'atlas-runtime-current-' not in html
          assert 'atlas-runtime-current-' in legacy
          assert Path('_site/v2/atlas-v2-core-auth.js').is_file()
          assert Path('_site/v2/entity360-surface.js').is_file()
          assert Path('_site/v2/public-spend-surface.js').is_file()
          assert Path('_site/v2/relations-surface.js').is_file()
          assert Path('_site/v2/universes-surface.js').is_file()
          assert Path('_site/v2/territory-surface.js').is_file()
          assert Path('_site/v2/watch-surface.js').is_file()
          print(f'built ATLAS v2 primary {release["release"]}/{release["build"]} with legacy rollback')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live v2 primary authority
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          expected=json.loads(Path('atlas-release.json').read_text())
          rel=str(expected['release']); bid=str(expected['build'])
          base=os.environ['PAGE_URL'].rstrip('/')
          sha=os.environ.get('GITHUB_SHA','unknown')
          def get(path, stamp):
              sep='&' if '?' in path else '?'
              req=urllib.request.Request(f'{base}{path}{sep}atlas={stamp}',headers={'Cache-Control':'no-cache','User-Agent':'ATLAS-v2-primary-smoke'})
              with urllib.request.urlopen(req,timeout=20) as r: return r.read().decode('utf-8','replace')
          last=None
          for n in range(1,13):
              try:
                  stamp=f'{sha}-{n}'
                  html=get('/',stamp)
                  report=json.loads(get('/atlas-runtime-report.json',stamp))
                  legacy=get('/legacy.html',stamp)
                  auth=get('/v2/atlas-v2-core-auth.js',stamp)
                  boot=get('/v2/atlas-v2-boot.js',stamp)
                  assert f'data-aml-version="{rel}"' in html
                  assert f'data-aml-build="{bid}"' in html
                  assert 'data-atlas-v2-primary="analytics"' in html
                  assert 'atlas-runtime-current-' not in html
                  assert report['primary_runtime']=='ATLAS_V2_ANALYTICS'
                  assert report['legacy_authority_active_on_primary'] is False
                  assert 'atlas-runtime-current-' in legacy
                  assert 'aml_allowed_users' in auth and 'signInWithOAuth' in auth
                  assert 'AtlasCoreSession.ready' in boot
                  print(json.dumps({'status':'ok','release':rel,'build':bid,'runtime':'ATLAS_V2_ANALYTICS','legacy_fallback':'legacy.html'}))
                  break
              except Exception as exc:
                  last=exc
                  print(f'live v2 smoke attempt {n}/12 not ready: {exc}')
                  if n<12: time.sleep(8)
          else:
              raise SystemExit(f'ATLAS v2 live smoke failed: {last}')
          PY
