name: Deploy ATLAS AML current

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-current
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate current release and Entidades route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          release=json.loads(Path('atlas-release.json').read_text())
          runtime=json.loads(Path('atlas-runtime-manifest.json').read_text())
          build=json.loads(Path('build.json').read_text())
          guard=Path('atlas-release-guard.js').read_text()
          route=Path('v0448-entity-route-authority.js').read_text()
          workspace=Path('v0447-entity-workspace.js').read_text()
          session=Path('v0442-session-stability.module.js').read_text()

          rel=str(release['release'])
          bid=str(release['build'])
          assert runtime['release']==rel and str(runtime['build'])==bid
          assert build['app_version']==rel and str(build['build'])==bid
          assert release['deployment_policy']=='SINGLE_ACTIVE_RELEASE'
          assert release['runtime_policy']=='CANONICAL_COMPILED_RUNTIME_ONLY'
          assert release['pages_artifact_policy']=='COMPILED_CURRENT_BUNDLES_ONLY'

          declared=[x['path'] for x in runtime['scripts']]
          for required in [
              'v0447-entity-workspace.js',
              'v0448-entity-route-authority.js',
              'v0442-session-stability.module.js',
              'assets/atlas-ui-authority-0901.js',
              'assets/atlas-osfl-economic-0950.js',
              'assets/atlas-sanctions-radiography-0960.js',
          ]:
              assert required in declared, required

          assert f"release:'{rel}',build:'{bid}'" in guard
          assert 'CLEAN_SEARCH_NO_PERSISTED_ENTITY360' in route
          assert 'cleanSearchOnEveryEntry:true' in route
          assert 'previousEntityCleared:true' in route
          assert "mode:'entities-clean-search'" in route
          assert 'ENTRY.load=entityLoad' in route
          assert "if (view === 'entities') return stableLoad" in session
          assert "ENTRY.load=loadWorkspace" in workspace
          print(f'validated ATLAS {rel} build {bid} with clean Entidades route')
          PY

          node --check atlas-release-guard.js
          node --check v0447-entity-workspace.js
          node --check v0448-entity-route-authority.js
          node --check v0449-entity-tax-docauth.js
          node --check v0442-session-stability.module.js

      - name: Build canonical Atlas site
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_atlas_site.py --out _site

          # Keep the current production hardening that retires the legacy data-audit
          # standalone and pins the OSFL recovery asset to its corrected cache key.
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('_site/index.html')
          html=p.read_text(encoding='utf-8')
          html=re.sub(r'\s*<link[^>]+href=["\']\./assets/atlas-data-audit\.css(?:\?[^"\']*)?["\'][^>]*>\s*', '\n', html, flags=re.I)
          html=re.sub(r'\s*<script[^>]+src=["\']\./assets/atlas-data-audit\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*', '\n', html, flags=re.I)
          html=re.sub(r'(\./assets/atlas-osfl-runtime-recovery-1001\.js)(?:\?[^"\']*)?', r'\1?v=1002-1', html, flags=re.I)
          p.write_text(html, encoding='utf-8')
          PY
          rm -f _site/assets/atlas-data-audit.js _site/assets/atlas-data-audit.css

          python3 - <<'PY'
          import json, re
          from pathlib import Path

          release=json.loads(Path('_site/atlas-release.json').read_text())
          rel=str(release['release'])
          bid=str(release['build'])
          html=Path('_site/index.html').read_text(encoding='utf-8')
          segments=sorted(Path('_site').glob('atlas-runtime-current-*.js'))
          assert segments, 'no compiled runtime segments'
          runtime='\n'.join(p.read_text(encoding='utf-8') for p in segments)

          assert f'data-aml-version="{rel}"' in html
          assert f'data-aml-build="{bid}"' in html
          assert f'data-atlas-release="{rel}"' in html
          assert f'<title>ATLAS AML · v{rel}</title>' in html
          assert f'atlas-release-guard.js?r={bid}' in html
          assert re.search(rf'atlas-runtime-current-\d+\.js\?r={re.escape(bid)}', html)

          # Regression guard for the reported Entidad 360 -> Entidades bug.
          assert 'CLEAN_SEARCH_NO_PERSISTED_ENTITY360' in runtime
          assert 'cleanSearchOnEveryEntry:true' in runtime
          assert 'previousEntityCleared:true' in runtime
          assert "mode:'entities-clean-search'" in runtime
          assert "if (view === 'entities') return stableLoad" in runtime

          assert '__ATLAS_OSFL_ECONOMIC_0950__' in runtime
          assert 'OSFL_GRAPHICS_FINAL_1001' in runtime
          assert 'SANCTIONS_RADIOGRAPHY_CURRENT_0960' in runtime or 'SANCTIONS_SPECTRUM_CURRENT_0940' in runtime
          assert 'atlas-data-audit.js' not in html
          assert 'atlas-data-audit.css' not in html
          print(f'built ATLAS {rel} build {bid}; clean Entidades regression guard passed')
          PY

          for js in _site/atlas-runtime-current-*.js _site/atlas-module-current-*.js; do
            test -f "$js" || continue
            node --check "$js"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live current release and Entidades clean entry
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          from pathlib import Path

          expected=json.loads(Path('atlas-release.json').read_text())
          rel=str(expected['release'])
          bid=str(expected['build'])
          base=os.environ['PAGE_URL'].rstrip('/')
          sha=os.environ.get('GITHUB_SHA','unknown')
          attempt=os.environ.get('GITHUB_RUN_ATTEMPT','1')

          def get(path, stamp):
              sep='&' if '?' in path else '?'
              url=f"{base}{path}{sep}atlas={stamp}"
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':f'ATLAS-live-smoke/{rel}'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  return response.read().decode('utf-8','replace')

          last_error=None
          for n in range(1,13):
              stamp=f'{sha}-{attempt}-{n}'
              try:
                  html=get('/',stamp)
                  live_release=json.loads(get('/atlas-release.json',stamp))
                  segment_names=sorted(set(re.findall(r'\.\/(atlas-runtime-current-\d+\.js)',html)))
                  if not segment_names:
                      raise AssertionError('no compiled runtime segments referenced by live index')
                  runtime='\n'.join(get('/'+name,stamp) for name in segment_names)

                  checks={
                      'html_version':f'data-aml-version="{rel}"' in html,
                      'html_build':f'data-aml-build="{bid}"' in html,
                      'html_title':f'<title>ATLAS AML · v{rel}</title>' in html,
                      'release_json':str(live_release.get('release'))==rel and str(live_release.get('build'))==bid,
                      'clean_policy':'CLEAN_SEARCH_NO_PERSISTED_ENTITY360' in runtime,
                      'clean_every_entry':'cleanSearchOnEveryEntry:true' in runtime,
                      'previous_entity_cleared':'previousEntityCleared:true' in runtime,
                      'clean_mode':"mode:'entities-clean-search'" in runtime,
                      'final_entity_route':"if (view === 'entities') return stableLoad" in runtime,
                  }
                  failed=[name for name,ok in checks.items() if not ok]
                  if failed:
                      raise AssertionError('failed checks: '+', '.join(failed))
                  print(json.dumps({'status':'ok','release':rel,'build':bid,'page_url':base,'segments':segment_names,'checks':checks},ensure_ascii=False))
                  break
              except Exception as exc:
                  last_error=exc
                  print(f'live smoke attempt {n}/12 not ready: {exc}')
                  if n<12:
                      time.sleep(8)
          else:
              raise SystemExit(f'ATLAS {rel} live smoke failed after 12 attempts: {last_error}')
          PY
