name: Deploy ATLAS AML current

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-current
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate freeze-safe source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('atlas-release.json').read_text())
          runtime=json.loads(Path('atlas-runtime-manifest.json').read_text())
          build=json.loads(Path('build.json').read_text())
          html=Path('index.html').read_text()
          health=Path('assets/atlas-source-health-global-0694.js').read_text()
          health_css=Path('assets/atlas-source-health-global-0694.css').read_text()
          recovery=Path('assets/atlas-operational-recovery-0704.js').read_text()
          entity=Path('assets/atlas-entity-explorer-0512.js').read_text()
          assert release['release']=='0.70.5' and release['build']=='0705'
          assert runtime['release']=='0.70.5' and runtime['build']=='0705'
          assert build['app_version']=='0.70.5' and build['build']=='0705'
          assert 'data-aml-version="0.70.5"' in html
          assert 'data-aml-build="0705"' in html
          assert 'atlas-universo-so-workbench-0700.js' in html
          assert 'atlas-source-health-global-0694.js?v=0713-auditbar1' in html
          assert 'atlas-source-health-global-0694.css?v=0713-auditbar1' in html
          assert 'data-aml-version="0.51.1"' not in html
          assert "atlasGlobalAuditHost','0713'" in health
          assert "h.hidden=true" in health
          assert 'new MutationObserver' not in health
          assert '[data-atlas-global-audit-host="0713"]' in health_css
          assert '[data-atlas-global-audit-fallback="1"]{display:none!important}' in health_css
          assert "VIEW_ENTITIES='entities'" in recovery
          assert 'ENTITY_EXPLORER_0512_CANONICAL_ROUTE' in recovery
          assert "ENTRY.load=async function atlasEntityExplorer0512Load(){await renderPrequery();};" in entity
          PY
          node --check atlas-release-guard.js
          node --check app.js
          node --check v0333-auth-preflight.js
          node --check v0422-auth-bootstrap-fix.js
          node --check atlas-current-ui.js
          node --check v019-live.js
          node --check assets/atlas-source-health-global-0694.js
          node --check assets/atlas-operational-recovery-0704.js
          node --check assets/atlas-universo-so-workbench-0700.js
          node --check assets/atlas-entity-explorer-0512.js
          node tests/atlas-runtime-freeze-0712.mjs

      - name: Build restored Atlas site
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_atlas_site.py --out _site
          test -s _site/index.html
          test -s _site/atlas-runtime-current.css
          test -s _site/atlas-runtime-current-01.js
          test -s _site/atlas-runtime-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          html=Path('_site/index.html').read_text()
          report=json.loads(Path('_site/atlas-runtime-report.json').read_text())
          bundles=sorted(Path('_site').glob('atlas-runtime-current-*.js'))
          joined='\n'.join(p.read_text(errors='ignore') for p in bundles)
          assert report['release']=='0.70.5' and report['build']=='0705'
          assert 'atlas-runtime-current-01.js?r=0705' in html
          assert 'atlas-runtime-critical.js' not in html
          assert 'atlas-runtime-loader.js' not in html
          assert 'function v019Shell' in joined
          assert 'AtlasCurrentUI' in joined
          assert 'ATLAS AML' in joined
          assert 'data-aml-version="0.51.1"' not in html
          PY
          for js in _site/atlas-runtime-current-*.js _site/atlas-module-current-*.js; do
            test -f "$js" || continue
            node --check "$js"
          done

      - name: Pin freeze-safe cache keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          html=p.read_text()
          html=html.replace('atlas-release-guard.js?r=0705','atlas-release-guard.js?r=0705-freeze0712')
          html=html.replace('atlas-theme-bootstrap.js?r=0705','atlas-theme-bootstrap.js?r=0705-freeze0712')
          html=html.replace('atlas-runtime-current.css?r=0705','atlas-runtime-current.css?r=0705-freeze0712')
          for i in range(1,10):
              html=html.replace(f'atlas-runtime-current-{i:02d}.js?r=0705',f'atlas-runtime-current-{i:02d}.js?r=0705-freeze0712')
              html=html.replace(f'atlas-module-current-{i:02d}.js?r=0705',f'atlas-module-current-{i:02d}.js?r=0705-freeze0712')
          for old in ('0711-1','0712-freeze1','0705-1'):
              html=html.replace(f'atlas-source-health-global-0694.js?v={old}','atlas-source-health-global-0694.js?v=0713-auditbar1')
              html=html.replace(f'atlas-source-health-global-0694.css?v={old}','atlas-source-health-global-0694.css?v=0713-auditbar1')
          for old in ('0705-recovery1','0705-1','0712-freeze1'):
              html=html.replace(f'atlas-operational-recovery-0704.js?v={old}','atlas-operational-recovery-0704.js?v=0714-entities1')
          p.write_text(html)
          assert 'atlas-release-guard.js?r=0705-freeze0712' in html
          assert 'atlas-runtime-current-01.js?r=0705-freeze0712' in html
          assert 'atlas-source-health-global-0694.js?v=0713-auditbar1' in html
          assert 'atlas-source-health-global-0694.css?v=0713-auditbar1' in html
          assert 'atlas-operational-recovery-0704.js?v=0714-entities1' in html
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live freeze-safe recovery
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          base="${PAGE_URL%/}"
          ok=0
          for attempt in $(seq 1 12); do
            stamp="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            html="$(curl -fsSL --retry 2 --max-time 20 "${base}/?atlas_entities_fix=${stamp}" || true)"
            manifest="$(curl -fsSL --retry 2 --max-time 20 "${base}/atlas-release.json?atlas_entities_fix=${stamp}" || true)"
            guard="$(curl -fsSL --retry 2 --max-time 20 "${base}/atlas-release-guard.js?atlas_entities_fix=${stamp}" || true)"
            health="$(curl -fsSL --retry 2 --max-time 20 "${base}/assets/atlas-source-health-global-0694.js?atlas_entities_fix=${stamp}" || true)"
            health_css="$(curl -fsSL --retry 2 --max-time 20 "${base}/assets/atlas-source-health-global-0694.css?atlas_entities_fix=${stamp}" || true)"
            recovery="$(curl -fsSL --retry 2 --max-time 20 "${base}/assets/atlas-operational-recovery-0704.js?atlas_entities_fix=${stamp}" || true)"
            entity="$(curl -fsSL --retry 2 --max-time 20 "${base}/assets/atlas-entity-explorer-0512.js?atlas_entities_fix=${stamp}" || true)"
            if printf '%s' "$html" | grep -q 'data-aml-version="0.70.5"' \
              && printf '%s' "$html" | grep -q 'data-aml-build="0705"' \
              && printf '%s' "$html" | grep -q 'atlas-release-guard.js?r=0705-freeze0712' \
              && printf '%s' "$html" | grep -q 'atlas-runtime-current-01.js?r=0705-freeze0712' \
              && printf '%s' "$html" | grep -q 'atlas-source-health-global-0694.js?v=0713-auditbar1' \
              && printf '%s' "$html" | grep -q 'atlas-source-health-global-0694.css?v=0713-auditbar1' \
              && printf '%s' "$html" | grep -q 'atlas-operational-recovery-0704.js?v=0714-entities1' \
              && printf '%s' "$manifest" | grep -q '"release": "0.70.5"' \
              && printf '%s' "$guard" | grep -q 'NO_GLOBAL_CHILD_MUTATION_OBSERVER' \
              && printf '%s' "$health" | grep -q 'NO_GLOBAL_DOM_OBSERVER' \
              && printf '%s' "$health" | grep -q "atlasGlobalAuditHost','0713'" \
              && printf '%s' "$health_css" | grep -q 'data-atlas-global-audit-host="0713"' \
              && printf '%s' "$recovery" | grep -q 'ENTITY_EXPLORER_0512_CANONICAL_ROUTE' \
              && printf '%s' "$entity" | grep -q 'atlasEntityExplorer0512Load'; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
          ! printf '%s' "$health" | grep -q 'new MutationObserver'
          ! printf '%s' "$guard" | grep -q 'new MutationObserver(queueApply).observe(document.documentElement'
          ! printf '%s' "$recovery" | grep -q 'createTreeWalker(document.body'
          echo "ATLAS Entidades canonical route live smoke OK: release=0.70.5 build=0705 url=${PAGE_URL}"
