name: Deploy ATLAS AML v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-v2-live-authority
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate ATLAS v2 and Entity 360 expediente authority
        run: |
          set -euo pipefail
          node --check src/v2/atlas-v2-boot.js
          node --check src/v2/explore-surface.js
          node --check src/v2/entity360-surface.js
          node --check src/v2/entity360-parity-surface.js
          node --check src/v2/entity360-expediente-surface.js
          node tests/atlas-v2-explore-live.mjs
          node tests/atlas-v2-entity360-analytics.mjs
          python3 -m py_compile tools/build_atlas_v2_primary.py
          grep -Fq "ASSET_REVISION = 'entity360-expediente-1'" src/v2/atlas-v2-boot.js
          grep -Fq "'entity360-expediente-surface.js'" src/v2/atlas-v2-boot.js
          grep -Fq 'ENTITY360_EXPEDIENTE_EXECUTIVE_V2_20260908' src/v2/entity360-expediente-surface.js
          grep -Fq "registerSurface('entidad'" src/v2/entity360-expediente-surface.js
          grep -Fq '__ATLAS_V2_ENTITY360_EXPEDIENTE__' src/v2/entity360-expediente-surface.js
          grep -Fq '.e36x{' src/v2/entity360-expediente-surface.css
          grep -Fq '.e36x-hero' src/v2/entity360-expediente-surface.css
          grep -Fq 'e=e360-expediente-1' atlas-v2.html

      - name: Build production artifact
        run: |
          set -euo pipefail
          python3 tools/build_atlas_v2_primary.py --out _site
          test -f _site/v2/entity360-expediente-surface.js
          test -f _site/v2/entity360-expediente-surface.css
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('_site')
          p=json.loads((root/'atlas-v2-release.json').read_text())
          l=json.loads((root/'atlas-release.json').read_text())
          r=json.loads((root/'atlas-runtime-report.json').read_text())
          html=(root/'index.html').read_text()
          legacy=(root/'legacy.html').read_text()
          boot=(root/'v2/atlas-v2-boot.js').read_text()
          explore=(root/'v2/explore-surface.js').read_text()
          parity=(root/'v2/entity360-parity-surface.js').read_text()
          expediente=(root/'v2/entity360-expediente-surface.js').read_text()
          expediente_css=(root/'v2/entity360-expediente-surface.css').read_text()
          authority='ENTITY360_EXPEDIENTE_EXECUTIVE_V2_20260908'
          assert r['release']=='2.0.2' and r['build']=='2002'
          assert r['v2_version']=='v2-primary-5'
          assert r['v2_surface_version']=='v2-primary-7-executive-pulse-entity360-classic-1'
          assert r['v2_explore_design']=='EXECUTIVE_PULSE_V2'
          assert r['v2_entity_search']=='IDENTITY_TIERED_DIGITAL_PRESS'
          assert r['v2_entity360_authority']==authority
          assert r['v2_entity360_dossier']==authority
          assert r['v2_entity360_design']=='EXECUTIVE_360_DOSSIER'
          assert r['v2_entity360_historical_parity']=='ENTITY360_LEGACY_PARITY_V2'
          assert r['v2_entity360_asset_revision']=='entity360-expediente-1'
          assert r['legacy_fallback_policy']=='FROZEN_ROLLBACK_ONLY'
          assert r['legacy_authority_active_on_primary'] is False
          assert f'data-aml-version="{p["release"]}"' in html and f'data-aml-build="{p["build"]}"' in html
          assert 'e=e360-expediente-1' in html
          assert 'atlas-runtime-current-' not in html
          assert f'data-aml-version="{l["release"]}"' in legacy and 'atlas-runtime-current-' in legacy
          assert "'entity360-surface.js'" in boot
          assert "'entity360-parity-surface.js'" in boot
          assert "'entity360-expediente-surface.js'" in boot
          assert boot.index("'entity360-surface.js'") < boot.index("'entity360-parity-surface.js'") < boot.index("'entity360-expediente-surface.js'")
          assert all(x in explore for x in ['EXECUTIVE_PULSE_V2','YTD_DASHED_NO_FABRICATION','rosYearChart','attentionTable','UAF ↔ SII'])
          assert all(x in parity for x in ['SIX_LENS_NATIVE_V2','ENTITY360_LEGACY_PARITY_V2'])
          assert all(x in expediente for x in [authority,"registerSurface('entidad'",'__ATLAS_V2_ENTITY360_EXPEDIENTE__'])
          assert all(x in expediente_css for x in ['.e36x{','.e36x-hero','.e36x-tabs','.e36x-timeline'])
          print('ATLAS 2.0.2 artifact + Entity 360 expediente authority: OK')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Entity 360 expediente authority
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['PAGE_URL'].rstrip('/')
          sha=os.environ.get('GITHUB_SHA','unknown')
          surface='v2-primary-7-executive-pulse-entity360-classic-1'
          authority='ENTITY360_EXPEDIENTE_EXECUTIVE_V2_20260908'
          def get(path, stamp):
              sep='&' if '?' in path else '?'
              req=urllib.request.Request(
                  f'{base}{path}{sep}atlas={stamp}',
                  headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'ATLAS-v2-entity360-live-authority'},
              )
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.read().decode('utf-8','replace')
          last=None
          for n in range(1,13):
              try:
                  stamp=f'{sha}-{n}'
                  html=get('/',stamp)
                  report=json.loads(get('/atlas-runtime-report.json',stamp))
                  boot=get(f'/v2/atlas-v2-boot.js?v={surface}&r=entity360-expediente-1',stamp)
                  expediente=get(f'/v2/entity360-expediente-surface.js?v={surface}&r=entity360-expediente-1',stamp)
                  expediente_css=get('/v2/entity360-expediente-surface.css?v=entity360-expediente-20260908-1',stamp)
                  assert 'e=e360-expediente-1' in html
                  assert report['v2_entity360_authority']==authority
                  assert report['v2_entity360_design']=='EXECUTIVE_360_DOSSIER'
                  assert report['v2_entity360_asset_revision']=='entity360-expediente-1'
                  assert "ASSET_REVISION = 'entity360-expediente-1'" in boot
                  assert "'entity360-expediente-surface.js'" in boot
                  assert authority in expediente
                  assert "registerSurface('entidad'" in expediente
                  assert '__ATLAS_V2_ENTITY360_EXPEDIENTE__' in expediente
                  assert '.e36x{' in expediente_css and '.e36x-hero' in expediente_css
                  print(json.dumps({'status':'ok','entity360':authority,'revision':'entity360-expediente-1'}))
                  break
              except Exception as exc:
                  last=exc
                  print(f'live smoke attempt {n}/12 not ready: {exc}')
                  if n<12: time.sleep(8)
          else:
              raise SystemExit(f'ATLAS v2 Entity 360 expediente live smoke failed: {last}')
          PY
