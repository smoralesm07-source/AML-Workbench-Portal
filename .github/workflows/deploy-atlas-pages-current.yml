name: Deploy ATLAS AML v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate 2.0.2 release and frozen rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('atlas-v2-release.json').read_text())
          l=json.loads(Path('atlas-release.json').read_text())
          runtime=json.loads(Path('atlas-runtime-manifest.json').read_text())
          build=json.loads(Path('build.json').read_text())
          assert p['release']=='2.0.2' and str(p['build'])=='2002'
          assert p['runtime']=='ATLAS_V2_ANALYTICS'
          assert p['visual_navigation']=='INTERACTIVE_FIRST'
          assert p['entity_search']=='RUT_NAME_UAF_PRESS'
          assert runtime['release']==l['release']==build['app_version']
          assert str(runtime['build'])==str(l['build'])==str(build['build'])
          assert str(p['legacy_fallback']['release'])==str(l['release'])
          assert str(p['legacy_fallback']['build'])==str(l['build'])
          assert p['legacy_fallback']['authority_active_on_primary'] is False
          for path in [
            'atlas-v2.html','src/v2/atlas-v2-boot.js','src/v2/atlas-v2-viz.js','src/v2/atlas-v2-viz.css',
            'src/v2/entity-search-adapter.js','src/v2/explore-surface.js','src/v2/entity360-adapter.js',
            'src/v2/entity360-surface.js','tools/build_atlas_v2_primary.py'
          ]: assert Path(path).is_file(), path
          html=Path('atlas-v2.html').read_text()
          assert 'data-atlas-v2-primary="analytics"' in html and 'v2-primary-4' in html
          assert './v2/atlas-v2-viz.css?v=v2-primary-4-viz1' in html
          boot=Path('src/v2/atlas-v2-boot.js').read_text()
          assert "STRUCTURAL_VERSION = 'v2-primary-4'" in boot
          print('ATLAS 2.0.2 release/cache/visual-style authority: OK')
          PY
          for f in \
            src/v2/atlas-v2-production-config.js src/v2/atlas-v2-health.js src/v2/atlas-v2-core-auth.js \
            src/v2/atlas-v2-data.js src/v2/atlas-v2-session.js src/v2/atlas-v2-access.js src/v2/atlas-v2-shell.js \
            src/v2/atlas-v2-boot.js src/v2/atlas-v2-viz.js src/v2/entity-search-adapter.js src/v2/explore-surface.js \
            src/v2/entity360-adapter.js src/v2/entity360-surface.js src/v2/public-spend-surface.js \
            src/v2/relations-surface.js src/v2/universes-adapter.js src/v2/universes-surface.js \
            src/v2/territory-adapter.js src/v2/territory-surface.js src/v2/watch-adapter.js src/v2/watch-surface.js; do node --check "$f"; done

      - name: Build ATLAS v2 primary with explicit legacy rollback
        run: |
          set -euo pipefail
          python3 tools/build_atlas_v2_primary.py --out _site
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('_site')
          p=json.loads((root/'atlas-v2-release.json').read_text())
          l=json.loads((root/'atlas-release.json').read_text())
          r=json.loads((root/'atlas-runtime-report.json').read_text())
          html=(root/'index.html').read_text()
          legacy=(root/'legacy.html').read_text()
          assert r['release']=='2.0.2' and r['build']=='2002'
          assert r['v2_explore_mode']=='LIVE_PULSE_VISUAL'
          assert r['v2_visual_navigation']=='INTERACTIVE_FIRST'
          assert r['v2_entity_search']=='RUT_NAME_UAF_PRESS'
          assert r['v2_version']=='v2-primary-4'
          assert r['legacy_fallback_policy']=='FROZEN_ROLLBACK_ONLY'
          assert r['legacy_authority_active_on_primary'] is False
          assert f'data-aml-version="{p["release"]}"' in html and f'data-aml-build="{p["build"]}"' in html
          assert 'v2-primary-4' in html
          assert './v2/atlas-v2-viz.css?v=v2-primary-4-viz1' in html
          assert 'atlas-runtime-current-' not in html
          assert f'data-aml-version="{l["release"]}"' in legacy and 'atlas-runtime-current-' in legacy
          for path in ['v2/atlas-v2-viz.js','v2/atlas-v2-viz.css','v2/entity-search-adapter.js','v2/explore-surface.js','v2/entity360-surface.js']:
              assert (root/path).is_file(), path
          print('ATLAS 2.0.2 fresh visual-style artifact + frozen rollback: OK')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live ATLAS 2.0.2 fresh visual/search authority and rollback
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          p=json.loads(Path('atlas-v2-release.json').read_text())
          l=json.loads(Path('atlas-release.json').read_text())
          rel=str(p['release']); bid=str(p['build'])
          lrel=str(l['release']); lbid=str(l['build'])
          base=os.environ['PAGE_URL'].rstrip('/')
          sha=os.environ.get('GITHUB_SHA','unknown')
          asset='v2-primary-4'
          viz_style='v2-primary-4-viz1'
          def get(path, stamp):
              sep='&' if '?' in path else '?'
              req=urllib.request.Request(f'{base}{path}{sep}atlas={stamp}',headers={'Cache-Control':'no-cache','User-Agent':'ATLAS-2.0.2-live-smoke'})
              with urllib.request.urlopen(req,timeout=20) as r: return r.read().decode('utf-8','replace')
          last=None
          for n in range(1,13):
              try:
                  stamp=f'{sha}-{n}'
                  html=get('/',stamp)
                  live=json.loads(get('/atlas-v2-release.json',stamp))
                  report=json.loads(get('/atlas-runtime-report.json',stamp))
                  legacy=get('/legacy.html',stamp)
                  boot=get(f'/v2/atlas-v2-boot.js?v={asset}',stamp)
                  explore=get(f'/v2/explore-surface.js?v={asset}',stamp)
                  entity=get(f'/v2/entity360-surface.js?v={asset}',stamp)
                  search=get(f'/v2/entity-search-adapter.js?v={asset}',stamp)
                  viz=get(f'/v2/atlas-v2-viz.js?v={asset}',stamp)
                  viz_css=get(f'/v2/atlas-v2-viz.css?v={viz_style}',stamp)
                  assert live['release']==rel and str(live['build'])==bid
                  assert live['visual_navigation']=='INTERACTIVE_FIRST' and live['entity_search']=='RUT_NAME_UAF_PRESS'
                  assert f'data-aml-version="{rel}"' in html and f'data-aml-build="{bid}"' in html and asset in html
                  assert f'./v2/atlas-v2-viz.css?v={viz_style}' in html
                  assert 'atlas-runtime-current-' not in html
                  assert report['release']==rel and report['build']==bid and report['v2_version']==asset
                  assert report['v2_explore_mode']=='LIVE_PULSE_VISUAL'
                  assert report['v2_visual_navigation']=='INTERACTIVE_FIRST'
                  assert report['v2_entity_search']=='RUT_NAME_UAF_PRESS'
                  assert f'data-aml-version="{lrel}"' in legacy and f'data-aml-build="{lbid}"' in legacy and 'atlas-runtime-current-' in legacy
                  assert "STRUCTURAL_VERSION = 'v2-primary-4'" in boot
                  assert 'atlas-v2-viz.js' in boot and 'entity-search-adapter.js' in boot
                  assert 'AtlasV2Viz.horizontalBars' in explore and 'AtlasV2Viz.segmented' in explore
                  assert 'Radar Prensa' in entity and 'AtlasV2EntitySearch.search' in entity
                  assert 'ATLAS_ENTITY_SEARCH_V2' in search and "operation: 'entity_search'" in search
                  assert all(x in viz for x in ['horizontalBars','lineChart','segmented'])
                  assert all(x in viz_css for x in ['.atlas-v2-viz-bar-fill','.atlas-v2-viz-segment-track','.atlas-v2-viz-legend-item'])
                  print(json.dumps({'status':'ok','release':rel,'build':bid,'asset':asset,'viz_style':viz_style,'visual':'INTERACTIVE_FIRST','entity_search':'RUT_NAME_UAF_PRESS','legacy_release':lrel,'legacy_build':lbid}))
                  break
              except Exception as exc:
                  last=exc
                  print(f'live smoke attempt {n}/12 not ready: {exc}')
                  if n<12: time.sleep(8)
          else:
              raise SystemExit(f'ATLAS 2.0.2 live smoke failed: {last}')
          PY