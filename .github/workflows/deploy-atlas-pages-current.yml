name: Deploy ATLAS AML current

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-current
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate release and v2 source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('atlas-release.json').read_text())
          runtime=json.loads(Path('atlas-runtime-manifest.json').read_text())
          build=json.loads(Path('build.json').read_text())
          rel=str(release['release']); bid=str(release['build'])
          assert runtime['release']==rel and str(runtime['build'])==bid
          assert build['app_version']==rel and str(build['build'])==bid
          assert release['deployment_policy']=='SINGLE_ACTIVE_RELEASE'
          assert release['runtime_policy']=='CANONICAL_COMPILED_RUNTIME_ONLY'
          assert release['pages_artifact_policy']=='COMPILED_CURRENT_BUNDLES_ONLY'
          for path in [
              'src/v2/atlas-v2-production-config.js',
              'src/v2/atlas-v2-data.js',
              'src/v2/atlas-v2-session.js',
              'src/v2/public-spend-adapter.js',
              'src/v2/public-spend-route-bridge.js',
              'src/v2/public-spend-adapter.css',
          ]:
              assert Path(path).is_file(), path
          print(f'validated ATLAS {rel} build {bid}; v2 production assets present')
          PY
          node --check src/v2/atlas-v2-production-config.js
          node --check src/v2/atlas-v2-data.js
          node --check src/v2/atlas-v2-session.js
          node --check src/v2/public-spend-adapter.js
          node --check src/v2/public-spend-route-bridge.js

      - name: Build canonical ATLAS v2 cutover site
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_atlas_v2_cutover.py --out _site
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('_site/atlas-release.json').read_text())
          html=Path('_site/index.html').read_text(encoding='utf-8')
          assert 'data-atlas-v2-cutover="public-spend"' in html
          assert './v2/atlas-v2-production-config.js?v=v2-cutover-1' in html
          assert './v2/public-spend-adapter.js?v=v2-cutover-1' in html
          assert './v2/public-spend-route-bridge.js?v=v2-cutover-1' in html
          assert 'ARCHITECTURE_V2' in Path('_site/atlas-runtime-report.json').read_text()
          assert 'BACKEND_READ_MODELS' in Path('_site/atlas-runtime-report.json').read_text()
          assert 'atlas-public-spend-route-authority-0578.js' not in html
          assert 'atlas-gasto-publico-1000.js' not in html
          assert Path('_site/v2/atlas-v2-production-config.js').is_file()
          assert Path('_site/v2/public-spend-adapter.js').is_file()
          assert Path('_site/v2/public-spend-route-bridge.js').is_file()
          print(f'built canonical ATLAS v2 cutover for {release["release"]}/{release["build"]}')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live v2 cutover
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          expected=json.loads(Path('atlas-release.json').read_text())
          rel=str(expected['release']); bid=str(expected['build'])
          base=os.environ['PAGE_URL'].rstrip('/')
          sha=os.environ.get('GITHUB_SHA','unknown'); attempt=os.environ.get('GITHUB_RUN_ATTEMPT','1')
          def get(path, stamp):
              sep='&' if '?' in path else '?'
              req=urllib.request.Request(f'{base}{path}{sep}atlas={stamp}',headers={'Cache-Control':'no-cache','User-Agent':f'ATLAS-v2-smoke/{rel}'})
              with urllib.request.urlopen(req,timeout=20) as r: return r.read().decode('utf-8','replace')
          last=None
          for n in range(1,13):
              try:
                  stamp=f'{sha}-{attempt}-{n}'
                  html=get('/',stamp)
                  assert f'data-aml-version="{rel}"' in html
                  assert f'data-aml-build="{bid}"' in html
                  assert 'data-atlas-v2-cutover="public-spend"' in html
                  assert './v2/atlas-v2-production-config.js?v=v2-cutover-1' in html
                  assert './v2/public-spend-adapter.js?v=v2-cutover-1' in html
                  assert './v2/public-spend-route-bridge.js?v=v2-cutover-1' in html
                  cfg=get('/v2/atlas-v2-production-config.js',stamp)
                  adapter=get('/v2/public-spend-adapter.js',stamp)
                  bridge=get('/v2/public-spend-route-bridge.js',stamp)
                  assert '__ATLAS_V2_PUBLIC_SPEND_CUTOVER__ = true' in cfg
                  assert '__ATLAS_V2_PUBLIC_SPEND_CUTOVER__ === true' in adapter
                  assert '__ATLAS_V2_PUBLIC_SPEND_CUTOVER__ === true' in bridge
                  assert 'v2-preview' not in adapter and 'v2-preview' not in bridge
                  print(json.dumps({'status':'ok','release':rel,'build':bid,'page_url':base,'v2_cutover':True}))
                  break
              except Exception as exc:
                  last=exc
                  print(f'live v2 smoke attempt {n}/12 not ready: {exc}')
                  if n<12: time.sleep(8)
          else:
              raise SystemExit(f'ATLAS v2 live smoke failed: {last}')
          PY
