name: Deploy ATLAS AML current

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-current
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate recovery source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('atlas-release.json').read_text())
          runtime=json.loads(Path('atlas-runtime-manifest.json').read_text())
          build=json.loads(Path('build.json').read_text())
          html=Path('index.html').read_text()
          assert release['release']=='0.70.5' and release['build']=='0705'
          assert runtime['release']=='0.70.5' and runtime['build']=='0705'
          assert build['app_version']=='0.70.5' and build['build']=='0705'
          assert 'data-aml-version="0.70.5"' in html
          assert 'data-aml-build="0705"' in html
          assert 'atlas-universo-so-workbench-0700.js?v=0705-recovery1' in html
          for legacy in ('atlas-universo-so-0600.js','atlas-universo-so-0610.js','atlas-universo-so-0620.js','atlas-universo-so-0630.js','atlas-universo-so-0640.js'):
              assert legacy not in html
          assert 'data-aml-version="0.51.1"' not in html
          PY
          node --check app.js
          node --check v0333-auth-preflight.js
          node --check v0422-auth-bootstrap-fix.js
          node --check atlas-current-ui.js
          node --check v019-live.js
          node --check assets/atlas-universo-so-workbench-0700.js

      - name: Build restored Atlas site
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_atlas_site.py --out _site
          test -s _site/index.html
          test -s _site/atlas-runtime-current.css
          test -s _site/atlas-runtime-current-01.js
          test -s _site/atlas-runtime-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          html=Path('_site/index.html').read_text()
          report=json.loads(Path('_site/atlas-runtime-report.json').read_text())
          bundles=sorted(Path('_site').glob('atlas-runtime-current-*.js'))
          modules=sorted(Path('_site').glob('atlas-module-current-*.js'))
          joined='\n'.join(p.read_text(errors='ignore') for p in bundles)
          assert report['release']=='0.70.5' and report['build']=='0705'
          assert 'atlas-runtime-current-01.js?r=0705' in html
          assert 'atlas-runtime-critical.js' not in html
          assert 'atlas-runtime-loader.js' not in html
          assert 'function v019Shell' in joined
          assert 'AtlasCurrentUI' in joined
          assert 'ATLAS AML' in joined
          assert 'data-aml-version="0.51.1"' not in html
          print('ATLAS recovery bundles:')
          for p in [*bundles,*modules]: print(f'  {p.name}: {p.stat().st_size/1024:.1f} KiB')
          PY
          for js in _site/atlas-runtime-current-*.js _site/atlas-module-current-*.js; do
            test -f "$js" || continue
            node --check "$js"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live recovery
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          base="${PAGE_URL%/}"
          ok=0
          for attempt in $(seq 1 12); do
            stamp="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            html="$(curl -fsSL --retry 2 --max-time 20 "${base}/?atlas_recovery=${stamp}" || true)"
            manifest="$(curl -fsSL --retry 2 --max-time 20 "${base}/atlas-release.json?atlas_recovery=${stamp}" || true)"
            report="$(curl -fsSL --retry 2 --max-time 20 "${base}/atlas-runtime-report.json?atlas_recovery=${stamp}" || true)"
            if printf '%s' "$html" | grep -q 'data-aml-version="0.70.5"' \
              && printf '%s' "$html" | grep -q 'data-aml-build="0705"' \
              && printf '%s' "$html" | grep -q 'atlas-runtime-current-01.js?r=0705' \
              && printf '%s' "$manifest" | grep -q '"release": "0.70.5"' \
              && printf '%s' "$report" | grep -q '"publish_mode": "COMPILED_BUNDLES_ONLY"'; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
          ! printf '%s' "$html" | grep -Eq 'atlas-runtime-critical|atlas-runtime-loader|data-aml-version="0\.51\.1"|data-aml-build="0511"'
          echo "ATLAS recovery live smoke OK: release=0.70.5 build=0705 url=${PAGE_URL}"
