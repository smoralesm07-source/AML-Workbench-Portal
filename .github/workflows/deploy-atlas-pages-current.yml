name: Deploy ATLAS AML v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate executive Explore, recovered Entity 360 and frozen rollback
        run: |
          set -euo pipefail
          node --check src/v2/atlas-v2-boot.js
          node --check src/v2/explore-surface.js
          node --check src/v2/entity360-surface.js
          node --check src/v2/entity360-parity-surface.js
          node tests/atlas-v2-explore-live.mjs
          node tests/atlas-v2-entity360-analytics.mjs
          python3 -m py_compile tools/build_atlas_v2_primary.py

      - name: Build ATLAS v2 primary with explicit legacy rollback
        run: |
          set -euo pipefail
          python3 tools/build_atlas_v2_primary.py --out _site
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('_site')
          p=json.loads((root/'atlas-v2-release.json').read_text())
          l=json.loads((root/'atlas-release.json').read_text())
          r=json.loads((root/'atlas-runtime-report.json').read_text())
          html=(root/'index.html').read_text()
          legacy=(root/'legacy.html').read_text()
          boot=(root/'v2/atlas-v2-boot.js').read_text()
          explore=(root/'v2/explore-surface.js').read_text()
          parity=(root/'v2/entity360-parity-surface.js').read_text()
          assert r['release']=='2.0.2' and r['build']=='2002'
          assert r['v2_version']=='v2-primary-5'
          assert r['v2_surface_version']=='v2-primary-7-executive-pulse-entity360-classic-1'
          assert r['v2_explore_design']=='EXECUTIVE_PULSE_V2'
          assert r['v2_ros_2026_semantics']=='YTD_DASHED_NO_FABRICATION'
          assert r['v2_entity_search']=='IDENTITY_TIERED_DIGITAL_PRESS'
          assert r['v2_entity_intelligence']=='UAF_SII_REPORTING_SCREENING_DIGITAL'
          assert r['v2_entity360_authority']=='ENTITY360_LEGACY_PARITY_V2'
          assert r['v2_entity360_parity']=='SIX_LENS_NATIVE_V2'
          assert r['legacy_fallback_policy']=='FROZEN_ROLLBACK_ONLY'
          assert r['legacy_authority_active_on_primary'] is False
          assert f'data-aml-version="{p["release"]}"' in html and f'data-aml-build="{p["build"]}"' in html
          assert './v2/atlas-v2-boot.js?v=v2-primary-7-executive-pulse-entity360-classic-1' in html
          assert './v2/entity360-parity-surface.css?v=v2-primary-5-entity360-parity-1' in html
          assert 'entity360-parity-surface.js?v=' not in html
          assert 'atlas-runtime-current-' not in html
          assert f'data-aml-version="{l["release"]}"' in legacy and 'atlas-runtime-current-' in legacy
          assert "'entity360-surface.js'" in boot and "'entity360-parity-surface.js'" in boot
          assert boot.index("'entity360-surface.js'") < boot.index("'entity360-parity-surface.js'")
          assert all(x in explore for x in ['EXECUTIVE_PULSE_V2','YTD_DASHED_NO_FABRICATION','rosYearChart','attentionTable','UAF ↔ SII'])
          assert all(x in parity for x in ['SIX_LENS_NATIVE_V2','ENTITY360_LEGACY_PARITY_V2','e360p-identidad','e360p-caracterizacion','e360p-relaciones','e360p-contexto','e360p-senales','e360p-evidencia'])
          print('ATLAS 2.0.2 executive pulse artifact + recovered Entity 360 + frozen rollback: OK')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live ATLAS 2.0.2 executive pulse and recovered Entity 360
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          p=json.loads(Path('atlas-v2-release.json').read_text())
          l=json.loads(Path('atlas-release.json').read_text())
          rel=str(p['release']); bid=str(p['build'])
          lrel=str(l['release']); lbid=str(l['build'])
          base=os.environ['PAGE_URL'].rstrip('/')
          sha=os.environ.get('GITHUB_SHA','unknown')
          surface='v2-primary-7-executive-pulse-entity360-classic-1'
          parity_css_version='v2-primary-5-entity360-parity-1'
          def get(path, stamp):
              sep='&' if '?' in path else '?'
              req=urllib.request.Request(f'{base}{path}{sep}atlas={stamp}',headers={'Cache-Control':'no-cache','User-Agent':'ATLAS-2.0.2-executive-pulse-smoke'})
              with urllib.request.urlopen(req,timeout=20) as r: return r.read().decode('utf-8','replace')
          last=None
          for n in range(1,13):
              try:
                  stamp=f'{sha}-{n}'
                  html=get('/',stamp)
                  live=json.loads(get('/atlas-v2-release.json',stamp))
                  report=json.loads(get('/atlas-runtime-report.json',stamp))
                  legacy=get('/legacy.html',stamp)
                  boot=get(f'/v2/atlas-v2-boot.js?v={surface}',stamp)
                  explore=get(f'/v2/explore-surface.js?v={surface}',stamp)
                  explore_css=get(f'/v2/explore-surface.css?v={surface}',stamp)
                  entity=get(f'/v2/entity360-surface.js?v={surface}',stamp)
                  parity=get(f'/v2/entity360-parity-surface.js?v={surface}',stamp)
                  parity_css=get(f'/v2/entity360-parity-surface.css?v={parity_css_version}',stamp)
                  assert live['release']==rel and str(live['build'])==bid
                  assert f'data-aml-version="{rel}"' in html and f'data-aml-build="{bid}"' in html
                  assert f'./v2/atlas-v2-boot.js?v={surface}' in html
                  assert f'./v2/entity360-parity-surface.css?v={parity_css_version}' in html
                  assert 'entity360-parity-surface.js?v=' not in html
                  assert report['release']==rel and report['build']==bid
                  assert report['v2_surface_version']==surface
                  assert report['v2_explore_design']=='EXECUTIVE_PULSE_V2'
                  assert report['v2_entity360_authority']=='ENTITY360_LEGACY_PARITY_V2'
                  assert report['v2_entity360_parity']=='SIX_LENS_NATIVE_V2'
                  assert f'data-aml-version="{lrel}"' in legacy and f'data-aml-build="{lbid}"' in legacy and 'atlas-runtime-current-' in legacy
                  assert "SURFACE_VERSION = 'v2-primary-7-executive-pulse-entity360-classic-1'" in boot
                  assert boot.index("'entity360-surface.js'") < boot.index("'entity360-parity-surface.js'")
                  assert all(x in explore for x in ['EXECUTIVE_PULSE_V2','YTD_DASHED_NO_FABRICATION','Acumulado 2026','attentionTable','UAF ↔ SII'])
                  assert all(x in explore_css for x in ['.atlas-v2-exec-home','.atlas-v2-exec-search','.atlas-v2-ros-chart','.atlas-v2-attention-table'])
                  assert all(x in entity for x in ['Qué mirar primero','Línea de tiempo de hechos críticos','screeningPanel','reportingPanel'])
                  assert all(x in parity for x in ['SIX_LENS_NATIVE_V2','ENTITY360_LEGACY_PARITY_V2','e360p-identidad','e360p-caracterizacion','e360p-relaciones','e360p-contexto','e360p-senales','e360p-evidencia'])
                  assert all(x in parity_css for x in ['.e360p-hero','.e360p-lens-nav','.e360p-score-ring','.e360p-rail','.e360p-mark','.e360p-timeline'])
                  print(json.dumps({'status':'ok','release':rel,'build':bid,'surface':surface,'explore':'EXECUTIVE_PULSE_V2','entity360':'ENTITY360_LEGACY_PARITY_V2','legacy_release':lrel,'legacy_build':lbid}))
                  break
              except Exception as exc:
                  last=exc
                  print(f'live smoke attempt {n}/12 not ready: {exc}')
                  if n<12: time.sleep(8)
          else:
              raise SystemExit(f'ATLAS 2.0.2 executive pulse live smoke failed: {last}')
          PY
