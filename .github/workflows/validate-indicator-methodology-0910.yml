name: Validate indicator methodology 0910

on:
  pull_request:
    paths:
      - 'assets/atlas-indicator-methodology-0910.js'
      - 'assets/atlas-indicator-methodology-0910.css'
      - 'assets/atlas-operational-recovery-0704.js'
      - 'assets/territorio-igr-real-beta-v4.html'
      - 'data/atlas_indicator_methodology_v1.json'
      - 'docs/atlas-indicator-architecture-v1.md'
      - 'tests/atlas-indicator-methodology-0910.mjs'
      - '.github/workflows/validate-indicator-methodology-0910.yml'
  push:
    branches: [main]
    paths:
      - 'assets/atlas-indicator-methodology-0910.js'
      - 'assets/atlas-indicator-methodology-0910.css'
      - 'assets/atlas-operational-recovery-0704.js'
      - 'assets/territorio-igr-real-beta-v4.html'
      - 'data/atlas_indicator_methodology_v1.json'
      - 'docs/atlas-indicator-architecture-v1.md'
      - 'tests/atlas-indicator-methodology-0910.mjs'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/atlas-indicator-methodology-0910.mjs
