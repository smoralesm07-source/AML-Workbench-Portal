name: Validate Entity Explorer 0512

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and contract
        run: |
          node --check assets/atlas-entity-explorer-0512.js
          node tests/atlas-entity-explorer-0512.mjs
          grep -q 'atlas-entity-explorer-0512.js?v=0512-3' index.html
          grep -q 'atlas-entity-explorer-0512.css?v=0512-3' index.html
