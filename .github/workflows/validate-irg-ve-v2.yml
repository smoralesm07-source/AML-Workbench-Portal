name: Validate IRG V/E v2

on:
  push:
    branches: [main]
    paths:
      - 'assets/atlas-irg-ve-v2.module.js'
      - 'assets/atlas-irg-ve-v2.css'
      - 'assets/atlas-irg-refinement.js'
      - 'data/irg_ve_enrichment_v2.json'
      - 'docs/geographic-risk-methodology-v4-irg-ve2.md'
      - 'index.html'
      - '.github/workflows/validate-irg-ve-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime syntax and governed methodology
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/atlas-irg-ve-v2.module.js
          node --check assets/atlas-irg-refinement.js
          python -m json.tool data/irg_ve_enrichment_v2.json >/dev/null
          grep -q 'IRG-LAFT-0.33.0' assets/atlas-irg-ve-v2.module.js
          grep -q 'base_structural_vulnerability' data/irg_ve_enrichment_v2.json
          grep -q 'enr_chile_exposure' data/irg_ve_enrichment_v2.json
          grep -q 'icr_ros_convertibility' data/irg_ve_enrichment_v2.json
          grep -q 'gafilat_sector_materiality' data/irg_ve_enrichment_v2.json
          grep -q 'economic_materiality_sii' data/irg_ve_enrichment_v2.json
          grep -q 'atlas-irg-ve-v2.css?v=0459-1' index.html
          grep -q 'type="module" src="./assets/atlas-irg-ve-v2.module.js?v=0459-1"' index.html
          grep -q 'TOP_LEVEL_IRG_WEIGHTS_UNCHANGED_45_20_20_15' data/irg_ve_enrichment_v2.json
