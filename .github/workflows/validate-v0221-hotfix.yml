name: Validate v0.22.2 hotfix
on:
  pull_request:
    paths:
      - 'v0221-hotfix.js'
      - 'v0222-radar-hotfix.js'
      - 'index.html'
      - '.github/workflows/validate-v0221-hotfix.yml'
  push:
    branches: [main]
    paths:
      - 'v0221-hotfix.js'
      - 'v0222-radar-hotfix.js'
      - 'index.html'
      - '.github/workflows/validate-v0221-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check v0221-hotfix.js
          node --check v0222-radar-hotfix.js
      - name: Wiring
        run: |
          grep -q 'AML Analytical Workbench · v0.22.2' index.html
          grep -q 'v022-territory-risk.js?b=0222' index.html
          grep -q 'v0221-hotfix.js?b=0222' index.html
          grep -q 'v0222-radar-hotfix.js?b=0222' index.html
          grep -q 'Promise.allSettled(dbSpecs.map' v0221-hotfix.js
          grep -q 'Promise.allSettled(specs.map' v0222-radar-hotfix.js
          grep -q 'window.__AML_ACTIVE_VERSION__=V0222' v0222-radar-hotfix.js
          grep -q 'ausencia de dato no se interpreta como cero' v0222-radar-hotfix.js
          if grep -E 'onclick=|onchange=|style=' v0221-hotfix.js v0222-radar-hotfix.js; then
            echo 'CSP-incompatible inline handler/style found'
            exit 1
          fi
