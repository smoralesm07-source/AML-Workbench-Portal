name: Validate v0.25.0 active overlays
on:
  pull_request:
    paths:
      - 'v0221-hotfix.js'
      - 'v0222-radar-hotfix.js'
      - 'v023-ipa3-shadow.js'
      - 'v023-ipa3-shadow.css'
      - 'v024-dashboard-feedback.js'
      - 'v024-dashboard-feedback.css'
      - 'v025-territory-ipa.js'
      - 'v025-territory-ipa.css'
      - 'index.html'
      - '.github/workflows/validate-v0221-hotfix.yml'
  push:
    branches: [main]
    paths:
      - 'v0221-hotfix.js'
      - 'v0222-radar-hotfix.js'
      - 'v023-ipa3-shadow.js'
      - 'v023-ipa3-shadow.css'
      - 'v024-dashboard-feedback.js'
      - 'v024-dashboard-feedback.css'
      - 'v025-territory-ipa.js'
      - 'v025-territory-ipa.css'
      - 'index.html'
      - '.github/workflows/validate-v0221-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check v0221-hotfix.js
          node --check v0222-radar-hotfix.js
          node --check v023-ipa3-shadow.js
          node --check v024-dashboard-feedback.js
          node --check v025-territory-ipa.js
      - name: Wiring
        run: |
          grep -q 'AML Analytical Workbench · v0.25.0' index.html
          grep -q 'v022-territory-risk.js?b=0250' index.html
          grep -q 'v0222-radar-hotfix.js?b=0250' index.html
          grep -q 'v023-ipa3-shadow.css?b=0250' index.html
          grep -q 'v023-ipa3-shadow.js?b=0250' index.html
          grep -q 'v024-dashboard-feedback.css?b=0250' index.html
          grep -q 'v024-dashboard-feedback.js?b=0250' index.html
          grep -q 'v025-territory-ipa.css?b=0250' index.html
          grep -q 'v025-territory-ipa.js?b=0250' index.html
          grep -q "V024_CROSS_VIEW='aml_v024_uaf_cross_entity'" v024-dashboard-feedback.js
          grep -q "V025_IPA_VIEW='aml_v023_geo_ipa_region'" v025-territory-ipa.js
          grep -q 'ipa:15' v025-territory-ipa.js
          grep -q 'v025MarkTitle' v025-territory-ipa.js
          grep -q 'window.__AML_ACTIVE_VERSION__=V025' v025-territory-ipa.js
          if grep -E 'onclick=|onchange=|style=' v0221-hotfix.js v0222-radar-hotfix.js v023-ipa3-shadow.js v024-dashboard-feedback.js v025-territory-ipa.js; then
            echo 'CSP-incompatible inline handler/style found'
            exit 1
          fi
          if grep -E '\?b=(0211|0222|0230|0240)' index.html; then
            echo 'Stale asset cache-bust found'
            exit 1
          fi
