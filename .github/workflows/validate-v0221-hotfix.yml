name: Validate v0.29.0 active overlays
on:
  pull_request:
    paths:
      - 'v0221-hotfix.js'
      - 'v0222-radar-hotfix.js'
      - 'v023-ipa3-shadow.js'
      - 'v024-dashboard-feedback.js'
      - 'v0241-reconciliation-restore.js'
      - 'v025-territory-ipa.js'
      - 'v025-territory-ipa-hardening.js'
      - 'v026-territory-causal-profile.js'
      - 'v026-territory-profile-legend.js'
      - 'v027-model-consistency.js'
      - 'v027-source-null-hardening.js'
      - 'v028-ipa3-global.js'
      - 'v028-sanctions-ipa3.js'
      - 'v029-territory-analytics.js'
      - 'v029-territory-analytics.css'
      - 'index.html'
      - '.github/workflows/validate-v0221-hotfix.yml'
  push:
    branches: [main]
    paths:
      - 'v0221-hotfix.js'
      - 'v0222-radar-hotfix.js'
      - 'v023-ipa3-shadow.js'
      - 'v024-dashboard-feedback.js'
      - 'v0241-reconciliation-restore.js'
      - 'v025-territory-ipa.js'
      - 'v025-territory-ipa-hardening.js'
      - 'v026-territory-causal-profile.js'
      - 'v026-territory-profile-legend.js'
      - 'v027-model-consistency.js'
      - 'v027-source-null-hardening.js'
      - 'v028-ipa3-global.js'
      - 'v028-sanctions-ipa3.js'
      - 'v029-territory-analytics.js'
      - 'v029-territory-analytics.css'
      - 'index.html'
      - '.github/workflows/validate-v0221-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check v0221-hotfix.js
          node --check v0222-radar-hotfix.js
          node --check v023-ipa3-shadow.js
          node --check v024-dashboard-feedback.js
          node --check v0241-reconciliation-restore.js
          node --check v025-territory-ipa.js
          node --check v025-territory-ipa-hardening.js
          node --check v026-territory-causal-profile.js
          node --check v026-territory-profile-legend.js
          node --check v027-model-consistency.js
          node --check v027-source-null-hardening.js
          node --check v028-ipa3-global.js
          node --check v028-sanctions-ipa3.js
          node --check v029-territory-analytics.js
      - name: Wiring and interaction contract
        run: |
          grep -q 'AML Analytical Workbench · v0.29.0' index.html
          grep -q 'v029-territory-analytics.css?b=0290' index.html
          grep -q 'v029-territory-analytics.js?b=0290' index.html
          grep -q "V022_STATE.method='B'" v029-territory-analytics.js
          grep -q 'data-v029-filter' v029-territory-analytics.js
          grep -q 'data-v029-select' v029-territory-analytics.js
          grep -q 'v029UpdateMapFilter' v029-territory-analytics.js
          grep -q 'v029PhenomenaFor' v029-territory-analytics.js
          grep -q 'v029NarrativePanel' v029-territory-analytics.js
          grep -q 'window.AML_TERRITORY_ANALYTICS=' v029-territory-analytics.js
          if grep -E 'onclick=|onchange=|onmouseover=|style=' v029-territory-analytics.js; then
            echo 'CSP-incompatible inline handler/style found in v0.29.'
            exit 1
          fi
          if grep -E '\?b=(0211|0222|0230|0240|0241|0250|0260|0270|0271|0272|0280)' index.html; then
            echo 'Stale asset cache-bust found'
            exit 1
          fi
