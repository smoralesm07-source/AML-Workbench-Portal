name: Validate v0.33.4 active overlays
on:
  pull_request:
    paths: ['*.js','*.css','index.html','.github/workflows/validate-v0221-hotfix.yml']
  push:
    branches: [main]
    paths: ['*.js','*.css','index.html','.github/workflows/validate-v0221-hotfix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Active runtime syntax
        run: |
          for f in v0302-performance.js v0311-uaf-fallback.js v031-territory-cockpit.js v0312-territory-refinement.js v032-osfl-expert.js v0321-osfl-polish.js v0321-runtime-bootstrap.js v032-irg-territory.js v0331-runtime-bootstrap.js v0331-radar-layout.js v0332-radar-intelligence.js v0333-auth-preflight.js v0334-runtime-bootstrap.js; do node --check "$f"; done
      - name: Wiring, auth and interaction contract
        run: |
          python - <<'PY'
          import re,json
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          auth=Path('v0333-auth-preflight.js').read_text(encoding='utf-8')
          assert 'AML Analytical Workbench · v0.33.4' in html
          assert set(re.findall(r'\?b=(\d+)',html))=={'0334'}
          assert html.index('v0333-auth-preflight.js?b=0334') < html.index('app.js?b=0334')
          assert '<script type="module" src="./v0331-runtime-bootstrap.js' not in html
          assert html.rfind('v0334-runtime-bootstrap.js?b=0334') > html.rfind('v0332-radar-intelligence.js?b=0334')
          assert 'originalOnAuthStateChange' in auth and 'window.setTimeout' in auth
          assert 'clearPersistedSupabaseAuth' in auth
          expert=Path('v032-osfl-expert.js').read_text(encoding='utf-8')
          assert 'data-v032-ipa-open' in expert and 'v032BudgetExposure' in expert
          assert 'v030SyncMapAndCharts=function' in expert
          assert 'LOCAL_FALLBACK' in Path('v0311-uaf-fallback.js').read_text(encoding='utf-8')
          irg=Path('v032-irg-territory.js').read_text(encoding='utf-8')
          assert "const V032_WEIGHTS={vulnerability:0.45,density:0.20,gap:0.20,threat:0.15}" in irg
          cat=json.loads(Path('data/irg_sector_vulnerability_v1.json').read_text(encoding='utf-8'))
          assert len(cat['sectors'])==55
          PY
      - name: CSP-safe final layers
        run: |
          if grep -E 'onclick=|onchange=|onmouseover=|style=' v032-osfl-expert.js v0321-osfl-polish.js v032-irg-territory.js v0333-auth-preflight.js v0334-runtime-bootstrap.js; then exit 1; fi
