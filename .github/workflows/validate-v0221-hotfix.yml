name: Validate v0.23.0 IPA3 shadow
on:
  pull_request:
    paths:
      - 'v0221-hotfix.js'
      - 'v0222-radar-hotfix.js'
      - 'v023-ipa3-shadow.js'
      - 'v023-ipa3-shadow.css'
      - 'index.html'
      - '.github/workflows/validate-v0221-hotfix.yml'
  push:
    branches: [main]
    paths:
      - 'v0221-hotfix.js'
      - 'v0222-radar-hotfix.js'
      - 'v023-ipa3-shadow.js'
      - 'v023-ipa3-shadow.css'
      - 'index.html'
      - '.github/workflows/validate-v0221-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check v0221-hotfix.js
          node --check v0222-radar-hotfix.js
          node --check v023-ipa3-shadow.js
      - name: Wiring
        run: |
          grep -q 'AML Analytical Workbench · v0.23.0' index.html
          grep -q 'v022-territory-risk.js?b=0230' index.html
          grep -q 'v0222-radar-hotfix.js?b=0230' index.html
          grep -q 'v023-ipa3-shadow.css?b=0230' index.html
          grep -q 'v023-ipa3-shadow.js?b=0230' index.html
          grep -q "V023_SCORE_VIEW='aml_v_ipa3_entity_score_v0_3'" v023-ipa3-shadow.js
          grep -q "V023_MARK_VIEW='aml_v_ipa3_mark_scores_v0_3'" v023-ipa3-shadow.js
          grep -q 'experimental · no probabilidad LA/FT' v023-ipa3-shadow.js
          grep -q 'window.__AML_ACTIVE_VERSION__=V023' v023-ipa3-shadow.js
          if grep -E 'onclick=|onchange=|style=' v0221-hotfix.js v0222-radar-hotfix.js v023-ipa3-shadow.js; then
            echo 'CSP-incompatible inline handler/style found'
            exit 1
          fi
          if grep -E '\?b=(0211|0222)' index.html; then
            echo 'Stale asset cache-bust found'
            exit 1
          fi
