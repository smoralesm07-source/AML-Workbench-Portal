name: Validate RES Federated Entity Master 0640

on:
  pull_request:
    paths:
      - 'assets/atlas-entity-federation-0640.js'
      - 'assets/atlas-universo-so-0630.js'
      - 'sql/atlas_v0640_res_federated_entity_master.sql'
      - 'sql/atlas_v0650_sii_registry_entity_master.sql'
      - '.github/workflows/validate-res-federated-0640.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check assets/atlas-entity-federation-0640.js && node --check assets/atlas-universo-so-0630.js
      - name: Governance contract
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('assets/atlas-entity-federation-0640.js').read_text()
          hook=Path('assets/atlas-universo-so-0630.js').read_text()
          sql64=Path('sql/atlas_v0640_res_federated_entity_master.sql').read_text()
          sql65=Path('sql/atlas_v0650_sii_registry_entity_master.sql').read_text() if Path('sql/atlas_v0650_sii_registry_entity_master.sql').exists() else ''
          assert ("MASTER='aml_entity_master_v0553'" in js or "MASTER='aml_entity_master_v0650'" in js), 'federated master authority'
          for marker in ["BASE='aml_entities'","identityPolicy:'RUT_EXACTO_ONLY'","scoreMutation:false","s.view==='entities'"]:
              assert marker in js, marker
          assert 'atlas-entity-federation-0640.js?v=0640-1' in hook
          for marker in ['RES_RUT_CANONICO','RES_RUT_EXACTO_FORMA_SOCIETARIA','security_invoker=true','aml_entity_classification_override_v0620','refresh_aml_res_entity_bridge_v1']:
              assert marker in sql64, marker
          assert "company_code in ('EIRL','SpA','SRL')" in sql64
          assert "'fuentes',jsonb_build_array('RES')" in sql64
          if "MASTER='aml_entity_master_v0650'" in js:
              for marker in ['RUT_EXACTO_ONLY','candidate_use=SI','POTENTIAL_SO != LEGAL_BREACH']:
                  assert marker in sql65, marker
              assert "sources:['ATLAS','RES','SII_REGISTRY']" in js
          print('RES federated entity master successor contract OK')
          PY
