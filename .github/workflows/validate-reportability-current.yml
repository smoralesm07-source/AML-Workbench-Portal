name: Validate Reportabilidad · ATLAS current

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-reportability-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current methodology authority
        run: |
          node --check atlas-reportability-current.js
          node tests/atlas-reportability-current.mjs
      - name: Build canonical ATLAS candidate
        run: |
          python tools/build_atlas_site.py --out _site-reportability
          test -f _site-reportability/index.html
          test -f _site-reportability/atlas-runtime-current.css
          grep -R -q 'ROS_PER_SO+IIR' _site-reportability/atlas-runtime-current-*.js
          grep -R -q "legacy_ros_per_100:'TRACEABILITY_ONLY'" _site-reportability/atlas-runtime-current-*.js
