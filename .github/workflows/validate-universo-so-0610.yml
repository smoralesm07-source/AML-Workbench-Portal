name: Validate Universo SO 0610

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis
        run: node --check assets/atlas-universo-so-0610.js
      - name: Contrato 0610
        run: node tests/atlas-universo-so-0610.mjs
      - name: Publicación
        run: |
          python tools/build_atlas_site.py --out _site
          test -s _site/assets/atlas-universo-so-0610.js
          grep -q 'atlas-universo-so-0610.js?v=0610-1' _site/index.html
