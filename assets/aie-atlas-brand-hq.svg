<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AIE · ATLAS AML</title>
  <desc id="desc">Identidad visual AIE con red orbital, nodo naranja y denominación ATLAS AML.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fb"/>
      <stop offset="0.48" stop-color="#d9dde1"/>
      <stop offset="1" stop-color="#aeb5bc"/>
    </linearGradient>
    <linearGradient id="silverSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f5f7"/>
      <stop offset="1" stop-color="#c6ccd2"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3d"/>
      <stop offset="1" stop-color="#ff7414"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.35" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- AIE orbital mark -->
  <g transform="translate(28 18)" fill="none" stroke="url(#silver)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 128 C91 42, 188 16, 270 26" stroke-width="13"/>
    <path d="M128 72 C174 31, 231 30, 282 54" stroke-width="8" opacity=".93"/>
    <path d="M121 368 C188 430, 294 440, 365 378" stroke-width="11"/>
    <path d="M258 409 C315 400, 360 367, 386 316" stroke-width="8" opacity=".95"/>

    <g stroke-width="11">
      <path d="M71 180 L207 229"/>
      <path d="M182 101 L232 191"/>
      <path d="M127 308 L218 268"/>
      <path d="M260 307 L258 367"/>
      <path d="M302 238 L377 241"/>
      <path d="M292 199 L343 128"/>
    </g>

    <circle cx="253" cy="244" r="57" stroke-width="13"/>
    <circle cx="173" cy="89" r="22" stroke-width="12"/>
    <circle cx="258" cy="391" r="22" stroke-width="12"/>
    <circle cx="398" cy="243" r="23" stroke-width="12"/>

    <g fill="url(#silverSoft)" stroke="none">
      <circle cx="45" cy="171" r="34"/>
      <circle cx="105" cy="321" r="32"/>
    </g>

    <g transform="translate(347 61)">
      <circle cx="0" cy="0" r="39" fill="url(#orange)" stroke="none"/>
      <g stroke="#fff" stroke-width="5.5" filter="url(#softGlow)">
        <circle cx="0" cy="0" r="19"/>
        <path d="M0 -30 V-17 M0 17 V30 M-30 0 H-17 M17 0 H30"/>
        <path d="M-7 7 L8 -8 M8 -8 L5 2 M8 -8 L-2 -5"/>
      </g>
    </g>
  </g>

  <!-- AIE wordmark -->
  <g transform="translate(480 94)">
    <text x="0" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="260" font-weight="500" letter-spacing="12" fill="url(#silver)">AIE</text>
  </g>

  <!-- ATLAS AML descriptor -->
  <text x="600" y="492" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="30" fill="url(#silverSoft)">ATLAS AML</text>
</svg>